<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <title>Cozy Planner | KINO</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Baloo 2', sans-serif;
      background: #fff8fa;
      color: #5f4a50;
      line-height: 1.6;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      background: #ffffff;
      padding: 25px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      text-decoration: none;

      font-size: 28px;
      font-weight: 700;

      color: #c47794;

      letter-spacing: 3px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    nav a {
      text-decoration: none;
      color: #6f5b61;
      font-size: 15px;
    }

    nav a:hover {
      color: #c47794;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      background: #fce9ee;

      text-align: center;

      padding: 70px 20px;

      border-radius:
        0 0 45px 45px;
    }

    .hero h1 {
      color: #b96f84;

      font-size: 42px;

      margin-bottom: 12px;
    }

    .hero p {
      font-size: 17px;
      color: #806b72;
    }


    /* =========================
       PRODUCTS
    ========================= */

    .products {
      padding: 65px 7%;

      max-width: 1200px;

      margin: auto;
    }

    .products-title {
      text-align: center;

      margin-bottom: 40px;
    }

    .products-title h2 {
      color: #b96f84;

      font-size: 30px;

      margin-bottom: 8px;
    }

    .products-title p {
      color: #8a747b;
    }


    /* =========================
       PRODUCT GRID
    ========================= */

    .product-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 25px;
    }


    /* =========================
       PRODUCT CARD
    ========================= */

    .product-card {
      background: #ffffff;

      padding: 30px;

      border-radius: 25px;

      text-align: center;

      box-shadow:
        0 8px 25px
        rgba(190,130,145,0.08);

      transition: 0.2s;
    }

    .product-card:hover {
      transform:
        translateY(-3px);

      box-shadow:
        0 10px 30px
        rgba(190,130,145,0.12);
    }


    /* =========================
       IMAGE
    ========================= */

    .product-card img {
      width: 100%;

      max-width: 180px;

      height: 180px;

      object-fit: cover;

      border-radius: 18px;

      margin-bottom: 18px;
    }


    /* =========================
       CATEGORY
    ========================= */

    .category-label {
      display: inline-block;

      background: #fde6ee;

      color: #b96f84;

      padding: 4px 12px;

      border-radius: 20px;

      font-size: 12px;

      margin-bottom: 12px;
    }


    /* =========================
       NAME
    ========================= */

    .product-card h3 {
      color: #674f57;

      font-size: 21px;

      margin-bottom: 10px;
    }


    /* =========================
       DESCRIPTION
    ========================= */

    .product-card p {
      color: #8a747b;

      margin-bottom: 18px;
    }


    /* =========================
       PRICE
    ========================= */

    .price {
      font-size: 22px;

      font-weight: bold;

      color: #b96f84;

      margin-bottom: 18px;
    }


    /* =========================
   VIEW DETAILS BUTTON
========================= */

.details-button {

  display: inline-block;

  background: #cf8799;

  color: white;

  text-decoration: none;

  padding: 11px 28px;

  border-radius: 30px;

  font-size: 14px;

  transition: 0.2s;
}

.details-button:hover {

  background: #bd7188;

  transform:
    translateY(-1px);
}


    /* =========================
       LOADING / MESSAGE
    ========================= */

    .loading,
    .message {
      grid-column: 1 / -1;

      text-align: center;

      padding: 50px 20px;

      color: #9a858b;

      font-size: 16px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #fce9ee;

      text-align: center;

      padding: 35px 20px;

      color: #8a747b;

      font-size: 14px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      header {
        padding: 20px;

        flex-direction: column;

        gap: 10px;
      }

      nav {
        gap: 16px;

        flex-wrap: wrap;

        justify-content: center;
      }

      .hero h1 {
        font-size: 32px;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <a
      href="index.html"
      class="logo"
    >
      KINO
    </a>


    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="shop.html">
        Shop
      </a>

      <a href="cart.html">
        Cart
      </a>

      <a href="affiliate.html">
        Affiliate
      </a>

    </nav>

  </header>



  <!-- =========================
       HERO
  ========================= -->

  <section class="hero">

    <h1>
      Cozy Planner ♡
    </h1>

    <p>
      Simple and cozy planners for your everyday little moments.
    </p>

  </section>



  <!-- =========================
       PRODUCTS
  ========================= -->

  <section class="products">

    <div class="products-title">

      <h2>
        Planner Collection
      </h2>

      <p>
        Choose your favourite KINO planner ♡
      </p>

    </div>


    <div
      id="product-grid"
      class="product-grid"
    >

      <div class="loading">
        Loading planners... ♡
      </div>

    </div>

  </section>



  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    Made for cozy moments ♡

  </footer>



  <!-- =========================
       SUPABASE
  ========================= -->

  <script>

    const SUPABASE_URL =
      "https://vbdgzsapdbpgfcdksdoi.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";


    const {
      createClient
    } = supabase;


    const db =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const productGrid =
      document.getElementById(
        "product-grid"
      );


    /* =========================
       LOAD PLANNER PRODUCTS
    ========================= */

    async function loadPlannerProducts() {

      try {

        const {
          data,
          error
        } = await db

          .from("products")

          .select(
            "id, category, name, description, price, image_url, product_page"
          )

          .eq(
            "category",
            "planner"
          )

          .eq(
            "is_active",
            true
          )

          .order(
            "id",
            {
              ascending: true
            }
          );


        /* =========================
           ERROR
        ========================= */

        if (error) {

          console.error(
            "PLANNER PRODUCT ERROR:",
            error
          );

          productGrid.innerHTML = `
            <div class="message">
              Unable to load planner products right now ♡
            </div>
          `;

          return;

        }


        /* =========================
           NO PRODUCTS
        ========================= */

        if (
          !data ||
          data.length === 0
        ) {

          productGrid.innerHTML = `
            <div class="message">
              No planner products available right now ♡
            </div>
          `;

          return;

        }


        /* =========================
           CLEAR LOADING
        ========================= */

        productGrid.innerHTML = "";


        /* =========================
           CREATE CARDS
        ========================= */

        data.forEach(
          product => {

            const card =
              document.createElement(
                "div"
              );

            card.className =
              "product-card";


            /* IMAGE */

            const image =
              document.createElement(
                "img"
              );

            image.src =
              product.image_url
              ||
              "https://placehold.co/600x600/ffdfe8/765b63?text=KINO";

            image.alt =
              product.name;


            /* CATEGORY */

            const category =
              document.createElement(
                "div"
              );

            category.className =
              "category-label";

            category.textContent =
              "Planner";


            /* NAME */

            const name =
              document.createElement(
                "h3"
              );

            name.textContent =
              product.name;


            /* DESCRIPTION */

            const description =
              document.createElement(
                "p"
              );

            description.textContent =
              product.description
              ||
              "";


            /* PRICE */

            const price =
              document.createElement(
                "div"
              );

            price.className =
              "price";

            price.textContent =
              "RM" +
              Number(
                product.price
              ).toFixed(2);


            /* VIEW DETAILS */

            const button =
              document.createElement(
                "a"
              );

            button.className =
              "details-button";

            button.textContent =
              "VIEW DETAILS";


            /*
              Product detail page
              is stored in Supabase.
            */

            button.href =
              product.product_page
              ||
              "#";


            /* ADD TO CARD */

            card.appendChild(
              image
            );

            card.appendChild(
              category
            );

            card.appendChild(
              name
            );

            card.appendChild(
              description
            );

            card.appendChild(
              price
            );

            card.appendChild(
              button
            );


            productGrid.appendChild(
              card
            );

          }
        );

      }

      catch (error) {

        console.error(
          "PLANNER LOAD ERROR:",
          error
        );

        productGrid.innerHTML = `
          <div class="message">
            Something went wrong while loading planners ♡
          </div>
        `;

      }

    }


    /* =========================
       START
    ========================= */

    loadPlannerProducts();

  </script>


</body>

</html>
