<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>KINO Admin</title>

<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff8fb;
  color: #8a747b;
  font-family: 'Baloo 2', sans-serif;
}

button,
input {
  font-family: inherit;
}

/* =========================
   LOGIN
========================= */

#login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 440px;
  background: white;
  padding: 45px 40px;
  border-radius: 28px;
  box-shadow: 0 8px 30px rgba(190,130,150,0.12);
}

.login-logo {
  text-align: center;
  color: #b96f8a;
  font-size: 34px;
  font-weight: 700;
  margin-bottom: 5px;
}

.login-title {
  text-align: center;
  font-size: 18px;
  margin-bottom: 30px;
}

.input-group {
  margin-bottom: 18px;
}

.input-group label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #eadce2;
  border-radius: 15px;
  outline: none;
  font-size: 15px;
}

.input-group input:focus {
  border-color: #d9829e;
}

.login-button {
  width: 100%;
  border: none;
  background: #d9829e;
  color: white;
  padding: 14px;
  border-radius: 20px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.login-button:disabled {
  opacity: 0.6;
}

.login-error {
  display: none;
  background: #fff0f3;
  color: #a96b82;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 18px;
  text-align: center;
}

/* =========================
   DASHBOARD
========================= */

#dashboard-page {
  display: none;
}

header {
  background: white;
  padding: 18px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 15px rgba(190,130,150,0.06);
}

.logo {
  color: #b96f8a;
  font-size: 25px;
  font-weight: 700;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.admin-label {
  font-size: 14px;
}

.logout-button {
  border: none;
  background: #f7dce5;
  color: #a96b82;
  padding: 8px 15px;
  border-radius: 18px;
  cursor: pointer;
}

/* =========================
   DASHBOARD
========================= */

.dashboard {
  max-width: 1000px;
  margin: 40px auto;
  padding: 20px;
}

h1 {
  color: #b96f8a;
  font-size: 32px;
  margin-bottom: 25px;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 30px;
}

.summary-box {
  background: white;
  padding: 22px;
  border-radius: 20px;
  box-shadow: 0 5px 18px rgba(190,130,150,0.10);
}

.summary-label {
  font-size: 14px;
}

.summary-number {
  color: #b96f8a;
  font-size: 28px;
  font-weight: 700;
}

/* =========================
   ORDER CARD
========================= */

.order-card {
  background: white;
  padding: 22px;
  border-radius: 20px;
  margin-bottom: 15px;
  box-shadow: 0 5px 18px rgba(190,130,150,0.10);
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 12px;
}

.order-code {
  color: #b96f8a;
  font-weight: 700;
  font-size: 17px;
}

.status {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  background: #fde6ee;
  color: #a96b82;
}

.status.paid {
  background: #e5f6ec;
  color: #4f8a68;
}

.status.rejected {
  background: #f1eeee;
  color: #777;
}

/* =========================
   CUSTOMER
========================= */

.customer {
  margin-bottom: 15px;
  line-height: 1.5;
}

.customer strong {
  color: #80656e;
  font-size: 17px;
}

/* =========================
   PRODUCTS
========================= */

.products-box {
  background: #fff8fb;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 15px;
}

.products-title {
  color: #b96f8a;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 10px;
}

.product-row {
  background: white;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.product-row:last-child {
  margin-bottom: 0;
}

.product-name {
  font-weight: 600;
  color: #80656e;
}

.product-details {
  font-size: 13px;
  color: #a8989d;
  margin-top: 2px;
}

.product-price {
  text-align: right;
  white-space: nowrap;
  color: #9d7483;
  font-weight: 600;
}

/* =========================
   TOTAL
========================= */

.total {
  font-size: 21px;
  font-weight: 700;
  color: #b96f8a;
  margin-bottom: 8px;
}

.order-date {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 15px;
}

/* =========================
   BUTTONS
========================= */

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.actions button {
  border: none;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}

.actions button:active {
  transform: scale(0.98);
}

.proof-button {
  background: #f7dce5;
  color: #a96b82;
}

.paid-button {
  background: #d9829e;
  color: white;
}

.reject-button {
  background: #f7dce5;
  color: #a96b82;
}

.email-button {
  background: #b96f8a;
  color: white;
}

.copy-button {
  background: #eee4e8;
  color: #80656e;
}

/* =========================
   MESSAGES
========================= */

.loading,
.empty,
.error {
  background: white;
  padding: 35px;
  text-align: center;
  border-radius: 20px;
}

.error {
  color: #a96b82;
  background: #fff0f3;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

  .summary {
    grid-template-columns: 1fr;
  }

  .dashboard {
    margin: 25px auto;
    padding: 15px;
  }

  header {
    padding: 15px 5%;
  }

  .header-right {
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .order-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .product-row {
    align-items: flex-start;
  }

  .product-price {
    font-size: 13px;
  }

  .actions button {
    width: 100%;
  }

}

</style>

</head>


<body>


<!-- =========================================
     LOGIN
========================================= -->

<section id="login-page">

  <div class="login-box">

    <div class="login-logo">
      KINO ♡
    </div>

    <div class="login-title">
      Admin Dashboard
    </div>

    <div
      id="login-error"
      class="login-error"
    ></div>

    <form id="login-form">

      <div class="input-group">

        <label>Email</label>

        <input
          type="email"
          id="login-email"
          placeholder="Admin email"
          required
        >

      </div>


      <div class="input-group">

        <label>Password</label>

        <input
          type="password"
          id="login-password"
          placeholder="Password"
          required
        >

      </div>


      <button
        type="submit"
        class="login-button"
        id="login-button"
      >
        LOGIN
      </button>

    </form>

  </div>

</section>


<!-- =========================================
     DASHBOARD
========================================= -->

<section id="dashboard-page">

<header>

  <div class="logo">
    KINO
  </div>

  <div class="header-right">

    <div class="admin-label">
      Admin Dashboard
    </div>

    <button
      class="logout-button"
      onclick="logout()"
    >
      LOGOUT
    </button>

  </div>

</header>


<main class="dashboard">

  <h1>
    Orders ♡
  </h1>


  <div class="summary">

    <div class="summary-box">

      <div class="summary-label">
        Pending Orders
      </div>

      <div
        class="summary-number"
        id="pending-count"
      >
        0
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        Paid Orders
      </div>

      <div
        class="summary-number"
        id="paid-count"
      >
        0
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        Total Sales
      </div>

      <div
        class="summary-number"
        id="sales-total"
      >
        RM0.00
      </div>

    </div>

  </div>


  <div id="orders">

    <div class="loading">
      Loading orders...
    </div>

  </div>

</main>

</section>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://vbdgzsapdbpgfcdksdoi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const loginPage =
  document.getElementById("login-page");

const dashboardPage =
  document.getElementById("dashboard-page");

const loginForm =
  document.getElementById("login-form");

const loginError =
  document.getElementById("login-error");

const loginButton =
  document.getElementById("login-button");

const ordersContainer =
  document.getElementById("orders");

const pendingCount =
  document.getElementById("pending-count");

const paidCount =
  document.getElementById("paid-count");

const salesTotal =
  document.getElementById("sales-total");


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    loginError.style.display = "none";

    loginButton.disabled = true;

    loginButton.textContent =
      "LOGGING IN...";


    const email =
      document
        .getElementById("login-email")
        .value
        .trim();


    const password =
      document
        .getElementById("login-password")
        .value;


    const { error } =
      await db.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      console.error(error);

      loginError.textContent =
        "Email atau password salah.";

      loginError.style.display =
        "block";

      loginButton.disabled = false;

      loginButton.textContent =
        "LOGIN";

      return;

    }


    /*
      RLS akan menentukan sama ada
      account ini boleh baca orders.
    */

    const { error: adminError } =
      await db
        .from("orders")
        .select("id")
        .limit(1);


    if (adminError) {

      console.error(adminError);

      await db.auth.signOut();

      loginError.textContent =
        "Access denied. Admin sahaja boleh masuk.";

      loginError.style.display =
        "block";

      loginButton.disabled = false;

      loginButton.textContent =
        "LOGIN";

      return;

    }


    await showDashboard();

  }
);


/* =========================================
   SHOW DASHBOARD
========================================= */

async function showDashboard() {

  loginPage.style.display = "none";

  dashboardPage.style.display = "block";

  await loadOrders();

}


/* =========================================
   CHECK SESSION
========================================= */

async function checkSession() {

  const {
    data: {
      session
    }
  } = await db.auth.getSession();


  if (!session) {

    loginPage.style.display = "flex";

    dashboardPage.style.display = "none";

    return;

  }


  const { error } =
    await db
      .from("orders")
      .select("id")
      .limit(1);


  if (error) {

    await db.auth.signOut();

    loginPage.style.display = "flex";

    dashboardPage.style.display = "none";

    return;

  }


  await showDashboard();

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders() {

  ordersContainer.innerHTML = `
    <div class="loading">
      Loading orders...
    </div>
  `;


  /* -----------------------------------------
     GET ORDERS
  ----------------------------------------- */

  const {
    data: orders,
    error: ordersError
  } = await db
    .from("orders")
    .select("*")
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (ordersError) {

    console.error(ordersError);

    ordersContainer.innerHTML = `
      <div class="error">
        Unable to load orders.<br><br>
        ${escapeHtml(ordersError.message)}
      </div>
    `;

    return;

  }


  const orderList =
    orders || [];


  /* -----------------------------------------
     GET ORDER ITEMS
  ----------------------------------------- */

  let orderItems = [];


  if (orderList.length > 0) {

    const orderIds =
      orderList.map(
        order => order.id
      );


    const {
      data: items,
      error: itemsError
    } = await db
      .from("order_items")
      .select("*")
      .in(
        "order_id",
        orderIds
      );


    if (itemsError) {

      console.error(itemsError);

      ordersContainer.innerHTML = `
        <div class="error">
          Orders loaded, but product information
          could not be loaded.<br><br>
          ${escapeHtml(itemsError.message)}
        </div>
      `;

      return;

    }


    orderItems =
      items || [];

  }


  /* -----------------------------------------
     GROUP ITEMS BY ORDER
  ----------------------------------------- */

  const itemsByOrder = {};


  orderItems.forEach(
    item => {

      if (
        !itemsByOrder[item.order_id]
      ) {

        itemsByOrder[item.order_id] = [];

      }


      itemsByOrder[item.order_id].push(
        item
      );

    }
  );


  /* -----------------------------------------
     SUMMARY
  ----------------------------------------- */

  updateSummary(
    orderList
  );


  if (orderList.length === 0) {

    ordersContainer.innerHTML = `
      <div class="empty">
        No orders yet ♡
      </div>
    `;

    return;

  }


  ordersContainer.innerHTML = "";


  /* -----------------------------------------
     RENDER ORDERS
  ----------------------------------------- */

  orderList.forEach(
    order => {

      const card =
        document.createElement("div");

      card.className =
        "order-card";


      const status =
        String(
          order.status || "pending"
        );


      const statusClass =
        status === "paid"
          ? "paid"
          : status === "rejected"
            ? "rejected"
            : "";


      const createdAt =
        order.created_at
          ? new Date(
              order.created_at
            ).toLocaleString(
              "en-MY"
            )
          : "-";


      const products =
        itemsByOrder[order.id] || [];


      /* -------------------------------------
         PRODUCT HTML
      ------------------------------------- */

      let productsHtml = "";


      if (products.length === 0) {

        productsHtml = `
          <div class="product-row">
            <div>
              <div class="product-name">
                No product information
              </div>
            </div>
          </div>
        `;

      }
      else {

        products.forEach(
          item => {

            const productName =
              item.product_name ||
              "Unnamed Product";


            const price =
              Number(
                item.product_price || 0
              );


            const quantity =
              Number(
                item.quantity || 1
              );


            const subtotal =
              Number(
                item.subtotal ??
                price * quantity
              );


            productsHtml += `

              <div class="product-row">

                <div>

                  <div class="product-name">
                    ${escapeHtml(
                      productName
                    )}
                  </div>

                  <div class="product-details">
                    RM${price.toFixed(2)}
                    ×
                    ${quantity}
                  </div>

                </div>


                <div class="product-price">
                  RM${subtotal.toFixed(2)}
                </div>

              </div>

            `;

          }
        );

      }


      /* -------------------------------------
         PAYMENT PROOF
      ------------------------------------- */

      let proofButton = "";


      if (
        order.payment_proof_path
      ) {

        proofButton = `

          <button
            class="proof-button"
            onclick="viewPaymentProof(
              '${encodeURIComponent(
                order.payment_proof_path
              )}'
            )"
          >
            VIEW PAYMENT PROOF
          </button>

        `;

      }


      /* -------------------------------------
         ACTION BUTTONS
      ------------------------------------- */

      let actionButtons = "";


      if (status === "pending") {

        actionButtons = `

          ${proofButton}

          <button
            class="paid-button"
            onclick="updateStatus(
              '${escapeHtml(order.id)}',
              'paid'
            )"
          >
            MARK AS PAID
          </button>

          <button
            class="reject-button"
            onclick="updateStatus(
              '${escapeHtml(order.id)}',
              'rejected'
            )"
          >
            REJECT
          </button>

        `;

      }


      if (status === "paid") {

        actionButtons = `

          ${proofButton}

          <button
            class="email-button"
            onclick="emailCustomer(
              '${escapeHtml(order.id)}'
            )"
          >
            EMAIL CUSTOMER
          </button>

          <button
            class="copy-button"
            onclick="copyOrderInfo(
              '${escapeHtml(order.id)}'
            )"
          >
            COPY ORDER INFO
          </button>

        `;

      }


      if (status === "rejected") {

        actionButtons = `

          ${proofButton}

        `;

      }


      /* -------------------------------------
         SAVE ORDER DATA FOR BUTTONS
      ------------------------------------- */

      window.kinoOrders =
        window.kinoOrders || {};


      window.kinoOrders[order.id] = {

        order: order,

        products: products

      };


      /* -------------------------------------
         CARD HTML
      ------------------------------------- */

      card.innerHTML = `

        <div class="order-header">

          <div class="order-code">
            ${escapeHtml(
              order.order_code
            )}
          </div>

          <div
            class="status ${statusClass}"
          >
            ${escapeHtml(status)}
          </div>

        </div>


        <div class="customer">

          <strong>
            ${escapeHtml(
              order.customer_name
            )}
          </strong>

          <br>

          ${escapeHtml(
            order.customer_email
          )}

        </div>


        <div class="products-box">

          <div class="products-title">
            Products
          </div>

          ${productsHtml}

        </div>


        <div class="total">
          RM${Number(
            order.total || 0
          ).toFixed(2)}
        </div>


        <div class="order-date">
          ${escapeHtml(createdAt)}
        </div>


        <div class="actions">

          ${actionButtons}

        </div>

      `;


      ordersContainer.appendChild(
        card
      );

    }
  );

}


/* =========================================
   VIEW PAYMENT PROOF
========================================= */

async function viewPaymentProof(
  encodedPath
) {

  const path =
    decodeURIComponent(
      encodedPath
    );


  try {

    const {
      data,
      error
    } = await db.storage
      .from("payment-proofs")
      .createSignedUrl(
        path,
        300
      );


    if (error) {

      console.error(error);

      alert(
        "Unable to open payment proof.\n\n" +
        error.message
      );

      return;

    }


    if (
      !data ||
      !data.signedUrl
    ) {

      alert(
        "Payment proof was not found."
      );

      return;

    }


    window.open(
      data.signedUrl,
      "_blank"
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "Unable to open payment proof."
    );

  }

}


/* =========================================
   UPDATE STATUS
========================================= */

async function updateStatus(
  orderId,
  status
) {

  const action =
    status === "paid"
      ? "mark this order as PAID"
      : "REJECT this order";


  const confirmed =
    confirm(
      `Are you sure you want to ${action}?`
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } = await db
    .from("orders")
    .update({
      status: status
    })
    .eq(
      "id",
      orderId
    );


  if (error) {

    console.error(error);

    alert(
      "Unable to update order.\n\n" +
      error.message
    );

    return;

  }


  await loadOrders();

}


/* =========================================
   MAKE ORDER TEXT
========================================= */

function makeOrderText(
  orderId
) {

  const saved =
    window.kinoOrders?.[orderId];


  if (!saved) {

    return "";

  }


  const order =
    saved.order;


  const products =
    saved.products || [];


  let productText = "";


  products.forEach(
    item => {

      const name =
        item.product_name ||
        "Unnamed Product";


      const price =
        Number(
          item.product_price || 0
        );


      const quantity =
        Number(
          item.quantity || 1
        );


      const subtotal =
        Number(
          item.subtotal ??
          price * quantity
        );


      productText +=
        `- ${name} × ${quantity} = RM${subtotal.toFixed(2)}\n`;

    }
  );


  return (
    `KINO ORDER\n\n` +

    `Order: ${order.order_code}\n` +

    `Customer: ${order.customer_name}\n` +

    `Email: ${order.customer_email}\n\n` +

    `Products:\n` +

    productText +

    `\nTotal: RM${Number(
      order.total || 0
    ).toFixed(2)}`
  );

}


/* =========================================
   COPY ORDER INFO
========================================= */

async function copyOrderInfo(
  orderId
) {

  const text =
    makeOrderText(
      orderId
    );


  if (!text) {

    alert(
      "Order information not found."
    );

    return;

  }


  try {

    await navigator.clipboard.writeText(
      text
    );


    alert(
      "Order info copied! ♡"
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "Unable to copy order info."
    );

  }

}


/* =========================================
   EMAIL CUSTOMER
========================================= */

function emailCustomer(
  orderId
) {

  const saved =
    window.kinoOrders?.[orderId];


  if (!saved) {

    alert(
      "Order information not found."
    );

    return;

  }


  const order =
    saved.order;


  const products =
    saved.products || [];


  let productText = "";


  products.forEach(
    item => {

      const name =
        item.product_name ||
        "Unnamed Product";


      const quantity =
        Number(
          item.quantity || 1
        );


      const subtotal =
        Number(
          item.subtotal || 0
        );


      productText +=
        `• ${name} × ${quantity} — RM${subtotal.toFixed(2)}%0A`;

    }
  );


  const subject =
    encodeURIComponent(
      `KINO Digital Product - ${order.order_code}`
    );


  const body =
    encodeURIComponent(
      `Hi ${order.customer_name},

Thank you for your purchase from KINO ♡

Order: ${order.order_code}

Products:
${products.map(
  item =>
    `• ${item.product_name || "Product"} × ${Number(item.quantity || 1)} — RM${Number(item.subtotal || 0).toFixed(2)}`
).join("\n")}

Total: RM${Number(order.total || 0).toFixed(2)}

Your digital product is attached in this email.

Thank you for supporting KINO ♡`
    );


  const email =
    encodeURIComponent(
      order.customer_email || ""
    );


  /*
    Buka Gmail compose.
    PDF masih attach secara manual.
  */

  const gmailUrl =
    `https://mail.google.com/mail/?view=cm&fs=1&to=${email}&su=${subject}&body=${body}`;


  window.open(
    gmailUrl,
    "_blank"
  );

}


/* =========================================
   SUMMARY
========================================= */

function updateSummary(
  orders
) {

  const pending =
    orders.filter(
      order =>
        order.status === "pending"
    ).length;


  const paid =
    orders.filter(
      order =>
        order.status === "paid"
    ).length;


  const sales =
    orders
      .filter(
        order =>
          order.status === "paid"
      )
      .reduce(
        (
          sum,
          order
        ) =>
          sum +
          Number(
            order.total || 0
          ),
        0
      );


  pendingCount.textContent =
    pending;


  paidCount.textContent =
    paid;


  salesTotal.textContent =
    "RM" +
    sales.toFixed(2);

}
