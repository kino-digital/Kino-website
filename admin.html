<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>KINO Admin Dashboard</title>

<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff8fb;
  color: #8a747b;
  font-family: "Baloo 2", sans-serif;
}

button,
input {
  font-family: inherit;
}

/* =========================
   LOGIN
========================= */

#login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 440px;
  background: white;
  padding: 45px 40px;
  border-radius: 28px;
  box-shadow: 0 8px 30px rgba(190,130,150,.12);
}

.login-logo {
  text-align: center;
  color: #b96f8a;
  font-size: 34px;
  font-weight: 700;
}

.login-title {
  text-align: center;
  font-size: 18px;
  margin-bottom: 30px;
}

.input-group {
  margin-bottom: 18px;
}

.input-group label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #eadce2;
  border-radius: 15px;
  outline: none;
  font-size: 15px;
}

.input-group input:focus {
  border-color: #d9829e;
}

.login-button {
  width: 100%;
  border: none;
  background: #d9829e;
  color: white;
  padding: 14px;
  border-radius: 20px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.login-button:disabled {
  opacity: .6;
}

.login-error {
  display: none;
  background: #fff0f3;
  color: #a96b82;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 18px;
  text-align: center;
}

/* =========================
   DASHBOARD
========================= */

#dashboard-page {
  display: none;
}

header {
  background: white;
  padding: 18px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 15px rgba(190,130,150,.06);
}

.logo {
  color: #b96f8a;
  font-size: 25px;
  font-weight: 700;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.admin-label {
  font-size: 14px;
}

.logout-button {
  border: none;
  background: #f7dce5;
  color: #a96b82;
  padding: 8px 15px;
  border-radius: 18px;
  cursor: pointer;
}

.dashboard {
  max-width: 1100px;
  margin: 40px auto;
  padding: 20px;
}

h1 {
  color: #b96f8a;
  font-size: 32px;
  margin: 0 0 25px;
}

/* =========================
   SALES CARDS
========================= */

.sales-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 15px;
}

.sales-card {
  background: white;
  padding: 23px;
  border-radius: 22px;
  box-shadow: 0 5px 18px rgba(190,130,150,.10);
}

.sales-label {
  font-size: 14px;
  margin-bottom: 5px;
}

.sales-value {
  color: #b96f8a;
  font-size: 29px;
  font-weight: 700;
}

.sales-sub {
  font-size: 12px;
  color: #aaa;
  margin-top: 3px;
}

/* =========================
   ORDER SUMMARY
========================= */

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 35px;
}

.summary-box {
  background: white;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 5px 18px rgba(190,130,150,.10);
}

.summary-label {
  font-size: 14px;
}

.summary-number {
  color: #b96f8a;
  font-size: 27px;
  font-weight: 700;
}

/* =========================
   ORDERS TITLE
========================= */

.orders-title {
  color: #b96f8a;
  font-size: 25px;
  font-weight: 700;
  margin-bottom: 18px;
}

/* =========================
   ORDER CARD
========================= */

.order-card {
  background: white;
  padding: 23px;
  border-radius: 22px;
  margin-bottom: 16px;
  box-shadow: 0 5px 18px rgba(190,130,150,.10);
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 15px;
}

.order-code {
  color: #b96f8a;
  font-weight: 700;
  font-size: 18px;
}

.status {
  padding: 5px 13px;
  border-radius: 20px;
  font-size: 12px;
  background: #fde6ee;
  color: #a96b82;
}

.status.paid {
  background: #e5f6ec;
  color: #4f8a68;
}

.status.rejected {
  background: #f1eeee;
  color: #777;
}

.customer {
  line-height: 1.5;
  margin-bottom: 12px;
}

.customer-name {
  color: #6f5960;
  font-weight: 600;
}

.customer-email {
  font-size: 14px;
}

/* =========================
   PRODUCTS
========================= */

.products-box {
  background: #fff8fb;
  padding: 15px;
  border-radius: 16px;
  margin: 15px 0;
}

.products-title {
  color: #b96f8a;
  font-weight: 600;
  margin-bottom: 8px;
}

.product-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 6px 0;
  font-size: 14px;
  border-bottom: 1px dashed #eadce2;
}

.product-row:last-child {
  border-bottom: none;
}

.product-name {
  color: #6f5960;
}

.product-price {
  white-space: nowrap;
}

.total {
  font-size: 21px;
  font-weight: 700;
  color: #b96f8a;
  margin: 15px 0 5px;
}

.order-date {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 16px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.actions button {
  border: none;
  padding: 9px 15px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
}

.proof-button {
  background: #f7dce5;
  color: #a96b82;
}

.paid-button {
  background: #d9829e;
  color: white;
}

.reject-button {
  background: #f7dce5;
  color: #a96b82;
}

.email-button {
  background: #eadff8;
  color: #76588d;
}

.email-button:hover {
  opacity: .85;
}

/* =========================
   STATES
========================= */

.loading,
.empty,
.error {
  background: white;
  padding: 35px;
  text-align: center;
  border-radius: 20px;
}

.error {
  color: #a96b82;
  background: #fff0f3;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 750px) {

  .sales-grid,
  .summary {
    grid-template-columns: 1fr;
  }

  .dashboard {
    margin: 25px auto;
    padding: 15px;
  }

  header {
    padding: 15px 5%;
  }

  .header-right {
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .order-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .product-row {
    flex-direction: column;
    gap: 2px;
  }

}

</style>

</head>


<body>


<!-- =========================================
     LOGIN
========================================= -->

<section id="login-page">

  <div class="login-box">

    <div class="login-logo">
      KINO ♡
    </div>

    <div class="login-title">
      Admin Dashboard
    </div>

    <div
      id="login-error"
      class="login-error"
    ></div>

    <form id="login-form">

      <div class="input-group">

        <label>Email</label>

        <input
          type="email"
          id="login-email"
          placeholder="Admin email"
          required
        >

      </div>

      <div class="input-group">

        <label>Password</label>

        <input
          type="password"
          id="login-password"
          placeholder="Password"
          required
        >

      </div>

      <button
        type="submit"
        class="login-button"
        id="login-button"
      >
        LOGIN
      </button>

    </form>

  </div>

</section>


<!-- =========================================
     DASHBOARD
========================================= -->

<section id="dashboard-page">

<header>

  <div class="logo">
    KINO
  </div>

  <div class="header-right">

    <div class="admin-label">
      Admin Dashboard
    </div>

    <button
      class="logout-button"
      onclick="logout()"
    >
      LOGOUT
    </button>

  </div>

</header>


<main class="dashboard">

  <h1>
    Dashboard ♡
  </h1>


  <!-- =======================================
       SALES
  ======================================== -->

  <div class="sales-grid">

    <div class="sales-card">

      <div class="sales-label">
        Today's Sales
      </div>

      <div
        class="sales-value"
        id="today-sales"
      >
        RM0.00
      </div>

      <div class="sales-sub">
        Paid orders today
      </div>

    </div>


    <div class="sales-card">

      <div class="sales-label">
        This Month
      </div>

      <div
        class="sales-value"
        id="month-sales"
      >
        RM0.00
      </div>

      <div class="sales-sub">
        Paid orders this month
      </div>

    </div>


    <div class="sales-card">

      <div class="sales-label">
        Total Sales
      </div>

      <div
        class="sales-value"
        id="total-sales"
      >
        RM0.00
      </div>

      <div class="sales-sub">
        All paid orders
      </div>

    </div>

  </div>


  <!-- =======================================
       ORDER COUNTS
  ======================================== -->

  <div class="summary">

    <div class="summary-box">

      <div class="summary-label">
        Today's Orders
      </div>

      <div
        class="summary-number"
        id="today-orders"
      >
        0
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        Pending Orders
      </div>

      <div
        class="summary-number"
        id="pending-count"
      >
        0
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        Paid Orders
      </div>

      <div
        class="summary-number"
        id="paid-count"
      >
        0
      </div>

    </div>

  </div>


  <!-- =======================================
       ORDERS
  ======================================== -->

  <div class="orders-title">
    Orders ♡
  </div>

  <div id="orders">

    <div class="loading">
      Loading orders...
    </div>

  </div>

</main>

</section>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://vbdgzsapdbpgfcdksdoi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const loginPage =
  document.getElementById("login-page");

const dashboardPage =
  document.getElementById("dashboard-page");

const loginForm =
  document.getElementById("login-form");

const loginError =
  document.getElementById("login-error");

const loginButton =
  document.getElementById("login-button");

const ordersContainer =
  document.getElementById("orders");

const todaySales =
  document.getElementById("today-sales");

const monthSales =
  document.getElementById("month-sales");

const totalSales =
  document.getElementById("total-sales");

const todayOrders =
  document.getElementById("today-orders");

const pendingCount =
  document.getElementById("pending-count");

const paidCount =
  document.getElementById("paid-count");


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    loginError.style.display = "none";

    loginButton.disabled = true;

    loginButton.textContent =
      "LOGGING IN...";


    const email =
      document
        .getElementById("login-email")
        .value
        .trim();


    const password =
      document
        .getElementById("login-password")
        .value;


    const {
      error
    } =
      await db.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      console.error(error);

      loginError.textContent =
        "Email atau password salah.";

      loginError.style.display =
        "block";

      loginButton.disabled = false;

      loginButton.textContent =
        "LOGIN";

      return;

    }


    /*
      RLS decides whether
      this account can access orders.
    */

    const {
      error: adminError
    } =
      await db
        .from("orders")
        .select("id")
        .limit(1);


    if (adminError) {

      console.error(adminError);

      await db.auth.signOut();

      loginError.textContent =
        "Access denied. Admin sahaja boleh masuk.";

      loginError.style.display =
        "block";

      loginButton.disabled = false;

      loginButton.textContent =
        "LOGIN";

      return;

    }


    await showDashboard();

  }
);


/* =========================================
   SHOW DASHBOARD
========================================= */

async function showDashboard() {

  loginPage.style.display = "none";

  dashboardPage.style.display = "block";

  await loadOrders();

}


/* =========================================
   CHECK SESSION
========================================= */

async function checkSession() {

  const {
    data: {
      session
    }
  } = await db.auth.getSession();


  if (!session) {

    loginPage.style.display = "flex";

    dashboardPage.style.display = "none";

    return;

  }


  const {
    error
  } =
    await db
      .from("orders")
      .select("id")
      .limit(1);


  if (error) {

    await db.auth.signOut();

    loginPage.style.display = "flex";

    dashboardPage.style.display = "none";

    return;

  }


  await showDashboard();

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders() {

  ordersContainer.innerHTML = `
    <div class="loading">
      Loading orders...
    </div>
  `;


  const {
    data,
    error
  } =
    await db
      .from("orders")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    ordersContainer.innerHTML = `
      <div class="error">
        Unable to load orders.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    return;

  }


  const orders =
    data || [];


  updateDashboard(
    orders
  );


  if (orders.length === 0) {

    ordersContainer.innerHTML = `
      <div class="empty">
        No orders yet ♡
      </div>
    `;

    return;

  }


  /*
    Get order items separately.
  */

  const orderIds =
    orders.map(
      order => order.id
    );


  let orderItems = [];


  if (orderIds.length > 0) {

    const {
      data: itemsData,
      error: itemsError
    } =
      await db
        .from("order_items")
        .select("*")
        .in(
          "order_id",
          orderIds
        );


    if (!itemsError) {

      orderItems =
        itemsData || [];

    }

  }


  ordersContainer.innerHTML = "";


  orders.forEach(
    order => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "order-card";


      const status =
        String(
          order.status ||
          "pending"
        );


      const statusClass =
        status === "paid"
          ? "paid"
          : status === "rejected"
            ? "rejected"
            : "";


      const createdAt =
        order.created_at
          ? new Date(
              order.created_at
            ).toLocaleString(
              "en-MY"
            )
          : "-";


      /*
        PRODUCTS
      */

      const products =
        orderItems.filter(
          item =>
            item.order_id ===
            order.id
        );


      let productsHtml = "";


      if (
        products.length === 0
      ) {

        productsHtml = `
          <div class="product-row">
            <span class="product-name">
              Product information unavailable
            </span>
          </div>
        `;

      } else {

        productsHtml =
          products.map(
            item => {

              const quantity =
                Number(
                  item.quantity || 1
                );

              const subtotal =
                Number(
                  item.subtotal ||
                  (
                    Number(
                      item.product_price ||
                      0
                    ) *
                    quantity
                  )
                );


              return `

                <div class="product-row">

                  <span class="product-name">
                    ${escapeHtml(
                      item.product_name
                    )}
                    × ${quantity}
                  </span>

                  <span class="product-price">
                    RM${subtotal.toFixed(2)}
                  </span>

                </div>

              `;

            }
          ).join("");

      }


      /*
        PAYMENT PROOF
      */

      let proofButton = "";


      if (
        order.payment_proof_path
      ) {

        proofButton = `

          <button
            class="proof-button"
            onclick="viewPaymentProof(
              '${encodeURIComponent(
                order.payment_proof_path
              )}'
            )"
          >
            VIEW PAYMENT PROOF
          </button>

        `;

      }


      /*
        ACTION BUTTONS
      */

      let actionButtons = "";


      if (
        status === "pending"
      ) {

        actionButtons = `

          <button
            class="paid-button"
            onclick="updateStatus(
              '${order.id}',
              'paid'
            )"
          >
            MARK AS PAID
          </button>

          <button
            class="reject-button"
            onclick="updateStatus(
              '${order.id}',
              'rejected'
            )"
          >
            REJECT
          </button>

        `;

      }


      /*
        EMAIL BUTTON

        Opens Gmail on desktop
        and mail app / Gmail handler
        on supported phones.
      */

      const emailButton = `

        <button
          class="email-button"
          onclick="emailOrder(
            '${encodeURIComponent(
              order.customer_email || ""
            )}',
            '${encodeURIComponent(
              order.order_code || ""
            )}'
          )"
        >
          EMAIL ORDER
        </button>

      `;


      card.innerHTML = `

        <div class="order-header">

          <div class="order-code">

            ${escapeHtml(
              order.order_code
            )}

          </div>

          <div
            class="status ${statusClass}"
          >

            ${escapeHtml(
              status
            )}

          </div>

        </div>


        <div class="customer">

          <div class="customer-name">

            ${escapeHtml(
              order.customer_name
            )}

          </div>

          <div class="customer-email">

            ${escapeHtml(
              order.customer_email
            )}

          </div>

        </div>


        <div class="products-box">

          <div class="products-title">
            Products
          </div>

          ${productsHtml}

        </div>


        <div class="total">

          RM${Number(
            order.total || 0
          ).toFixed(2)}

        </div>


        <div class="order-date">

          ${escapeHtml(
            createdAt
          )}

        </div>


        <div class="actions">

          ${proofButton}

          ${actionButtons}

          ${emailButton}

        </div>

      `;


      ordersContainer.appendChild(
        card
      );

    }
  );

}


/* =========================================
   DASHBOARD CALCULATIONS
========================================= */

function updateDashboard(
  orders
) {

  const now =
    new Date();


  /*
    Today
  */

  const todayStart =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const tomorrowStart =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 1
    );


  /*
    Month
  */

  const monthStart =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      1
    );


  const nextMonthStart =
    new Date(
      now.getFullYear(),
      now.getMonth() + 1,
      1
    );


  /*
    PAID ORDERS ONLY
  */

  const paidOrders =
    orders.filter(
      order =>
        order.status === "paid"
    );


  /*
    TODAY PAID
  */

  const todayPaid =
    paidOrders.filter(
      order => {

        const date =
          new Date(
            order.created_at
          );

        return (
          date >= todayStart &&
          date < tomorrowStart
        );

      }
    );


  /*
    MONTH PAID
  */

  const monthPaid =
    paidOrders.filter(
      order => {

        const date =
          new Date(
            order.created_at
          );

        return (
          date >= monthStart &&
          date < nextMonthStart
        );

      }
    );


  /*
    SALES
  */

  const todaySalesAmount =
    todayPaid.reduce(
      (
        sum,
        order
      ) =>
        sum +
        Number(
          order.total || 0
        ),
      0
    );


  const monthSalesAmount =
    monthPaid.reduce(
      (
        sum,
        order
      ) =>
        sum +
        Number(
          order.total || 0
        ),
      0
    );


  const totalSalesAmount =
    paidOrders.reduce(
      (
        sum,
        order
      ) =>
        sum +
        Number(
          order.total || 0
        ),
      0
    );


  /*
    COUNTS
  */

  const todayOrderCount =
    orders.filter(
      order => {

        const date =
          new Date(
            order.created_at
          );

        return (
          date >= todayStart &&
          date < tomorrowStart
        );

      }
    ).length;


  const pending =
    orders.filter(
      order =>
        order.status === "pending"
    ).length;


  const paid =
    paidOrders.length;


  /*
    DISPLAY
  */

  todaySales.textContent =
    "RM" +
    todaySalesAmount.toFixed(2);


  monthSales.textContent =
    "RM" +
    monthSalesAmount.toFixed(2);


  totalSales.textContent =
    "RM" +
    totalSalesAmount.toFixed(2);


  todayOrders.textContent =
    todayOrderCount;


  pendingCount.textContent =
    pending;


  paidCount.textContent =
    paid;

}


/* =========================================
   VIEW PAYMENT PROOF
========================================= */

async function viewPaymentProof(
  encodedPath
) {

  const path =
    decodeURIComponent(
      encodedPath
    );


  try {

    const {
      data,
      error
    } =
      await db.storage
        .from("payment-proofs")
        .createSignedUrl(
          path,
          300
        );


    if (error) {

      console.error(error);

      alert(
        "Unable to open payment proof.\n\n" +
        error.message
      );

      return;

    }


    if (
      !data ||
      !data.signedUrl
    ) {

      alert(
        "Payment proof was not found."
      );

      return;

    }


    window.open(
      data.signedUrl,
      "_blank"
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "Unable to open payment proof."
    );

  }

}


/* =========================================
   UPDATE STATUS
========================================= */

async function updateStatus(
  orderId,
  status
) {

  const action =
    status === "paid"
      ? "mark this order as PAID"
      : "REJECT this order";


  const confirmed =
    confirm(
      `Are you sure you want to ${action}?`
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } =
    await db
      .from("orders")
      .update({
        status: status
      })
      .eq(
        "id",
        orderId
      );


  if (error) {

    console.error(error);

    alert(
      "Unable to update order.\n\n" +
      error.message
    );

    return;

  }


  await loadOrders();

}


/* =========================================
   EMAIL ORDER
========================================= */

function emailOrder(
  encodedEmail,
  encodedOrderCode
) {

  const email =
    decodeURIComponent(
      encodedEmail
    );


  const orderCode =
    decodeURIComponent(
      encodedOrderCode
    );


  if (!email) {

    alert(
      "Customer email not found."
    );

    return;

  }


  const subject =
    encodeURIComponent(
      `KINO Order ${orderCode} ♡`
    );


  const body =
    encodeURIComponent(
`Hi!

Thank you for your order with KINO ♡

Order: ${orderCode}

Your payment has been received and your digital products will be sent to this email.

Thank you for supporting KINO!

♡ KINO`
    );


  /*
    mailto:
    - On desktop it can open
      the default email client.
    - On phone it can open
      Gmail / supported mail app.
  */

  const mailto =
    `mailto:${email}?subject=${subject}&body=${body}`;


  window.location.href =
    mailto;

}

async function logout() {

  await db.auth.signOut();

  dashboardPage.style.display =
    "none";

  loginPage.style.display =
    "flex";

  document
    .getElementById(
      "login-password"
    )
    .value = "";

}
