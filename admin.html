<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KINO Admin Dashboard</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff7fa;
      color: #725f66;
      font-family: "Baloo 2", sans-serif;
    }

    button,
    input,
    select {
      font-family: "Baloo 2", sans-serif;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 25px 18px 60px;
    }

    /* =========================
       HEADER
    ========================= */

    .topbar {
      background: white;
      border-radius: 24px;
      padding: 18px 22px;
      margin-bottom: 22px;
      box-shadow: 0 8px 25px rgba(190,130,150,.10);

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      color: #b96f8a;
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
    }

    .brand-sub {
      color: #a88c95;
      font-size: 13px;
      margin-top: 4px;
    }

    .logout-button {
      border: none;
      background: #fde6ee;
      color: #b96f8a;
      padding: 10px 18px;
      border-radius: 22px;
      font-size: 14px;
      font-weight: 600;
    }

    .logout-button:hover {
      background: #f8d6e2;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-wrapper {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;

      background: white;
      border-radius: 28px;
      padding: 32px 28px;

      box-shadow: 0 15px 45px rgba(190,130,150,.16);
    }

    .login-logo {
      text-align: center;
      color: #b96f8a;
      font-size: 36px;
      font-weight: 700;
    }

    .login-title {
      text-align: center;
      color: #8a747b;
      font-size: 17px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      color: #8a747b;
      font-size: 14px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .field input,
    .search-input,
    .filter-select {
      width: 100%;
      border: 1px solid #efdce3;
      background: #fffafb;
      color: #725f66;

      padding: 12px 14px;
      border-radius: 15px;
      outline: none;

      font-size: 14px;
    }

    .field input:focus,
    .search-input:focus,
    .filter-select:focus {
      border-color: #d9829e;
    }

    .primary-button {
      width: 100%;
      border: none;
      border-radius: 24px;
      padding: 13px 20px;

      background: #d9829e;
      color: white;

      font-size: 16px;
      font-weight: 600;
    }

    .primary-button:hover {
      background: #c97491;
    }

    .login-error {
      display: none;

      margin-top: 12px;
      padding: 11px 14px;

      background: #fff0f3;
      color: #bd667f;

      border-radius: 14px;
      font-size: 14px;
      text-align: center;
    }

    /* =========================
       DASHBOARD
    ========================= */

    #dashboard {
      display: none;
    }

    .section {
      margin-bottom: 25px;
    }

    .section-title {
      color: #b96f8a;
      font-size: 23px;
      font-weight: 700;
      margin: 0 0 12px;
    }

    .section-subtitle {
      color: #a88c95;
      font-size: 13px;
      margin-top: -7px;
      margin-bottom: 15px;
    }

    /* =========================
       STORE SETTINGS
    ========================= */

    .store-card {
      background: white;
      border-radius: 24px;
      padding: 22px;

      box-shadow: 0 8px 25px rgba(190,130,150,.10);
    }

    .store-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      margin-bottom: 18px;
    }

    .store-status-label {
      color: #8a747b;
      font-size: 14px;
    }

    .store-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      padding: 7px 14px;
      border-radius: 20px;

      font-size: 14px;
      font-weight: 600;
    }

    .store-status.open {
      background: #eaf8ee;
      color: #4f9b68;
    }

    .store-status.closed {
      background: #fff0f3;
      color: #bd667f;
    }

    .store-status.auto {
      background: #fff6df;
      color: #b48632;
    }

    .store-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .store-button {
      border: none;
      border-radius: 18px;
      padding: 12px 10px;

      background: #fde6ee;
      color: #b96f8a;

      font-size: 14px;
      font-weight: 600;
    }

    .store-button:hover {
      background: #f8d6e2;
    }

    /* =========================
       SUMMARY
    ========================= */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }

    .summary-card {
      background: white;
      border-radius: 20px;
      padding: 17px;

      box-shadow: 0 8px 25px rgba(190,130,150,.08);
    }

    .summary-label {
      color: #a88c95;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .summary-value {
      color: #b96f8a;
      font-size: 23px;
      font-weight: 700;
    }

    /* =========================
       ORDERS
    ========================= */

    .orders-card,
    .affiliate-card {
      background: white;
      border-radius: 24px;
      padding: 20px;

      box-shadow: 0 8px 25px rgba(190,130,150,.10);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;

      margin-bottom: 18px;
    }

    .order-list,
    .affiliate-list {
      display: grid;
      gap: 14px;
    }

    .order-item,
    .affiliate-item {
      border: 1px solid #f1dfe5;
      border-radius: 20px;
      padding: 17px;

      background: #fffafb;
    }

    .order-header,
    .affiliate-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .order-code,
    .affiliate-name {
      color: #b96f8a;
      font-size: 18px;
      font-weight: 700;
    }

    .order-date,
    .affiliate-email {
      color: #a88c95;
      font-size: 12px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;

      padding: 5px 11px;
      border-radius: 18px;

      font-size: 12px;
      font-weight: 600;
    }

    .status-pending {
      background: #fff3d9;
      color: #ae8030;
    }

    .status-paid,
    .status-active {
      background: #eaf8ee;
      color: #4f9b68;
    }

    .status-rejected {
      background: #f1eeee;
      color: #8c7e82;
    }

    .status-suspended {
      background: #fff0f3;
      color: #bd667f;
    }

    .order-info,
    .affiliate-info {
      margin-top: 13px;

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px 15px;
    }

    .info-row {
      font-size: 13px;
      color: #8a747b;
    }

    .info-row strong {
      color: #725f66;
    }

    .order-actions,
    .affiliate-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-top: 15px;
    }

    .action-button {
      border: none;
      border-radius: 18px;

      padding: 9px 13px;

      font-size: 13px;
      font-weight: 600;
    }

    .action-primary {
      background: #d9829e;
      color: white;
    }

    .action-secondary {
      background: #fde6ee;
      color: #b96f8a;
    }

    .action-danger {
      background: #fff0f3;
      color: #bd667f;
    }

    .action-green {
      background: #eaf8ee;
      color: #4f9b68;
    }

    .action-button:hover {
      opacity: .88;
    }

    .empty-state {
      text-align: center;
      padding: 30px 15px;

      color: #a88c95;
      font-size: 14px;
    }

    /* =========================
       AFFILIATE
    ========================= */

    .affiliate-count {
      color: #a88c95;
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 15px;
    }

    .affiliate-plan {
      display: inline-block;

      padding: 4px 10px;
      border-radius: 15px;

      background: #fde6ee;
      color: #b96f8a;

      font-size: 12px;
      font-weight: 600;
    }

    .affiliate-membership {
      color: #8a747b;
      font-size: 13px;
    }

    .approved-date {
      color: #a88c95;
      font-size: 12px;
    }

    /* =========================
       KINO MODAL
    ========================= */

    .kino-modal-overlay {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 9999;

      background: rgba(95, 74, 80, 0.38);

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .kino-modal-overlay.show {
      display: flex;
    }

    .kino-modal {
      width: 100%;
      max-width: 430px;

      background: #ffffff;

      border-radius: 28px;

      padding: 32px 28px 28px;

      text-align: center;

      box-shadow:
        0 15px 45px rgba(190,130,150,0.22);

      animation: kinoPopup .25s ease-out;
    }

    @keyframes kinoPopup {
      from {
        opacity: 0;
        transform: translateY(15px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .kino-modal-icon {
      width: 70px;
      height: 70px;

      margin: 0 auto 18px;

      border-radius: 50%;

      background: #fde6ee;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 34px;
      color: #b96f8a;
    }

    .kino-modal-title {
      color: #b96f8a;

      font-size: 25px;
      font-weight: 700;

      margin-bottom: 8px;
    }

    .kino-modal-text {
      color: #8a747b;

      font-size: 15px;
      line-height: 1.7;

      margin-bottom: 20px;
    }

    .kino-modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .kino-modal-button {
      width: 100%;

      border: none;

      padding: 13px 20px;

      border-radius: 25px;

      background: #d9829e;
      color: white;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      transition: .2s ease;
    }

    .kino-modal-button:hover {
      background: #c97491;
      transform: translateY(-1px);
    }

    .kino-modal-button.cancel {
      background: #fde6ee;
      color: #b96f8a;
    }

    .kino-modal-button.cancel:hover {
      background: #f8d6e2;
    }

    @media (max-width: 900px) {

      .summary-grid {
        grid-template-columns: repeat(3, 1fr);
      }

    }

    @media (max-width: 650px) {

      .page {
        padding: 15px 12px 45px;
      }

      .topbar {
        padding: 16px;
      }

      .brand {
        font-size: 27px;
      }

      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .store-buttons {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .order-info,
      .affiliate-info {
        grid-template-columns: 1fr;
      }

      .order-header,
      .affiliate-header {
        flex-direction: column;
      }

      .kino-modal {
        padding: 28px 22px 24px;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->

  <div
    id="login-screen"
    class="login-wrapper"
  >

    <div class="login-card">

      <div class="login-logo">
        KINO
      </div>

      <div class="login-title">
        Admin Dashboard
      </div>

      <form id="login-form">

        <div class="field">

          <label>
            Email
          </label>

          <input
            type="email"
            id="login-email"
            required
            autocomplete="email"
          >

        </div>

        <div class="field">

          <label>
            Password
          </label>

          <input
            type="password"
            id="login-password"
            required
            autocomplete="current-password"
          >

        </div>

        <button
          type="submit"
          class="primary-button"
        >
          LOGIN ♡
        </button>

      </form>

      <div
        id="login-error"
        class="login-error"
      ></div>

    </div>

  </div>


  <!-- =========================
       DASHBOARD
  ========================== -->

  <div
    id="dashboard"
    class="page"
  >

    <!-- HEADER -->

    <div class="topbar">

      <div>

        <div class="brand">
          KINO
        </div>

        <div class="brand-sub">
          Admin Dashboard
        </div>

      </div>

      <button
        id="logout-button"
        class="logout-button"
      >
        LOGOUT
      </button>

    </div>


    <!-- =========================
         STORE SETTINGS
    ========================== -->

    <section class="section">

      <h2 class="section-title">
        Store Settings
      </h2>

      <div class="store-card">

        <div class="store-status-row">

          <div class="store-status-label">
            Current KINO Store Status
          </div>

          <div
            id="store-status"
            class="store-status closed"
          >
            🔴 CLOSED
          </div>

        </div>

        <div class="store-buttons">

          <button
            id="open-store-button"
            class="store-button"
          >
            🟢 OPEN STORE
          </button>

          <button
            id="close-store-button"
            class="store-button"
          >
            🔴 CLOSE STORE
          </button>

          <button
            id="auto-store-button"
            class="store-button"
          >
            AUTO 8AM–10PM
          </button>

        </div>

      </div>

    </section>


    <!-- =========================
         SUMMARY
    ========================== -->

    <section class="section">

      <h2 class="section-title">
        Summary
      </h2>

      <div class="summary-grid">

        <div class="summary-card">
          <div class="summary-label">
            Today's Sales
          </div>

          <div
            id="today-sales"
            class="summary-value"
          >
            RM0.00
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            This Month
          </div>

          <div
            id="month-sales"
            class="summary-value"
          >
            RM0.00
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            Total Sales
          </div>

          <div
            id="total-sales"
            class="summary-value"
          >
            RM0.00
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            Today's Orders
          </div>

          <div
            id="today-orders"
            class="summary-value"
          >
            0
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            Pending Orders
          </div>

          <div
            id="pending-orders"
            class="summary-value"
          >
            0
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            Paid Orders
          </div>

          <div
            id="paid-orders"
            class="summary-value"
          >
            0
          </div>
        </div>

      </div>

    </section>


    <!-- =========================
         ORDERS
    ========================== -->

    <section class="section">

      <h2 class="section-title">
        Orders
      </h2>

      <div class="orders-card">

        <div class="toolbar">

          <input
            id="order-search"
            class="search-input"
            type="text"
            placeholder="Search order, name or email..."
          >

          <select
            id="order-filter"
            class="filter-select"
          >

            <option value="all">
              All Orders
            </option>

            <option value="pending">
              Pending
            </option>

            <option value="paid">
              Paid
            </option>

            <option value="rejected">
              Rejected
            </option>

          </select>

        </div>

        <div
          id="order-list"
          class="order-list"
        ></div>

      </div>

    </section>


    <!-- =========================
         AFFILIATE MANAGEMENT
    ========================== -->

    <section class="section">

      <h2 class="section-title">
        Affiliate Management
      </h2>

      <div
        id="affiliate-count"
        class="affiliate-count"
      >
        0 affiliate
      </div>

      <div class="affiliate-card">

        <div
          id="affiliate-list"
          class="affiliate-list"
        ></div>

      </div>

    </section>

  </div>


  <!-- =========================
       KINO MODAL
  ========================== -->

  <div
    id="kino-modal-overlay"
    class="kino-modal-overlay"
  >

    <div
      class="kino-modal"
      role="dialog"
      aria-modal="true"
    >

      <div class="kino-modal-icon">
        ♡
      </div>

      <div
        id="kino-modal-title"
        class="kino-modal-title"
      >
        KINO
      </div>

      <div
        id="kino-modal-text"
        class="kino-modal-text"
      ></div>

      <div
        id="kino-modal-buttons"
        class="kino-modal-buttons"
      ></div>

    </div>

  </div>


  <script>

    /* =========================================================
       SUPABASE
    ========================================================= */

    const SUPABASE_URL =
      "https://vbdgzsapdbpgfcdksdoi.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_bBCTw0S0WLE_ydFw_wRyrRhYh";

    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const loginScreen =
      document.getElementById("login-screen");

    const dashboard =
      document.getElementById("dashboard");

    const loginForm =
      document.getElementById("login-form");

    const loginError =
      document.getElementById("login-error");

    const logoutButton =
      document.getElementById("logout-button");

    const storeStatus =
      document.getElementById("store-status");

    const openStoreButton =
      document.getElementById("open-store-button");

    const closeStoreButton =
      document.getElementById("close-store-button");

    const autoStoreButton =
      document.getElementById("auto-store-button");

    const orderList =
      document.getElementById("order-list");

    const orderSearch =
      document.getElementById("order-search");

    const orderFilter =
      document.getElementById("order-filter");

    const affiliateList =
      document.getElementById("affiliate-list");

    const affiliateCount =
      document.getElementById("affiliate-count");


    /* =========================================================
       GLOBAL DATA
    ========================================================= */

    let allOrders = [];
    let allAffiliates = [];

    let currentModalResolve = null;


    /* =========================================================
       KINO MODAL
    ========================================================= */

    function showKinoConfirm(
      title,
      text,
      confirmText = "YES ♡",
      cancelText = "CANCEL"
    ) {

      return new Promise(function(resolve) {

        currentModalResolve = resolve;

        document.getElementById(
          "kino-modal-title"
        ).textContent = title;

        document.getElementById(
          "kino-modal-text"
        ).innerHTML = text;

        const buttons =
          document.getElementById(
            "kino-modal-buttons"
          );

        buttons.innerHTML = "";

        const cancelButton =
          document.createElement("button");

        cancelButton.type = "button";
        cancelButton.className =
          "kino-modal-button cancel";

        cancelButton.textContent =
          cancelText;

        cancelButton.onclick = function() {
          closeKinoModal(false);
        };


        const confirmButton =
          document.createElement("button");

        confirmButton.type = "button";
        confirmButton.className =
          "kino-modal-button";

        confirmButton.textContent =
          confirmText;

        confirmButton.onclick = function() {
          closeKinoModal(true);
        };


        buttons.appendChild(cancelButton);
        buttons.appendChild(confirmButton);


        document.getElementById(
          "kino-modal-overlay"
        ).classList.add("show");

        document.body.style.overflow = "hidden";

      });

    }


    function showKinoMessage(
      title,
      text,
      buttonText = "OKAY ♡"
    ) {

      return new Promise(function(resolve) {

        currentModalResolve = resolve;

        document.getElementById(
          "kino-modal-title"
        ).textContent = title;

        document.getElementById(
          "kino-modal-text"
        ).innerHTML = text;

        const buttons =
          document.getElementById(
            "kino-modal-buttons"
          );

        buttons.innerHTML = "";

        const button =
          document.createElement("button");

        button.type = "button";
        button.className =
          "kino-modal-button";

        button.textContent =
          buttonText;

        button.onclick = function() {
          closeKinoModal(true);
        };

        buttons.appendChild(button);


        document.getElementById(
          "kino-modal-overlay"
        ).classList.add("show");

        document.body.style.overflow = "hidden";

      });

    }


    function closeKinoModal(result) {

      document.getElementById(
        "kino-modal-overlay"
      ).classList.remove("show");

      document.body.style.overflow = "";

      if (currentModalResolve) {

        const resolve =
          currentModalResolve;

        currentModalResolve = null;

        resolve(result);
      }

    }


    /* =========================================================
       LOGIN
    ========================================================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        loginError.style.display = "none";

        const email =
          document.getElementById(
            "login-email"
          ).value.trim();

        const password =
          document.getElementById(
            "login-password"
          ).value;


        const {
          data,
          error
        } = await db.auth.signInWithPassword({
          email,
          password
        });


        if (error) {

          loginError.textContent =
            error.message;

          loginError.style.display =
            "block";

          return;
        }


        const user =
          data.user;

        if (!user) {

          loginError.textContent =
            "Login failed.";

          loginError.style.display =
            "block";

    async function loadOrders() {

        error

        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );

          <div class="empty-state">

    function renderOrders() {

      const search =
        orderSearch.value
          .trim()
          .toLowerCase();

      const filter =
        orderFilter.value;


      let orders =
        allOrders.filter(
          function(order) {

            const status =
              String(
                order.status || ""
              ).toLowerCase();


            if (
              filter !== "all" &&
              status !== filter
            ) {
              return false;
            }


            if (!search) {
              return true;
            }


            const searchable = [

              order.order_code,

              order.customer_name,

              order.name,

              order.email,

              order.customer_email,

              order.payment_method

            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


            return searchable.includes(
              search
            );

          }
        );


      if (!orders.length) {

        orderList.innerHTML = `
          <div class="empty-state">
            No orders found ♡
          </div>
        `;

        return;
      }


      orderList.innerHTML =
        orders
          .map(
            function(order) {

              return renderOrderCard(
                order
              );

            }
          )
          .join("");

    }


    function renderOrderCard(order) {

      const status =
        String(
          order.status || "pending"
        ).toLowerCase();


      const orderCode =
        order.order_code ||
        order.id ||
        "Unknown";


      const customerName =
        order.customer_name ||
        order.name ||
        "-";


      const customerEmail =
        order.customer_email ||
        order.email ||
        "-";


      const total =
        Number(
          order.total_amount ||
          order.total ||
          0
        );


      const date =
        formatDate(
          order.created_at
        );


      let badgeClass =
        "status-pending";

      if (status === "paid") {
        badgeClass =
          "status-paid";
      }

      if (status === "rejected") {
        badgeClass =
          "status-rejected";
      }


      let actions = "";


      if (
        order.payment_proof_path
      ) {

        actions += `
          <button
            class="action-button action-secondary"
            onclick="viewPaymentProof('${escapeJs(order.payment_proof_path)}')"
          >
            VIEW PAYMENT PROOF
          </button>
        `;

      }


      if (status === "pending") {

        actions += `
          <button
            class="action-button action-green"
            onclick="markOrderPaid('${escapeJs(order.id)}')"
          >
            MARK AS PAID
          </button>

          <button
            class="action-button action-danger"
            onclick="rejectOrder('${escapeJs(order.id)}')"
          >
            REJECT
          </button>
        `;

      }


      actions += `
        <button
          class="action-button action-secondary"
          onclick="emailCustomer('${escapeJs(customerEmail)}','${escapeJs(customerName)}','${escapeJs(orderCode)}')"
        >
          EMAIL CUSTOMER
        </button>

        <button
          class="action-button action-secondary"
          onclick="copyOrderInfo('${escapeJs(order.id)}')"
        >
          COPY ORDER INFO
        </button>
      `;


      return `
        <div class="order-item">

          <div class="order-header">

            <div>

              <div class="order-code">
                ${escapeHtml(orderCode)}
              </div>

              <div class="order-date">
                ${escapeHtml(date)}
              </div>

            </div>

            <div class="status-badge ${badgeClass}">
              ${escapeHtml(status.toUpperCase())}
            </div>

          </div>


          <div class="order-info">

            <div class="info-row">
              <strong>Name:</strong>
              ${escapeHtml(customerName)}
            </div>

            <div class="info-row">
              <strong>Email:</strong>
              ${escapeHtml(customerEmail)}
            </div>

            <div class="info-row">
              <strong>Total:</strong>
              RM${total.toFixed(2)}
            </div>

            <div class="info-row">
              <strong>Payment:</strong>
              ${escapeHtml(
                order.payment_method || "-"
              )}
            </div>

          </div>


          <div class="order-actions">
            ${actions}
          </div>

        </div>
      `;

    }

    /*
      IMPORTANT:

      Before:
      const pending = allAffiliates.filter(...pending)

      That caused approved affiliates to disappear.

      NOW:
      We render ALL affiliates.
    */

    function renderAffiliates() {

      const affiliates =
        [...allAffiliates];


      const pendingCount =
        affiliates.filter(
          function(affiliate) {

            return String(
              affiliate.status || ""
            ).toLowerCase() === "pending";

          }
        ).length;


      const activeCount =
        affiliates.filter(
          function(affiliate) {

            return String(
              affiliate.status || ""
            ).toLowerCase() === "active";

          }
        ).length;


      const rejectedCount =
        affiliates.filter(
          function(affiliate) {

            return String(
              affiliate.status || ""
            ).toLowerCase() === "rejected";

          }
        ).length;


      affiliateCount.textContent =
        `${affiliates.length} affiliates · ` +
        `${pendingCount} pending · ` +
        `${activeCount} active` +
        (
          rejectedCount
            ? ` · ${rejectedCount} rejected`
            : ""
        );


      if (!affiliates.length) {

        affiliateList.innerHTML = `
          <div class="empty-state">
            No affiliate registration yet ♡
          </div>
        `;

        return;
      }


      affiliateList.innerHTML =
        affiliates
          .map(
            function(affiliate) {

              return renderAffiliateCard(
                affiliate
              );

            }
          )
          .join("");

    }


    function renderAffiliateCard(
      affiliate
    ) {

      const status =
        String(
          affiliate.status || "pending"
        ).toLowerCase();


      const name =
        affiliate.display_name ||
        affiliate.name ||
        "-";


      const email =
        affiliate.email ||
        "-";


      const code =
        affiliate.affiliate_code ||
        "-";


      const tier =
        String(
          affiliate.tier || "basic"
        ).toUpperCase();


      const membershipAmount =
        affiliate.membership_amount !== null &&
        affiliate.membership_amount !== undefined
          ? Number(
              affiliate.membership_amount
            )
          : (
              tier === "PRO"
                ? 50
                : 5
            );


      let badgeClass =
        "status-pending";


      if (status === "active") {
        badgeClass =
          "status-active";
      }

      else if (status === "rejected") {
        badgeClass =
          "status-rejected";
      }

      else if (status === "suspended") {
        badgeClass =
          "status-suspended";
      }


      let actions = "";


      /*
        PENDING
      */

      if (status === "pending") {

        if (
          affiliate.payment_proof_path
        ) {

          actions += `
            <button
              class="action-button action-secondary"
              onclick="viewAffiliatePaymentProof('${escapeJs(affiliate.payment_proof_path)}')"

          <button
            class="action-button action-danger"
            onclick="rejectAffiliate('${escapeJs(affiliate.id)}')"
          >
            REJECT
          </button>
        `;

        and gets EMAIL AFFILIATE.
      */

        actions += `
          <button
            class="action-button action-secondary"
            onclick="emailAffiliate('${escapeJs(affiliate.id)}')"
          >
            EMAIL AFFILIATE
          </button>
        `;

      }


      /*
        REJECTED

        No destructive action.
      */

      else if (status === "rejected") {

        actions += `

            style="
              color:#a88c95;
              font-size:13px;
              padding:9px 2px;

          >

          </span>

            style="
              color:#a88c95;
              font-size:13px;
              padding:9px 2px;
            "
          >
            Account suspended

        `;

      const approvedDate =

                formatDate(
                  affiliate.approved_at
                )
              )}

          `

      return `

          <div class="affiliate-header">

            <div>

              <div class="affiliate-name">
                ${escapeHtml(name)}
              </div>

              <div class="affiliate-email">
                ${escapeHtml(email)}

            <div class="info-row">

              <strong>Plan:</strong>

                ${escapeHtml(tier)}

            </div>

            <div class="info-row">

            </div>


            <div class="info-row">

    async function approveAffiliate(
      affiliateId
    ) {

      const affiliate =
        allAffiliates.find(
          function(item) {

            return String(item.id) ===
              String(affiliateId);

          }
        );


      if (!affiliate) {

        await showKinoMessage(
          "AFFILIATE",
          "Affiliate record was not found."
        );

        return;
      }


      const name =
        affiliate.display_name ||
        affiliate.name ||
        "this affiliate";


      const confirmed =
        await showKinoConfirm(
          "APPROVE AFFILIATE ♡",
          `Approve <strong>${escapeHtml(name)}</strong> as a KINO affiliate?`,
          "APPROVE",
          "CANCEL"
        );


      if (!confirmed) {
        return;
      }


      const tier =
        String(
          affiliate.tier || "basic"
        ).toLowerCase();


      const membershipAmount =
        tier === "pro"
          ? 50
          : 5;


      const {
        error
      } = await db
        .from("affiliates")
        .update({

          status: "active",

          approved_at:
            new Date().toISOString(),

          membership_amount:
            membershipAmount

        })
        .eq(
          "id",
          affiliateId
        );


      if (error) {

        await showKinoMessage(
          "APPROVAL FAILED",
          error.message
        );

        return;
      }


      await loadAffiliates();

      await loadOrders();


      await showKinoMessage(
        "AFFILIATE APPROVED ♡",
        `${escapeHtml(name)} is now an active KINO affiliate.`
      );

    }

      if (!affiliate) {

        showKinoMessage(
          "EMAIL AFFILIATE",
          "Affiliate record was not found."
        );

        return;
      }


      const email =
        affiliate.email;


      const name =
        affiliate.display_name ||
        affiliate.name ||
        "Affiliate";


      const code =
        affiliate.affiliate_code ||
        "-";


      const tier =
        String(
          affiliate.tier || "basic"
        ).toUpperCase();


      const commission =
        tier === "PRO"
          ? "60%"
          : "40%";


      if (!email) {

        showKinoMessage(
          "EMAIL AFFILIATE",
          "Affiliate email was not found."
        );

        return;
      }


      /*
        KINO affiliate referral link
      */

      const affiliateLink =
        `https://kino-website.pages.dev/?ref=${encodeURIComponent(code)}`;


      const subject =
        "Welcome to KINO Affiliate ♡";


      const body =
`Hi ${name},

Thank you for joining KINO Affiliate ♡

Your affiliate registration has been approved successfully.

Affiliate Code:
${code}

Plan:
${tier}

Commission:
${commission}

You can now start sharing your KINO affiliate link.

Affiliate Link:
${affiliateLink}

Thank you for being part of KINO ♡`;


      showKinoConfirm(
        "EMAIL AFFILIATE",
        `Open your email app to send an email to:<br><br><strong>${escapeHtml(email)}</strong>`,
        "OPEN EMAIL",
        "CANCEL"
      )
      .then(
        function(ok) {

          if (!ok) {
            return;
          }


          window.location.href =
            `mailto:${encodeURIComponent(email)}` +
            `?subject=${encodeURIComponent(subject)}` +
            `&body=${encodeURIComponent(body)}`;

        }
      );

    }


    /* =========================================================
       SUMMARY
    ========================================================= */

    function updateSummary() {

      const now =
        new Date();


      const todayStart =
        new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        );


      const monthStart =
        new Date(
          now.getFullYear(),
          now.getMonth(),
          1
        );


      const paidOrders =
        allOrders.filter(
          function(order) {

            return String(
              order.status || ""
            ).toLowerCase() === "paid";

          }
        );


      const todayOrders =
        allOrders.filter(
          function(order) {

            if (!order.created_at) {
              return false;
            }


            const date =
              new Date(
                order.created_at
              );


            return date >= todayStart;

          }
        );


      const pendingOrders =
        allOrders.filter(
          function(order) {

            return String(
              order.status || ""
            ).toLowerCase() === "pending";

          }
        );


      const todayPaidOrders =
        paidOrders.filter(
          function(order) {

            const date =
              new Date(
                order.created_at
              );

            return date >= todayStart;

          }
        );


      const monthPaidOrders =
        paidOrders.filter(
          function(order) {

            const date =
              new Date(
                order.created_at
              );

            return date >= monthStart;

          }
        );


      function orderAmount(order) {

        return Number(
          order.total_amount ||
          order.total ||
          0
        );

      }


      const todayOrderSales =
        todayPaidOrders.reduce(
          function(total, order) {

            return total +
              orderAmount(order);

          },
          0
        );


      const monthOrderSales =
        monthPaidOrders.reduce(
          function(total, order) {

            return total +
              orderAmount(order);

          },
          0
        );


      const totalOrderSales =
        paidOrders.reduce(
          function(total, order) {

            return total +
              orderAmount(order);

          },
          0
        );


      /*
        Approved affiliate membership sales
        are included in summary.
      */

      const activeAffiliates =
        allAffiliates.filter(
          function(affiliate) {

            return String(
              affiliate.status || ""
            ).toLowerCase() === "active";

          }
        );


      const todayMembershipSales =
        activeAffiliates
          .filter(
            function(affiliate) {

              if (!affiliate.approved_at) {
                return false;
              }

              return new Date(
                affiliate.approved_at
              ) >= todayStart;

            }
          )
          .reduce(
            function(total, affiliate) {

              return total +
                Number(
                  affiliate.membership_amount || 0
                );

            },
            0
          );


      const monthMembershipSales =
        activeAffiliates
          .filter(
            function(affiliate) {

              if (!affiliate.approved_at) {
                return false;
              }

              return new Date(
                affiliate.approved_at
              ) >= monthStart;

            }
          )
          .reduce(
            function(total, affiliate) {

              return total +
                Number(
                  affiliate.membership_amount || 0
                );

            },
            0
          );


      const totalMembershipSales =
        activeAffiliates.reduce(
          function(total, affiliate) {

            return total +
              Number(
                affiliate.membership_amount || 0
              );

          },
          0
        );


      document.getElementById(
        "today-sales"
      ).textContent =
        "RM" +
        (
          todayOrderSales +
          todayMembershipSales
        ).toFixed(2);


      document.getElementById(
        "month-sales"
      ).textContent =
        "RM" +
        (
          monthOrderSales +
          monthMembershipSales
        ).toFixed(2);


      document.getElementById(
        "total-sales"
      ).textContent =
        "RM" +
        (
          totalOrderSales +
          totalMembershipSales
        ).toFixed(2);


      document.getElementById(
        "today-orders"
      ).textContent =
        todayOrders.length;


      document.getElementById(
        "pending-orders"
      ).textContent =
        pendingOrders.length;


      document.getElementById(
        "paid-orders"
      ).textContent =
        paidOrders.length;

    }

    async function loadEverything() {

      await loadStoreStatus();

      await loadAffiliates();

      await loadOrders();

    /* =========================================================
       HELPERS
    ========================================================= */

    function formatDate(
      value
    ) {

      if (!value) {
        return "-";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "-";
      }


      return date.toLocaleString(
        "en-MY",
        {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function escapeJs(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /\\/g,
          "\\\\"
        )
        .replace(
          /'/g,
          "\\'"
        )
        .replace(
          /\n/g,
          "\\n"
        )
        .replace(
          /\r/g,
          "\\r"
        );

    }


    /* =========================================================
       START
    ========================================================= */

    checkSession();


  </script>
