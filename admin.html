<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap" rel="stylesheet">

  <title>KINO Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Baloo 2', sans-serif;
      background: #fff8fa;
      color: #5f4a50;
    }

    button,
    input {
      font-family: 'Baloo 2', sans-serif;
    }

    /* =========================
       LOGIN
    ========================= */

    #login-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(190,130,150,.12);
    }

    .login-logo {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      color: #c47794;
      margin-bottom: 5px;
    }

    .login-title {
      text-align: center;
      color: #8a747b;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      color: #8a747b;
      margin-bottom: 5px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #f0d9e1;
      border-radius: 15px;
      outline: none;
      font-size: 15px;
    }

    .input-group input:focus {
      border-color: #d9829e;
    }

    .login-button {
      width: 100%;
      border: none;
      padding: 12px;
      border-radius: 18px;
      background: #d9829e;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    .login-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .login-error {
      background: #fff0f3;
      color: #a96b82;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      color: #c47794;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-label {
      color: #8a747b;
      font-size: 14px;
    }

    .logout-button {
      border: none;
      background: #f7dce5;
      color: #a96b82;
      padding: 7px 13px;
      border-radius: 15px;
      cursor: pointer;
    }

    /* =========================
       DASHBOARD
    ========================= */

    .dashboard {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      color: #b96f8a;
      font-size: 32px;
      margin-bottom: 25px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .summary-box {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 5px 18px rgba(190,130,150,.10);
    }

    .summary-label {
      color: #8a747b;
      font-size: 14px;
    }

    .summary-number {
      color: #b96f8a;
      font-size: 28px;
      font-weight: 700;
    }

    /* =========================
       ORDERS
    ========================= */

    .order-card {
      background: white;
      padding: 22px;
      border-radius: 20px;
      margin-bottom: 15px;
      box-shadow: 0 5px 18px rgba(190,130,150,.10);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      margin-bottom: 12px;
    }

    .order-code {
      color: #b96f8a;
      font-weight: 700;
      font-size: 17px;
    }

    .status {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      background: #fde6ee;
      color: #a96b82;
    }

    .status.paid {
      background: #e8f7ee;
      color: #4e8a66;
    }

    .status.rejected {
      background: #f3eeee;
      color: #8a747b;
    }

    .customer {
      margin-bottom: 12px;
      color: #8a747b;
    }

    .total {
      font-size: 20px;
      font-weight: 700;
      color: #b96f8a;
      margin-bottom: 15px;
    }

    .button {
      border: none;
      padding: 9px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      margin-right: 8px;
      margin-bottom: 6px;
    }

    .proof-button {
      background: #f7dce5;
      color: #a96b82;
    }

    .paid-button {
      background: #d9829e;
      color: white;
    }

    .reject-button {
      background: #f7dce5;
      color: #a96b82;
    }

    .empty {
      background: white;
      padding: 40px;
      text-align: center;
      border-radius: 20px;
      color: #8a747b;
    }

    .error {
      background: #fff0f3;
      padding: 20px;
      border-radius: 15px;
      color: #a96b82;
    }

    .date {
      color: #a9959b;
      font-size: 12px;
      margin-top: 8px;
    }

    @media (max-width: 650px) {

      .summary {
        grid-template-columns: 1fr;
      }

      .order-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .dashboard {
        margin: 25px auto;
        padding: 15px;
      }

      header {
        padding: 15px 5%;
      }

      .header-right {
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }

      .admin-label {
        font-size: 12px;
      }

      .logout-button {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN PAGE
  ========================= -->

  <section id="login-page">

    <div class="login-box">

      <div class="login-logo">
        KINO ♡
      </div>

      <div class="login-title">
        Admin Dashboard
      </div>

      <div
        id="login-error"
        class="login-error">
      </div>

      <form id="login-form">

        <div class="input-group">

          <label for="login-email">
            Email
          </label>

          <input
            type="email"
            id="login-email"
            placeholder="Admin email"
            autocomplete="username"
            required
          >

        </div>

        <div class="input-group">

          <label for="login-password">
            Password
          </label>

          <input
            type="password"
            id="login-password"
            placeholder="Password"
            autocomplete="current-password"
            required
          >

        </div>

        <button
          type="submit"
          class="login-button"
          id="login-button">

          LOGIN

        </button>

      </form>

    </div>

  </section>


  <!-- =========================
       DASHBOARD
  ========================= -->

  <section
    id="dashboard-page"
    style="display:none;">

    <header>

      <div class="logo">
        KINO
      </div>

      <div class="header-right">

        <div class="admin-label">
          Admin Dashboard
        </div>

        <button
          class="logout-button"
          id="logout-button">

          LOGOUT

        </button>

      </div>

    </header>


    <main class="dashboard">

      <h1>
        Orders ♡
      </h1>


      <div class="summary">

        <div class="summary-box">

          <div class="summary-label">
            Pending Orders
          </div>

          <div
            class="summary-number"
            id="pending-count">

            0

          </div>

        </div>


        <div class="summary-box">

          <div class="summary-label">
            Paid Orders
          </div>

          <div
            class="summary-number"
            id="paid-count">

            0

          </div>

        </div>


        <div class="summary-box">

          <div class="summary-label">
            Total Sales
          </div>

          <div
            class="summary-number"
            id="sales-total">

            RM0.00

          </div>

        </div>

      </div>


      <div id="orders">

        <div class="empty">
          Loading orders...
        </div>

      </div>

    </main>

  </section>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://vbdgzsapdbpgfcdksdoi.supabase.co";


/*
  PASTE YOUR REAL SUPABASE
  PUBLISHABLE / ANON KEY HERE.

  Supabase:
  Project Settings
  → API
  → Publishable key
*/

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";


const { createClient } =
  supabase;


const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ==========================================
   ELEMENTS
========================================== */

const loginPage =
  document.getElementById(
    "login-page"
  );

const dashboardPage =
  document.getElementById(
    "dashboard-page"
  );

const loginForm =
  document.getElementById(
    "login-form"
  );

const loginEmail =
  document.getElementById(
    "login-email"
  );

const loginPassword =
  document.getElementById(
    "login-password"
  );

const loginError =
  document.getElementById(
    "login-error"
  );

const loginButton =
  document.getElementById(
    "login-button"
  );

const logoutButton =
  document.getElementById(
    "logout-button"
  );

const ordersContainer =
  document.getElementById(
    "orders"
  );

const pendingCount =
  document.getElementById(
    "pending-count"
  );

const paidCount =
  document.getElementById(
    "paid-count"
  );

const salesTotal =
  document.getElementById(
    "sales-total"
  );


/* ==========================================
   HELPERS
========================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function showLoginError(message) {

  loginError.textContent =
    message;

  loginError.style.display =
    "block";

}


function clearLoginError() {

  loginError.textContent =
    "";

  loginError.style.display =
    "none";

}


/* ==========================================
   CHECK ADMIN
========================================== */

async function verifyAdmin() {

  const {
    data: {
      session
    },
    error: sessionError
  } =
    await db.auth.getSession();


  if (sessionError) {

    throw new Error(
      "Session error: " +
      sessionError.message
    );

  }


  if (!session) {

    return false;

  }


  /*
    Check existing is_admin()
    function in Supabase.
  */

  const {
    data: adminResult,
    error: adminError
  } =
    await db.rpc(
      "is_admin"
    );


  if (!adminError) {

    return adminResult === true;

  }


  /*
    Fallback:
    Try reading orders.

    Your existing RLS allows
    authenticated admins to read
    orders.
  */

  console.warn(
    "is_admin() failed:",
    adminError
  );


  const {
    error: ordersCheckError
  } =
    await db
      .from("orders")
      .select("id")
      .limit(1);


  return !ordersCheckError;

}


/* ==========================================
   LOGIN
========================================== */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    clearLoginError();


    loginButton.disabled =
      true;

    loginButton.textContent =
      "LOGGING IN...";


    const email =
      loginEmail.value.trim();

    const password =
      loginPassword.value;


    try {

      const {
        data,
        error
      } =
        await db.auth
          .signInWithPassword({

            email: email,

            password: password

          });


      if (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );


        showLoginError(
          "Login gagal: " +
          error.message
        );


        loginButton.disabled =
          false;

        loginButton.textContent =
          "LOGIN";

        return;

      }


      const isAdmin =
        await verifyAdmin();


      if (!isAdmin) {

        await db.auth.signOut();


        showLoginError(
          "Akaun ini bukan Admin KINO."
        );


        loginButton.disabled =
          false;

        loginButton.textContent =
          "LOGIN";

        return;

      }


      loginPassword.value =
        "";


      await showDashboard();


    } catch (error) {

      console.error(
        "ADMIN LOGIN ERROR:",
        error
      );


      await db.auth.signOut();


      showLoginError(
        error.message ||
        "Something went wrong."
      );


      loginButton.disabled =
        false;

      loginButton.textContent =
        "LOGIN";

    }

  }
);


/* ==========================================
   SHOW DASHBOARD
========================================== */

async function showDashboard() {

  loginPage.style.display =
    "none";

  dashboardPage.style.display =
    "block";


  loginButton.disabled =
    false;

  loginButton.textContent =
    "LOGIN";


  await loadOrders();

}


/* ==========================================
   LOGOUT
========================================== */

logoutButton.addEventListener(
  "click",
  async function() {

    await db.auth.signOut();


    dashboardPage.style.display =
      "none";

    loginPage.style.display =
      "flex";


    loginEmail.value =
      "";

    loginPassword.value =
      "";


    clearLoginError();

  }
);


/* ==========================================
   CHECK EXISTING SESSION
========================================== */

async function checkSession() {

  try {

    const isAdmin =
      await verifyAdmin();


    if (!isAdmin) {

      loginPage.style.display =
        "flex";

      dashboardPage.style.display =
        "none";

      return;

    }


    await showDashboard();


  } catch (error) {

    console.error(
      "SESSION ERROR:",
      error
    );


    await db.auth.signOut();


    loginPage.style.display =
      "flex";

    dashboardPage.style.display =
      "none";

  }

}


/* ==========================================
   LOAD ORDERS
========================================== */

async function loadOrders() {

  ordersContainer.innerHTML =
    '<div class="empty">Loading orders...</div>';


  const {
    data,
    error
  } =
    await db
      .from("orders")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "LOAD ORDERS ERROR:",
      error
    );


    ordersContainer.innerHTML = `

      <div class="error">

        Unable to load orders.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

    return;

  }


  const orders =
    data || [];


  updateSummary(
    orders
  );


  if (
    orders.length === 0
  ) {

    ordersContainer.innerHTML = `

      <div class="empty">
        No orders yet ♡
      </div>

    `;

    return;

  }


  ordersContainer.innerHTML =
    "";


  orders.forEach(
    order => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "order-card";


      const orderCode =
        escapeHtml(
          order.order_code
        );


      const status =
        String(
          order.status ||
          "pending"
        );


      const customerName =
        escapeHtml(
          order.customer_name
        );


      const customerEmail =
        escapeHtml(
          order.customer_email
        );


      const total =
        Number(
          order.total || 0
        ).toFixed(2);


      let proofButton =
        "";


      if (
        order.payment_proof_path
      ) {

        proofButton = `

          <button
            class="button proof-button"
            onclick="viewPaymentProof('${encodeURIComponent(
              order.payment_proof_path
            )}')">

            VIEW PAYMENT PROOF

          </button>

        `;

      }


      let actionButtons =
        "";


      if (
        status === "pending"
      ) {

        actionButtons = `

          <button
            class="button paid-button"
            onclick="updateStatus(
              '${order.id}',
              'paid'
            )">

            MARK AS PAID

          </button>


          <button
            class="button reject-button"
            onclick="updateStatus(
              '${order.id}',
              'rejected'
            )">

            REJECT

          </button>

        `;

      }


      let createdDate =
        "";


      if (
        order.created_at
      ) {

        const date =
          new Date(
            order.created_at
          );


        if (
          !Number.isNaN(
            date.getTime()
          )
        ) {

          createdDate =
            date.toLocaleString(
              "en-MY",
              {
                dateStyle:
                  "medium",

                timeStyle:
                  "short"
              }
            );

        }

      }


      card.innerHTML = `

        <div class="order-header">

          <div class="order-code">
            ${orderCode}
          </div>

          <div class="status ${escapeHtml(
            status
          )}">

            ${escapeHtml(
              status
            )}

          </div>

        </div>


        <div class="customer">

          <strong>
            ${customerName}
          </strong>

          <br>

          ${customerEmail}

        </div>


        <div class="total">

          RM${total}

        </div>


        <div>

          ${proofButton}

          ${actionButtons}

        </div>


        ${
          createdDate
            ? `
              <div class="date">
                ${escapeHtml(
                  createdDate
                )}
              </div>
            `
            : ""
        }

      `;


      ordersContainer.appendChild(
        card
      );

    }
  );

}


/* ==========================================
   SUMMARY
========================================== */

function updateSummary(
  orders
) {

  const pending =
    orders.filter(
      order =>
        order.status ===
        "pending"
    ).length;


  const paidOrders =
    orders.filter(
      order =>
        order.status ===
        "paid"
    );


  const sales =
    paidOrders.reduce(
      (
        sum,
        order
      ) => {

        return (
          sum +
          Number(
            order.total || 0
          )
        );

      },
      0
    );


  pendingCount.textContent =
    pending;


  paidCount.textContent =
    paidOrders.length;


  salesTotal.textContent =
    `RM${sales.toFixed(2)}`;

}


/* ==========================================
   PAYMENT PROOF
========================================== */

async function viewPaymentProof(
  encodedPath
) {

  const path =
    decodeURIComponent(
      encodedPath
    );


  const {
    data,
    error
  } =
    await db.storage
      .from(
        "payment-proofs"
      )
      .createSignedUrl(
        path,
        300
      );


  if (error) {

    console.error(
      "PAYMENT PROOF ERROR:",
      error
    );


    alert(
      "Unable to open payment proof.\n\n" +
      error.message
    );


    return;

  }


  if (
    !data ||
    !data.signedUrl
  ) {

    alert(
      "Payment proof URL could not be created."
    );


    return;

  }


  window.open(
    data.signedUrl,
    "_blank"
  );

}


/* ==========================================
   UPDATE ORDER STATUS
========================================== */

async function updateStatus(
  orderId,
  status
) {

  const message =
    status === "paid"
      ? "Mark this order as PAID?"
      : "Reject this order?";


  if (
    !confirm(message)
  ) {

    return;

  }


  const {
    error
  } =
    await db
      .from("orders")
      .update({
        status: status
      })
      .eq(
        "id",
        orderId
      );


  if (error) {

    console.error(
      "UPDATE ORDER ERROR:",
      error
    );


    alert(
      "Unable to update order.\n\n" +
      error.message
    );


    return;

  }


  await loadOrders();

}


/* ==========================================
   START
========================================== */

checkSession();

</script>

</body>
</html>
