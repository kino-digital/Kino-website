<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>KINO Admin</title>

<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================
   GLOBAL
========================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff8fb;
  color: #8a747b;
  font-family: 'Baloo 2', sans-serif;
}

button,
input {
  font-family: inherit;
}


/* =========================================
   LOGIN
========================================= */

#login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 440px;
  background: white;
  padding: 45px 40px;
  border-radius: 28px;
  box-shadow: 0 8px 30px rgba(190,130,150,0.12);
}

.login-logo {
  text-align: center;
  color: #b96f8a;
  font-size: 34px;
  font-weight: 700;
  margin-bottom: 5px;
}

.login-title {
  text-align: center;
  font-size: 18px;
  margin-bottom: 30px;
}

.input-group {
  margin-bottom: 18px;
}

.input-group label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #eadce2;
  border-radius: 15px;
  outline: none;
  font-size: 15px;
}

.input-group input:focus {
  border-color: #d9829e;
}

.login-button {
  width: 100%;
  border: none;
  background: #d9829e;
  color: white;
  padding: 14px;
  border-radius: 20px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.login-button:disabled {
  opacity: 0.6;
}

.login-error {
  display: none;
  background: #fff0f3;
  color: #a96b82;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 18px;
  text-align: center;
}


/* =========================================
   DASHBOARD
========================================= */

#dashboard-page {
  display: none;
}

header {
  background: white;
  padding: 18px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 15px rgba(190,130,150,0.06);
}

.logo {
  color: #b96f8a;
  font-size: 25px;
  font-weight: 700;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.admin-label {
  font-size: 14px;
}

.logout-button {
  border: none;
  background: #f7dce5;
  color: #a96b82;
  padding: 8px 15px;
  border-radius: 18px;
  cursor: pointer;
}


/* =========================================
   DASHBOARD
========================================= */

.dashboard {
  max-width: 1100px;
  margin: 40px auto;
  padding: 20px;
}

h1 {
  color: #b96f8a;
  font-size: 32px;
  margin-bottom: 25px;
}


/* =========================================
   SUMMARY
========================================= */

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 30px;
}

.summary-box {
  background: white;
  padding: 22px;
  border-radius: 20px;
  box-shadow: 0 5px 18px rgba(190,130,150,0.10);
}

.summary-label {
  font-size: 14px;
}

.summary-number {
  color: #b96f8a;
  font-size: 28px;
  font-weight: 700;
}


/* =========================================
   ORDER CARD
========================================= */

.order-card {
  background: white;
  padding: 22px;
  border-radius: 20px;
  margin-bottom: 15px;
  box-shadow: 0 5px 18px rgba(190,130,150,0.10);
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 12px;
}

.order-code {
  color: #b96f8a;
  font-weight: 700;
  font-size: 17px;
}

.status {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  background: #fde6ee;
  color: #a96b82;
}

.status.paid {
  background: #e5f6ec;
  color: #4f8a68;
}

.status.rejected {
  background: #f1eeee;
  color: #777;
}


/* =========================================
   CUSTOMER
========================================= */

.customer {
  margin-bottom: 15px;
  line-height: 1.5;
}


/* =========================================
   PRODUCTS
========================================= */

.products-box {
  background: #fff7fa;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 15px;
}

.products-title {
  color: #b96f8a;
  font-weight: 700;
  margin-bottom: 10px;
}

.product-row {
  background: white;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 8px;

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.product-row:last-child {
  margin-bottom: 0;
}

.product-name {
  font-weight: 600;
  color: #8a747b;
}

.product-quantity {
  font-size: 13px;
  color: #aaa;
}

.product-price {
  font-weight: 600;
  color: #b96f8a;
  white-space: nowrap;
}


/* =========================================
   TOTAL / DATE
========================================= */

.total {
  font-size: 20px;
  font-weight: 700;
  color: #b96f8a;
  margin-bottom: 10px;
}

.order-date {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 15px;
}


/* =========================================
   ACTIONS
========================================= */

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.actions button {
  border: none;
  padding: 9px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}

.proof-button {
  background: #f7dce5;
  color: #a96b82;
}

.paid-button {
  background: #d9829e;
  color: white;
}

.reject-button {
  background: #f7dce5;
  color: #a96b82;
}

.email-button {
  background: #b96f8a;
  color: white;
}

.copy-button {
  background: #eee5e9;
  color: #8a747b;
}


/* =========================================
   INFO
========================================= */

.email-note {
  background: #fff4f7;
  color: #a96b82;
  padding: 12px 15px;
  border-radius: 12px;
  margin-top: 15px;
  font-size: 13px;
}


/* =========================================
   STATES
========================================= */

.loading,
.empty,
.error {
  background: white;
  padding: 35px;
  text-align: center;
  border-radius: 20px;
}

.error {
  color: #a96b82;
  background: #fff0f3;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 650px) {

  .summary {
    grid-template-columns: 1fr;
  }

  .dashboard {
    margin: 25px auto;
    padding: 15px;
  }

  header {
    padding: 15px 5%;
  }

  .header-right {
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .order-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .product-row {
    align-items: flex-start;
    flex-direction: column;
    gap: 5px;
  }

  .product-price {
    align-self: flex-end;
  }

}

</style>

</head>


<body>


<!-- =========================================
     LOGIN
========================================= -->

<section id="login-page">

  <div class="login-box">

    <div class="login-logo">
      KINO ♡
    </div>

    <div class="login-title">

    </div>

    <form id="login-form">

      <div class="input-group">

      </div>


      <div class="input-group">

        <input

        >

      </div>


      <button

        class="login-button"
        id="login-button"
      >
        LOGIN
      </button>

    </form>

  </div>

</section>



<!-- =========================================
     DASHBOARD
========================================= -->

<section id="dashboard-page">

<header>

  <div class="logo">
    KINO
  </div>

  <div class="header-right">

    <div class="admin-label">
      Admin Dashboard
    </div>

    <button
      class="logout-button"
      onclick="logout()"
    >
      LOGOUT
    </button>

  </div>

</header>


<main class="dashboard">

  <h1>
    Orders ♡
  </h1>


  <div class="summary">

    <div class="summary-box">

      <div class="summary-label">
        Pending Orders
      </div>

      <div
        class="summary-number"
        id="pending-count"
      >
        0
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        Paid Orders
      </div>

      <div
        class="summary-number"
        id="paid-count"
      >
        0
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        Total Sales
      </div>

      <div
        class="summary-number"
        id="sales-total"
      >
        RM0.00
      </div>

    </div>

  </div>


  <div id="orders">

    <div class="loading">
      Loading orders...
    </div>

  </div>

</main>

</section>



<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://vbdgzsapdbpgfcdksdoi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const loginPage =
  document.getElementById("login-page");

const dashboardPage =
  document.getElementById("dashboard-page");

const loginForm =
  document.getElementById("login-form");

const loginError =
  document.getElementById("login-error");

const loginButton =
  document.getElementById("login-button");

const ordersContainer =
  document.getElementById("orders");

const pendingCount =
  document.getElementById("pending-count");

const paidCount =
  document.getElementById("paid-count");

const salesTotal =
  document.getElementById("sales-total");


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    loginError.style.display = "none";

    loginButton.disabled = true;

    loginButton.textContent =
      "LOGGING IN...";


    const email =
      document
        .getElementById("login-email")
        .value
        .trim();


    const password =
      document
        .getElementById("login-password")
        .value;


    const { error } =
      await db.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      console.error(error);

      loginError.textContent =
        "Email atau password salah.";

      loginError.style.display =
        "block";

      loginButton.disabled = false;

      loginButton.textContent =
        "LOGIN";

      return;

    }


    /*
      RLS Supabase decides whether
      this account can access orders.
    */

    const { error: adminError } =
      await db
        .from("orders")
        .select("id")
        .limit(1);


    if (adminError) {

      console.error(adminError);

      await db.auth.signOut();

      loginError.textContent =
        "Access denied. Admin sahaja boleh masuk.";

      loginError.style.display =
        "block";

      loginButton.disabled = false;

      loginButton.textContent =
        "LOGIN";

      return;

    }


    await showDashboard();

  }
);


/* =========================================
   SHOW DASHBOARD
========================================= */

async function showDashboard() {

  loginPage.style.display = "none";

  dashboardPage.style.display = "block";

  await loadOrders();

}


/* =========================================
   CHECK SESSION
========================================= */

async function checkSession() {

  const {
    data: {
      session
    }
  } = await db.auth.getSession();


  if (!session) {

    loginPage.style.display = "flex";

    dashboardPage.style.display = "none";

    return;

  }


  const { error } =
    await db
      .from("orders")
      .select("id")
      .limit(1);


  if (error) {

    await db.auth.signOut();

    loginPage.style.display = "flex";

    dashboardPage.style.display = "none";

    return;

  }


  await showDashboard();

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders() {

  ordersContainer.innerHTML = `
    <div class="loading">
      Loading orders...
    </div>
  `;


  const {
    data: ordersData,
    error: ordersError
  } = await db
    .from("orders")
    .select("*")
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (ordersError) {

    console.error(ordersError);

    ordersContainer.innerHTML = `
      <div class="error">
        Unable to load orders.<br><br>
        ${escapeHtml(ordersError.message)}
      </div>
    `;

    return;

  }


  const orders =
    ordersData || [];


  /*
    LOAD ALL PRODUCTS FOR THESE ORDERS
  */

  let items = [];


  if (orders.length > 0) {

    const orderIds =
      orders.map(
        order => order.id
      );


    const {
      data: itemsData,
      error: itemsError
    } = await db
      .from("order_items")
      .select("*")
      .in(
        "order_id",
        orderIds
      );


    if (itemsError) {

      console.error(
        "Order items error:",
        itemsError
      );

      /*
        Don't stop dashboard.
        We can still show orders.
      */

    }
    else {

      items =
        itemsData || [];

    }

  }


  /*
    GROUP PRODUCTS BY ORDER
  */

  const itemsByOrder = {};


  items.forEach(
    item => {

      if (
        !itemsByOrder[item.order_id]
      ) {

        itemsByOrder[item.order_id] = [];

      }


      itemsByOrder[item.order_id].push(
        item
      );

    }
  );


  /*
    ADD PRODUCTS INTO EACH ORDER
  */

  orders.forEach(
    order => {

      order.products =
        itemsByOrder[order.id] || [];

    }
  );


  updateSummary(orders);


  if (orders.length === 0) {

    ordersContainer.innerHTML = `
      <div class="empty">
        No orders yet ♡
      </div>
    `;

    return;

  }


  ordersContainer.innerHTML = "";


  orders.forEach(
    order => {

      const card =
        document.createElement("div");

      card.className =
        "order-card";


      const status =
        String(
          order.status || "pending"
        );


      const statusClass =
        status === "paid"
          ? "paid"
          : status === "rejected"
            ? "rejected"
            : "";


      const createdAt =
        order.created_at
          ? new Date(
              order.created_at
            ).toLocaleString(
              "en-MY"
            )
          : "-";


      /* =====================================
         PAYMENT PROOF
      ===================================== */

      let proofButton = "";


      if (
        order.payment_proof_path
      ) {

        proofButton = `
          <button
            class="proof-button"
            onclick="viewPaymentProof('${encodeURIComponent(order.payment_proof_path)}')"
          >
            VIEW PAYMENT PROOF
          </button>
        `;

      }


      /* =====================================
         PRODUCTS
      ===================================== */

      let productsHtml = "";


      if (
        order.products &&
        order.products.length > 0
      ) {

        productsHtml = `
          <div class="products-box">

            <div class="products-title">
              Products
            </div>

            ${order.products.map(
              item => {

                const name =
                  item.product_name ||
                  "Product";

                const quantity =
                  Number(
                    item.quantity || 1
                  );

                const price =
                  Number(
                    item.product_price || 0
                  );

                const subtotal =
                  Number(
                    item.subtotal ||
                    price * quantity
                  );

                return `

                  <div class="product-row">

                    <div>

                      <div class="product-name">
                        ${escapeHtml(name)}
                      </div>

                      <div class="product-quantity">
                        RM${price.toFixed(2)}
                        ×
                        ${quantity}
                      </div>

                    </div>

                    <div class="product-price">
                      RM${subtotal.toFixed(2)}
                    </div>

                  </div>

                `;

              }
            ).join("")}

          </div>
        `;

      }
      else {

        productsHtml = `
          <div class="products-box">

            <div class="products-title">
              Products
            </div>

            <div>
              No product information.
            </div>

          </div>
        `;

      }


      /* =====================================
         ACTION BUTTONS
      ===================================== */

      let actionButtons = "";


      if (status === "pending") {

        actionButtons = `

          <button
            class="paid-button"
            onclick="updateStatus('${order.id}', 'paid')"
          >
            MARK AS PAID
          </button>

          <button
            class="reject-button"
            onclick="updateStatus('${order.id}', 'rejected')"
          >
            REJECT
          </button>

        `;

      }


      /*
        EMAIL + COPY BUTTON
        ONLY SHOW AFTER PAID
      */

      if (status === "paid") {

        actionButtons += `

          <button
            class="email-button"
            onclick="emailCustomer('${order.id}')"
          >
            EMAIL CUSTOMER
          </button>

          <button
            class="copy-button"
            onclick="copyOrderInfo('${order.id}')"
          >
            COPY ORDER INFO
          </button>

        `;

      }


      /* =====================================
         EMAIL NOTE
      ===================================== */

      let emailNote = "";


      if (status === "paid") {

        emailNote = `
          <div class="email-note">

            📧
            Email customer dengan PDF produk
            selepas payment disahkan.

            <br>

            Customer:
            <strong>
              ${escapeHtml(
                order.customer_email
              )}
            </strong>

          </div>
        `;

      }


      /* =====================================
         CARD
      ===================================== */

      card.innerHTML = `

        <div class="order-header">

          <div class="order-code">
            ${escapeHtml(
              order.order_code
            )}
          </div>

          <div
            class="status ${statusClass}"
          >
            ${escapeHtml(status)}
          </div>

        </div>


        <div class="customer">

          <strong>
            ${escapeHtml(
              order.customer_name
            )}
          </strong>

          <br>

          ${escapeHtml(
            order.customer_email
          )}

        </div>


        ${productsHtml}


        <div class="total">

          RM${Number(
            order.total || 0
          ).toFixed(2)}

        </div>


        <div class="order-date">

          ${escapeHtml(createdAt)}

        </div>


        <div class="actions">

          ${proofButton}

          ${actionButtons}

        </div>


        ${emailNote}

      `;


      ordersContainer.appendChild(
        card
      );

    }
  );

}


/* =========================================
   VIEW PAYMENT PROOF
========================================= */

async function viewPaymentProof(
  encodedPath
) {

  const path =
    decodeURIComponent(
      encodedPath
    );


  try {

    const {
      data,
      error
    } = await db.storage
      .from("payment-proofs")
      .createSignedUrl(
        path,
        300
      );


    if (error) {

      console.error(error);

      alert(
        "Unable to open payment proof.\n\n"
        +
        error.message
      );

      return;

    }


    if (
      !data ||
      !data.signedUrl
    ) {

      alert(
        "Payment proof was not found."
      );

      return;

    }


    window.open(
      data.signedUrl,
      "_blank"
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "Unable to open payment proof."
    );

  }

}


/* =========================================
   UPDATE STATUS
========================================= */

async function updateStatus(
  orderId,
  status
) {

  const action =
    status === "paid"
      ? "mark this order as PAID"
      : "REJECT this order";


  const confirmed =
    confirm(
      `Are you sure you want to ${action}?`
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } = await db
    .from("orders")
    .update({
      status: status
    })
    .eq(
      "id",
      orderId
    );


  if (error) {

    console.error(error);

    alert(
      "Unable to update order.\n\n"
      +
      error.message
    );

    return;

  }


  await loadOrders();

}


/* =========================================
   GET ORDER FOR EMAIL
========================================= */

async function getOrderForEmail(
  orderId
) {

  const {
    data: order,
    error: orderError
  } = await db
    .from("orders")
    .select("*")
    .eq(
      "id",
      orderId
    )
    .single();


  if (orderError) {

    throw orderError;

  }


  const {
    data: products,
    error: productsError
  } = await db
    .from("order_items")
    .select("*")
    .eq(
      "order_id",
      orderId
    );


  if (productsError) {

    throw productsError;

  }


  order.products =
    products || [];


  return order;

}


/* =========================================
   CREATE EMAIL CONTENT
========================================= */

function createEmailContent(
  order
) {

  let productText = "";


  if (
    order.products &&
    order.products.length > 0
  ) {

    productText =
      order.products
        .map(
          item => {

            const name =
              item.product_name ||
              "Product";

            const quantity =
              Number(
                item.quantity || 1
              );

            const subtotal =
              Number(
                item.subtotal || 0
              );

            return (
              "- " +
              name +
              " x" +
              quantity +
              " — RM" +
              subtotal.toFixed(2)
            );

          }
        )
        .join("\n");

  }
  else {

    productText =
      "- Product information unavailable";

  }


  const total =
    Number(
      order.total || 0
    ).toFixed(2);


  const subject =
    `KINO Order ${order.order_code} — Your Digital Products`;


  const body =
`Hi ${order.customer_name},

Thank you for your purchase from KINO ♡

/* =========================================
   EMAIL CUSTOMER
========================================= */

async function emailCustomer(
  orderId
) {

  try {

    const order =
      await getOrderForEmail(
        orderId
      );


    if (
      !order.customer_email
    ) {

      alert(
        "Customer email tidak dijumpai."
      );

      return;

    }


    const {
      subject,
      body
    } =
      createEmailContent(
        order
      );


    const email =
      encodeURIComponent(
        order.customer_email
      );

    const encodedSubject =
      encodeURIComponent(
        subject
      );

    const encodedBody =
      encodeURIComponent(
        body
      );


    /*
      Gmail Android App
    */

    const gmailAppUrl =
      `googlegmail://co?to=${email}&subject=${encodedSubject}&body=${encodedBody}`;


    /*
      Normal email fallback
    */

    const mailtoUrl =
      `mailto:${email}?subject=${encodedSubject}&body=${encodedBody}`;


    let appOpened = false;


    const markOpened = () => {

      appOpened = true;

    };


    window.addEventListener(
      "blur",
      markOpened,
      {
        once: true
      }
    );


    window.location.href =
      gmailAppUrl;


    /*
      If Gmail app cannot open,
      fallback to normal email handler.
    */

    setTimeout(
      function() {

        if (!appOpened) {

          window.location.href =
            mailtoUrl;

        }

      },
      1500
    );


  }

  catch (error) {

    console.error(error);

    alert(
      "Unable to prepare email.\n\n"
      +
      error.message
    );

  }

}


/* =========================================
   COPY ORDER INFO
========================================= */

async function copyOrderInfo(
  orderId
) {

  try {

    const order =
      await getOrderForEmail(
        orderId
      );


    const {
      subject,
      body
    } =
      createEmailContent(
        order
      );


    const text =
`TO:
${order.customer_email}

SUBJECT:
${subject}

BODY:
${body}`;


    await navigator.clipboard.writeText(
      text
    );


    alert(
      "Order info copied ♡"
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "Unable to copy order info."
    );

  }

}


/* =========================================
   SUMMARY
========================================= */

function updateSummary(
  orders
) {

  const pending =
    orders.filter(
      order =>
        order.status === "pending"
    ).length;


  const paid =
    orders.filter(
      order =>
        order.status === "paid"
    ).length;


  const sales =
    orders
      .filter(
        order =>
          order.status === "paid"
      )
      .reduce(
        (
          sum,
          order
        ) =>
          sum +
          Number(
            order.total || 0
          ),
        0
      );


  pendingCount.textContent =
    pending;


  paidCount.textContent =
    paid;


  salesTotal.textContent =
    "RM" +
    sales.toFixed(2);

}
