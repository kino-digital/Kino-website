<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>KINO Admin</title>

<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff8fb;
  color: #8a747b;
  font-family: 'Baloo 2', sans-serif;
}

button,
input {
  font-family: inherit;
}

/* =========================
   LOGIN
========================= */

#login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 440px;
  background: white;
  padding: 45px 40px;
  border-radius: 28px;
  box-shadow: 0 8px 30px rgba(190,130,150,0.12);
}

.login-logo {
  text-align: center;
  color: #b96f8a;
  font-size: 34px;
  font-weight: 700;
  margin-bottom: 5px;
}

.login-title {
  text-align: center;
  font-size: 18px;
  margin-bottom: 30px;
}

.input-group {
  margin-bottom: 18px;
}

.input-group label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #eadce2;
  border-radius: 15px;
  outline: none;
  font-size: 15px;
}

.input-group input:focus {
  border-color: #d9829e;
}

.login-button {
  width: 100%;
  border: none;
  background: #d9829e;
  color: white;
  padding: 14px;
  border-radius: 20px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.login-button:disabled {
  opacity: 0.6;
}

.login-error {
  display: none;
  background: #fff0f3;
  color: #a96b82;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 18px;
  text-align: center;
}

/* =========================
   HEADER
========================= */

#dashboard-page {
  display: none;
}

header {
  background: white;
  padding: 18px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 15px rgba(190,130,150,0.06);
}

.logo {
  color: #b96f8a;
  font-size: 25px;
  font-weight: 700;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.admin-label {
  font-size: 14px;
}

.logout-button {
  border: none;
  background: #f7dce5;
  color: #a96b82;
  padding: 8px 15px;
  border-radius: 18px;
  cursor: pointer;
}

/* =========================
   DASHBOARD
========================= */

.dashboard {
  max-width: 1000px;
  margin: 40px auto;
  padding: 20px;
}

h1 {
  color: #b96f8a;
  font-size: 32px;
  margin-bottom: 25px;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 30px;
}

.summary-box {
  background: white;
  padding: 22px;
  border-radius: 20px;
  box-shadow: 0 5px 18px rgba(190,130,150,0.10);
}

.summary-label {
  font-size: 14px;
}

.summary-number {
  color: #b96f8a;
  font-size: 28px;
  font-weight: 700;
}

/* =========================
   ORDERS
========================= */

.order-card {
  background: white;
  padding: 22px;
  border-radius: 20px;
  margin-bottom: 15px;
  box-shadow: 0 5px 18px rgba(190,130,150,0.10);
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 12px;
}

.order-code {
  color: #b96f8a;
  font-weight: 700;
  font-size: 17px;
}

.status {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  background: #fde6ee;
  color: #a96b82;
}

.status.paid {
  background: #e5f6ec;
  color: #4f8a68;
}

.status.rejected {
  background: #f1eeee;
  color: #777;
}

.customer {
  margin-bottom: 12px;
}

.total {
  font-size: 20px;
  font-weight: 700;
  color: #b96f8a;
  margin-bottom: 15px;
}

.order-date {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 15px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.actions button {
  border: none;
  padding: 9px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
}

.proof-button {
  background: #f7dce5;
  color: #a96b82;
}

.paid-button {
  background: #d9829e;
  color: white;
}

.reject-button {
  background: #f7dce5;
  color: #a96b82;
}

.loading,
.empty,
.error {
  background: white;
  padding: 35px;
  text-align: center;
  border-radius: 20px;
}

.error {
  color: #a96b82;
  background: #fff0f3;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

  .summary {
    grid-template-columns: 1fr;
  }

  .dashboard {
    margin: 25px auto;
    padding: 15px;
  }

  header {
    padding: 15px 5%;
  }

  .header-right {
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .order-header {
    flex-direction: column;
    align-items: flex-start;
  }

}

</style>

</head>


<body>


<!-- =========================================
     LOGIN PAGE
========================================= -->

<section id="login-page">

  <div class="login-box">

    <div class="login-logo">
      KINO ♡
    </div>

    <div class="login-title">
      Admin Dashboard
    </div>

    <div
      id="login-error"
      class="login-error"
    ></div>

    <form id="login-form">

      <div class="input-group">

        <label>Email</label>

        <input
          type="email"
          id="login-email"
          placeholder="Admin email"
          required
        >

      </div>


      <div class="input-group">

        <label>Password</label>

        <input
          type="password"
          id="login-password"
          placeholder="Password"
          required
        >

      </div>


      <button
        type="submit"
        class="login-button"
        id="login-button"
      >
        LOGIN
      </button>

    </form>

  </div>

</section>


<!-- =========================================
     DASHBOARD
========================================= -->

<section id="dashboard-page">

<header>

  <div class="logo">
    KINO
  </div>

  <div class="header-right">

    <div class="admin-label">
      Admin Dashboard
    </div>

    <button
      class="logout-button"
      onclick="logout()"
    >
      LOGOUT
    </button>

  </div>

</header>


<main class="dashboard">

  <h1>
    Orders ♡
  </h1>


  <div class="summary">

    <div class="summary-box">

      <div class="summary-label">
        Pending Orders
      </div>

      <div
        class="summary-number"
        id="pending-count"
      >
        0
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        Paid Orders
      </div>

      <div
        class="summary-number"
        id="paid-count"
      >
        0
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        Total Sales
      </div>

      <div
        class="summary-number"
        id="sales-total"
      >
        RM0.00
      </div>

    </div>

  </div>


  <div id="orders">

    <div class="loading">
      Loading orders...
    </div>

  </div>

</main>

</section>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://vbdgzsapdbpgfcdksdoi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const loginPage =
  document.getElementById("login-page");

const dashboardPage =
  document.getElementById("dashboard-page");

const loginForm =
  document.getElementById("login-form");

const loginError =
  document.getElementById("login-error");

const loginButton =
  document.getElementById("login-button");

const ordersContainer =
  document.getElementById("orders");

const pendingCount =
  document.getElementById("pending-count");

const paidCount =
  document.getElementById("paid-count");

const salesTotal =
  document.getElementById("sales-total");


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    loginError.style.display = "none";

    loginButton.disabled = true;

    loginButton.textContent =
      "LOGGING IN...";


    const email =
      document
        .getElementById("login-email")
        .value
        .trim();


    const password =
      document
        .getElementById("login-password")
        .value;


    const { error } =
      await db.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      console.error(error);

      loginError.textContent =
        "Email atau password salah.";

      loginError.style.display =
        "block";

      loginButton.disabled = false;

      loginButton.textContent =
        "LOGIN";

      return;

    }


    /*
      Supabase RLS decides whether
      this account is actually admin.
    */

    const { error: adminError } =
      await db
        .from("orders")
        .select("id")
        .limit(1);


    if (adminError) {

      console.error(adminError);

      await db.auth.signOut();

      loginError.textContent =
        "Access denied. Admin sahaja boleh masuk.";

      loginError.style.display =
        "block";

      loginButton.disabled = false;

      loginButton.textContent =
        "LOGIN";

      return;

    }


    await showDashboard();

  }
);


/* =========================================
   SHOW DASHBOARD
========================================= */

async function showDashboard() {

  loginPage.style.display = "none";

  dashboardPage.style.display = "block";

  await loadOrders();

}


/* =========================================
   CHECK SESSION
========================================= */

async function checkSession() {

  const {
    data: {
      session
    }
  } = await db.auth.getSession();


  if (!session) {

    loginPage.style.display = "flex";

    dashboardPage.style.display = "none";

    return;

  }


  const { error } =
    await db
      .from("orders")
      .select("id")
      .limit(1);


  if (error) {

    await db.auth.signOut();

    loginPage.style.display = "flex";

    dashboardPage.style.display = "none";

    return;

  }


  await showDashboard();

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders() {

  ordersContainer.innerHTML = `
    <div class="loading">
      Loading orders...
    </div>
  `;


  const {
    data,
    error
  } = await db
    .from("orders")
    .select("*")
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(error);

    ordersContainer.innerHTML = `
      <div class="error">
        Unable to load orders.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    return;

  }


  const orders =
    data || [];


  updateSummary(orders);


  if (orders.length === 0) {

    ordersContainer.innerHTML = `
      <div class="empty">
        No orders yet ♡
      </div>
    `;

    return;

  }


  ordersContainer.innerHTML = "";


  orders.forEach(
    order => {

      const card =
        document.createElement("div");

      card.className =
        "order-card";


      const status =
        String(order.status || "pending");


      const statusClass =
        status === "paid"
          ? "paid"
          : status === "rejected"
            ? "rejected"
            : "";


      const createdAt =
        order.created_at
          ? new Date(
              order.created_at
            ).toLocaleString(
              "en-MY"
            )
          : "-";


      let proofButton = "";


      if (
        order.payment_proof_path
      ) {

        proofButton = `
          <button
            class="proof-button"
            onclick="viewPaymentProof('${encodeURIComponent(order.payment_proof_path)}')"
          >
            VIEW PAYMENT PROOF
          </button>
        `;

      }


      let actionButtons = "";


      if (status === "pending") {

        actionButtons = `

          <button
            class="paid-button"
            onclick="updateStatus('${order.id}', 'paid')"
          >
            MARK AS PAID
          </button>

          <button
            class="reject-button"
            onclick="updateStatus('${order.id}', 'rejected')"
          >
            REJECT
          </button>

        `;

      }


      card.innerHTML = `

        <div class="order-header">

          <div class="order-code">
            ${escapeHtml(
              order.order_code
            )}
          </div>

          <div
            class="status ${statusClass}"
          >
            ${escapeHtml(status)}
          </div>

        </div>


        <div class="customer">

          <strong>
            ${escapeHtml(
              order.customer_name
            )}
          </strong>

          <br>

          ${escapeHtml(
            order.customer_email
          )}

        </div>


        <div class="total">
          RM${Number(
            order.total || 0
          ).toFixed(2)}
        </div>


        <div class="order-date">
          ${escapeHtml(createdAt)}
        </div>


        <div class="actions">

          ${proofButton}

          ${actionButtons}

        </div>

      `;


      ordersContainer.appendChild(
        card
      );

    }
  );

}


/* =========================================
   VIEW PAYMENT PROOF
========================================= */

async function viewPaymentProof(
  encodedPath
) {

  const path =
    decodeURIComponent(
      encodedPath
    );


  try {

    const {
      data,
      error
    } = await db.storage
      .from("payment-proofs")
      .createSignedUrl(
        path,
        300
      );


    if (error) {

      console.error(error);

      alert(
        "Unable to open payment proof.\n\n"
        + error.message
      );

      return;

    }


    if (!data || !data.signedUrl) {

      alert(
        "Payment proof was not found."
      );

      return;

    }


    window.open(
      data.signedUrl,
      "_blank"
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "Unable to open payment proof."
    );

  }

}


/* =========================================
   UPDATE STATUS
========================================= */

async function updateStatus(
  orderId,
  status
) {

  const action =
    status === "paid"
      ? "mark this order as PAID"
      : "REJECT this order";


  const confirmed =
    confirm(
      `Are you sure you want to ${action}?`
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } = await db
    .from("orders")
    .update({
      status: status
    })
    .eq(
      "id",
      orderId
    );


  if (error) {

    console.error(error);

    alert(
      "Unable to update order.\n\n"
      + error.message
    );

    return;

  }


  await loadOrders();

}


/* =========================================
   SUMMARY
========================================= */

function updateSummary(
  orders
) {

  const pending =
    orders.filter(
      order =>
        order.status === "pending"
    ).length;


  const paid =
    orders.filter(
      order =>
        order.status === "paid"
    ).length;


  const sales =
    orders
      .filter(
        order =>
          order.status === "paid"
      )
      .reduce(
        (
          sum,
          order
        ) =>
          sum +
          Number(
            order.total || 0
          ),
        0
      );


  pendingCount.textContent =
    pending;


  paidCount.textContent =
    paid;


  salesTotal.textContent =
    "RM" +
    sales.toFixed(2);

}


/* =========================================
   LOGOUT
========================================= */

async function logout() {

  await db.auth.signOut();

  dashboardPage.style.display =
    "none";

  loginPage.style.display =
    "flex";

  document
    .getElementById("login-password")
    .value = "";

}


/* =========================================
   START
========================================= */

checkSession();

</script>

</body>
</html>
