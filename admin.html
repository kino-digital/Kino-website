<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>KINO Admin</title>

<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   GLOBAL
========================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff8fb;
  color: #8a747b;
  font-family: 'Baloo 2', sans-serif;
}

button,
input,
select {
  font-family: inherit;
}


/* =========================
   LOGIN
========================= */

#login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 440px;
  background: white;
  padding: 45px 40px;
  border-radius: 28px;
  box-shadow: 0 8px 30px rgba(190,130,150,0.12);
}

.login-logo {
  text-align: center;
  color: #b96f8a;
  font-size: 34px;
  font-weight: 700;
  margin-bottom: 5px;
}

.login-title {
  text-align: center;
  font-size: 18px;
  margin-bottom: 30px;
}

.input-group {
  margin-bottom: 18px;
}

.input-group label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #eadce2;
  border-radius: 15px;
  outline: none;
  font-size: 15px;
}

.input-group input:focus {
  border-color: #d9829e;
}

.login-button {
  width: 100%;
  border: none;
  background: #d9829e;
  color: white;
  padding: 14px;
  border-radius: 20px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.login-button:disabled {
  opacity: 0.6;
}

.login-error {
  display: none;
  background: #fff0f3;
  color: #a96b82;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 18px;
  text-align: center;
}


/* =========================
   DASHBOARD
========================= */

#dashboard-page {
  display: none;
}

header {
  background: white;
  padding: 18px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 15px rgba(190,130,150,0.06);
}

.logo {
  color: #b96f8a;
  font-size: 25px;
  font-weight: 700;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.admin-label {
  font-size: 14px;
}

.logout-button {
  border: none;
  background: #f7dce5;
  color: #a96b82;
  padding: 8px 15px;
  border-radius: 18px;
  cursor: pointer;
}


/* =========================
   MAIN
========================= */

.dashboard {
  max-width: 1100px;
  margin: 40px auto;
  padding: 20px;
}

h1 {
  color: #b96f8a;
  font-size: 32px;
  margin: 0 0 25px;
}


/* =========================
   SUMMARY
========================= */

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 30px;
}

.summary-box {
  background: white;
  padding: 22px;
  border-radius: 20px;
  box-shadow: 0 5px 18px rgba(190,130,150,0.10);
}

.summary-label {
  font-size: 14px;
}

.summary-number {
  color: #b96f8a;
  font-size: 28px;
  font-weight: 700;
  margin-top: 3px;
}

.summary-small {
  font-size: 12px;
  color: #aaa;
  margin-top: 3px;
}


/* =========================
   SEARCH + FILTER
========================= */

.order-tools {
  background: white;
  padding: 18px;
  border-radius: 20px;
  margin-bottom: 25px;
  box-shadow: 0 5px 18px rgba(190,130,150,0.08);
}

.search-box {
  width: 100%;
  padding: 13px 16px;
  border: 1px solid #eadce2;
  border-radius: 15px;
  outline: none;
  font-size: 14px;
  margin-bottom: 14px;
}

.search-box:focus {
  border-color: #d9829e;
}

.filter-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.filter-button {
  border: none;
  background: #f7edf1;
  color: #a96b82;
  padding: 9px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
}

.filter-button.active {
  background: #d9829e;
  color: white;
}


/* =========================
   ORDERS
========================= */

.order-card {
  background: white;
  padding: 22px;
  border-radius: 20px;
  margin-bottom: 15px;
  box-shadow: 0 5px 18px rgba(190,130,150,0.10);
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 12px;
}

.order-code {
  color: #b96f8a;
  font-weight: 700;
  font-size: 17px;
}

.status {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  background: #fde6ee;
  color: #a96b82;
}

.status.paid {
  background: #e5f6ec;
  color: #4f8a68;
}

.status.rejected {
  background: #f1eeee;
  color: #777;
}

.customer {
  margin-bottom: 12px;
  line-height: 1.5;
}

.customer strong {
  color: #806d74;
}

.total {
  font-size: 20px;
  font-weight: 700;
  color: #b96f8a;
  margin-bottom: 15px;
}

.order-date {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 15px;
}


/* =========================
   PRODUCTS
========================= */

.products-box {
  background: #fff8fb;
  border-radius: 15px;
  padding: 14px;
  margin: 15px 0;
}

.products-title {
  color: #b96f8a;
  font-weight: 700;
  margin-bottom: 10px;
}

.product-row {
  background: white;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.product-row:last-child {
  margin-bottom: 0;
}

.product-name {
  font-weight: 600;
  color: #806d74;
}

.product-qty {
  font-size: 13px;
  color: #aaa;
  margin-top: 2px;
}

.product-price {
  text-align: right;
  color: #a96b82;
  font-weight: 600;
}


/* =========================
   ACTIONS
========================= */

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.actions button {
  border: none;
  padding: 9px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
}

.proof-button {
  background: #f7dce5;
  color: #a96b82;
}

.paid-button {
  background: #d9829e;
  color: white;
}

.reject-button {
  background: #f7dce5;
  color: #a96b82;
}

.email-button {
  background: #eadff5;
  color: #80649a;
}

.copy-button {
  background: #eee7ea;
  color: #806d74;
}


/* =========================
   STATES
========================= */

.loading,
.empty,
.error {
  background: white;
  padding: 35px;
  text-align: center;
  border-radius: 20px;
}

.error {
  color: #a96b82;
  background: #fff0f3;
}

.no-results {
  background: white;
  padding: 30px;
  text-align: center;
  border-radius: 20px;
  color: #aaa;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 750px) {

  .summary {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 650px) {

  .summary {
    grid-template-columns: 1fr;
  }

  .dashboard {
    margin: 25px auto;
    padding: 15px;
  }

  header {
    padding: 15px 5%;
  }

  .header-right {
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .order-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .product-row {
    align-items: flex-start;
  }

  .product-price {
    white-space: nowrap;
  }

  .filter-buttons {
    gap: 6px;
  }

  .filter-button {
    padding: 8px 12px;
  }

}

</style>

</head>


<body>


<!-- =========================================
     LOGIN
========================================= -->

<section id="login-page">

  <div class="login-box">

    <div class="login-logo">
      KINO ♡
    </div>

    <div class="login-title">
      Admin Dashboard
    </div>

    <div
      id="login-error"
      class="login-error"
    ></div>

    <form id="login-form">

      <div class="input-group">

        <label>Email</label>

        <input
          type="email"
          id="login-email"
          placeholder="Admin email"
          required
        >

      </div>


      <div class="input-group">

        <label>Password</label>

        <input
          type="password"
          id="login-password"
          placeholder="Password"
          required
        >

      </div>


      <button
        type="submit"
        class="login-button"
        id="login-button"
      >
        LOGIN
      </button>

    </form>

  </div>

</section>


<!-- =========================================
     DASHBOARD
========================================= -->

<section id="dashboard-page">

<header>

  <div class="logo">
    KINO
  </div>

  <div class="header-right">

    <div class="admin-label">
      Admin Dashboard
    </div>

    <button
      class="logout-button"
      onclick="logout()"
    >
      LOGOUT
    </button>

  </div>

</header>


<main class="dashboard">

  <h1>
    Dashboard ♡
  </h1>


  <!-- =========================
       SUMMARY
  ========================== -->

  <div class="summary">


    <div class="summary-box">

      <div class="summary-label">
        Today's Sales
      </div>

      <div
        class="summary-number"
        id="today-sales"
      >
        RM0.00
      </div>

      <div class="summary-small">
        Paid orders today
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        This Month
      </div>

      <div
        class="summary-number"
        id="month-sales"
      >
        RM0.00
      </div>

      <div class="summary-small">
        Paid orders this month
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        Total Sales
      </div>

      <div
        class="summary-number"
        id="sales-total"
      >
        RM0.00
      </div>

      <div class="summary-small">
        All paid orders
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        Today's Orders
      </div>

      <div
        class="summary-number"
        id="today-orders"
      >
        0
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        Pending Orders
      </div>

      <div
        class="summary-number"
        id="pending-count"
      >
        0
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        Paid Orders
      </div>

      <div
        class="summary-number"
        id="paid-count"
      >
        0
      </div>

    </div>

  </div>


  <!-- =========================
       SEARCH / FILTER
  ========================== -->

  <div class="order-tools">

    <input
      type="search"
      id="search-input"
      class="search-box"
      placeholder="🔍 Search name, email or order code..."
    >


    <div class="filter-buttons">

      <button
        class="filter-button active"
        data-filter="all"
      >
        ALL
      </button>

      <button
        class="filter-button"
        data-filter="pending"
      >
        PENDING
      </button>

      <button
        class="filter-button"
        data-filter="paid"
      >
        PAID
      </button>

      <button
        class="filter-button"
        data-filter="rejected"
      >
        REJECTED
      </button>

    </div>

  </div>


  <h1 style="font-size:26px;">
    Orders ♡
  </h1>


  <div id="orders">

    <div class="loading">
      Loading orders...
    </div>

  </div>

</main>

</section>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://vbdgzsapdbpgfcdksdoi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const loginPage =
  document.getElementById("login-page");

const dashboardPage =
  document.getElementById("dashboard-page");

const loginForm =
  document.getElementById("login-form");

const loginError =
  document.getElementById("login-error");

const loginButton =
  document.getElementById("login-button");

const ordersContainer =
  document.getElementById("orders");

const pendingCount =
  document.getElementById("pending-count");

const paidCount =
  document.getElementById("paid-count");

const salesTotal =
  document.getElementById("sales-total");

const todaySales =
  document.getElementById("today-sales");

const monthSales =
  document.getElementById("month-sales");

const todayOrders =
  document.getElementById("today-orders");

const searchInput =
  document.getElementById("search-input");


let allOrders = [];

let currentFilter = "all";


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================
   DATE HELPERS
========================================= */

function isToday(dateString) {

  if (!dateString) {
    return false;
  }

  const date =
    new Date(dateString);

  const now =
    new Date();

  return (
    date.getFullYear() === now.getFullYear() &&
    date.getMonth() === now.getMonth() &&
    date.getDate() === now.getDate()
  );

}


function isThisMonth(dateString) {

  if (!dateString) {
    return false;
  }

  const date =
    new Date(dateString);

  const now =
    new Date();

  return (
    date.getFullYear() === now.getFullYear() &&
    date.getMonth() === now.getMonth()
  );

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    loginError.style.display =
      "none";

    loginButton.disabled =
      true;

    loginButton.textContent =
      "LOGGING IN...";


    const email =
      document
        .getElementById("login-email")
        .value
        .trim();


    const password =
      document
        .getElementById("login-password")
        .value;


    const { error } =
      await db.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      console.error(error);

      loginError.textContent =
        "Email atau password salah.";

      loginError.style.display =
        "block";

      loginButton.disabled =
        false;

      loginButton.textContent =
        "LOGIN";

      return;

    }


    const { error: adminError } =
      await db
        .from("orders")
        .select("id")
        .limit(1);


    if (adminError) {

      console.error(adminError);

      await db.auth.signOut();

      loginError.textContent =
        "Access denied. Admin sahaja boleh masuk.";

      loginError.style.display =
        "block";

      loginButton.disabled =
        false;

      loginButton.textContent =
        "LOGIN";

      return;

    }


    await showDashboard();

  }
);


/* =========================================
   SHOW DASHBOARD
========================================= */

async function showDashboard() {

  loginPage.style.display =
    "none";

  dashboardPage.style.display =
    "block";

  await loadOrders();

}


/* =========================================
   CHECK SESSION
========================================= */

async function checkSession() {

  const {
    data: {
      session
    }
  } = await db.auth.getSession();


  if (!session) {

    loginPage.style.display =
      "flex";

    dashboardPage.style.display =
      "none";

    return;

  }


  const { error } =
    await db
      .from("orders")
      .select("id")
      .limit(1);


  if (error) {

    await db.auth.signOut();

    loginPage.style.display =
      "flex";

    dashboardPage.style.display =
      "none";

    return;

  }


  await showDashboard();

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders() {

  ordersContainer.innerHTML = `
    <div class="loading">
      Loading orders...
    </div>
  `;


  const {
    data,
    error
  } = await db
    .from("orders")
    .select("*")
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(error);

    ordersContainer.innerHTML = `
      <div class="error">
        Unable to load orders.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    return;

  }


  allOrders =
    data || [];


  await loadProducts();

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts() {

  if (!allOrders.length) {

    updateSummary(allOrders);

    renderOrders();

    return;

  }


  const orderIds =
    allOrders
      .map(order => order.id)
      .filter(Boolean);


  if (!orderIds.length) {

    updateSummary(allOrders);

    renderOrders();

    return;

  }


  const {
    data: items,
    error
  } = await db
    .from("order_items")
    .select("*")
    .in(
      "order_id",
      orderIds
    );


  if (error) {

    console.error(
      "Unable to load order items:",
      error
    );

    allOrders =
      allOrders.map(order => ({
        ...order,
        items: []
      }));

  }

  else {

    const itemList =
      items || [];


    allOrders =
      allOrders.map(order => ({

        ...order,

        items:
          itemList.filter(
            item =>
              item.order_id === order.id
          )

      }));

  }


  updateSummary(allOrders);

  renderOrders();

}


/* =========================================
   SUMMARY
========================================= */

function updateSummary(
  orders
) {

  const pending =
    orders.filter(
      order =>
        String(order.status || "")
          .toLowerCase() === "pending"
    ).length;


  const paidOrders =
    orders.filter(
      order =>
        String(order.status || "")
          .toLowerCase() === "paid"
    );


  const paid =
    paidOrders.length;


  const totalSales =
    paidOrders.reduce(
      (
        sum,
        order
      ) =>
        sum +
        Number(
          order.total || 0
        ),
      0
    );


  const todayPaidOrders =
    paidOrders.filter(
      order =>
        isToday(
          order.created_at
        )
    );


  const todaySalesValue =
    todayPaidOrders.reduce(
      (
        sum,
        order
      ) =>
        sum +
        Number(
          order.total || 0
        ),
      0
    );


  const monthPaidOrders =
    paidOrders.filter(
      order =>
        isThisMonth(
          order.created_at
        )
    );


  const monthSalesValue =
    monthPaidOrders.reduce(
      (
        sum,
        order
      ) =>
        sum +
        Number(
          order.total || 0
        ),
      0
    );


  const todayOrderCount =
    orders.filter(
      order =>
        isToday(
          order.created_at
        )
    ).length;


  pendingCount.textContent =
    pending;


  paidCount.textContent =
    paid;


  salesTotal.textContent =
    "RM" +
    totalSales.toFixed(2);


  todaySales.textContent =
    "RM" +
    todaySalesValue.toFixed(2);


  monthSales.textContent =
    "RM" +
    monthSalesValue.toFixed(2);


  todayOrders.textContent =
    todayOrderCount;

}


/* =========================================
   FILTER BUTTONS
========================================= */

document
  .querySelectorAll(".filter-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      function() {

        document
          .querySelectorAll(".filter-button")
          .forEach(
            item =>
              item.classList.remove(
                "active"
              )
          );


        this.classList.add(
          "active"
        );


        currentFilter =
          this.dataset.filter;


        renderOrders();

      }
    );

  });


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
  "input",
  function() {

    renderOrders();

  }
);


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders() {

  let orders =
    [...allOrders];


  /* FILTER */

  if (
    currentFilter !== "all"
  ) {

    orders =
      orders.filter(
        order =>
          String(
            order.status || "pending"
          ).toLowerCase()
          === currentFilter
      );

  }


  /* SEARCH */

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  if (search) {

    orders =
      orders.filter(
        order => {

          const text = [

            order.order_code,

            order.customer_name,

            order.customer_email,

            order.status

          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


          return text.includes(
            search
          );

        }
      );

  }


  if (orders.length === 0) {

    ordersContainer.innerHTML = `
      <div class="no-results">
        No orders found ♡
      </div>
    `;

    return;

  }


  ordersContainer.innerHTML =
    "";


  orders.forEach(
    order => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "order-card";


      const status =
        String(
          order.status || "pending"
        ).toLowerCase();


      const statusClass =
        status === "paid"
          ? "paid"
          : status === "rejected"
            ? "rejected"
            : "";


      const createdAt =
        order.created_at
          ? new Date(
              order.created_at
            ).toLocaleString(
              "en-MY"
            )
          : "-";


      /* =========================
         PRODUCTS
      ========================== */

      const items =
        order.items || [];


      let productsHTML = "";


      if (
        items.length > 0
      ) {

        productsHTML =
          items
            .map(
              item => {

                const name =
                  item.product_name ||
                  item.name ||
                  "Product";


                const quantity =
                  Number(
                    item.quantity || 1
                  );


                const subtotal =
                  Number(
                    item.subtotal ||
                    (
                      Number(
                        item.product_price || 0
                      ) *
                      quantity
                    )
                  );


                return `

                  <div class="product-row">

                    <div>

                      <div class="product-name">
                        ${escapeHtml(name)}
                      </div>

                      <div class="product-qty">
                        RM${Number(
                          item.product_price || 0
                        ).toFixed(2)}
                        × ${quantity}
                      </div>

                    </div>

                    <div class="product-price">
                      RM${subtotal.toFixed(2)}
                    </div>

                  </div>

                `;

              }
            )
            .join("");

      }

      else {

        productsHTML = `
          <div
            style="
              color:#aaa;
              font-size:13px;
            "
          >
            No product information.
          </div>
        `;

      }


      /* =========================
         PAYMENT PROOF
      ========================== */

      let proofButton = "";


      if (
        order.payment_proof_path
      ) {

        proofButton = `

          <button
            class="proof-button"
            onclick="viewPaymentProof('${encodeURIComponent(
              order.payment_proof_path
            )}')"
          >
            VIEW PAYMENT PROOF
          </button>

        `;

      }


      /* =========================
         ACTIONS
      ========================== */

      let actionButtons = "";


      if (
        status === "pending"
      ) {

        actionButtons = `

          <button
            class="paid-button"
            onclick="updateStatus(
              '${escapeJs(order.id)}',
              'paid'
            )"
          >
            MARK AS PAID
          </button>

          <button
            class="reject-button"
            onclick="updateStatus(
              '${escapeJs(order.id)}',
              'rejected'
            )"
          >
            REJECT
          </button>

        `;

      }


      if (
        status === "paid"
      ) {

        actionButtons = `

          <button
            class="email-button"
            onclick="emailCustomer('${escapeJs(order.id)}')"
          >
            EMAIL ORDER
          </button>

          <button
            class="copy-button"
            onclick="copyOrderInfo('${escapeJs(order.id)}')"
          >
            COPY ORDER INFO
          </button>

        `;

      }


      card.innerHTML = `

        <div class="order-header">

          <div class="order-code">
            ${escapeHtml(
              order.order_code
            )}
          </div>

          <div
            class="status ${statusClass}"
          >
            ${escapeHtml(status)}
          </div>

        </div>


        <div class="customer">

          <strong>
            ${escapeHtml(
              order.customer_name
            )}
          </strong>

          <br>

          ${escapeHtml(
            order.customer_email
          )}

        </div>


        <div class="products-box">

          <div class="products-title">
            Products
          </div>

          ${productsHTML}

        </div>


        <div class="total">
          RM${Number(
            order.total || 0
          ).toFixed(2)}
        </div>


        <div class="order-date">
          ${escapeHtml(
            createdAt
          )}
        </div>


        <div class="actions">

          ${proofButton}

          ${actionButtons}

        </div>

      `;


      ordersContainer.appendChild(
        card
      );

    }
  );

}


/* =========================================
   SAFE JS STRING
========================================= */

function escapeJs(value) {

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );

}


/* =========================================
   VIEW PAYMENT PROOF
========================================= */

async function viewPaymentProof(
  encodedPath
) {

  const path =
    decodeURIComponent(
      encodedPath
    );


  try {

    const {
      data,
      error
    } = await db.storage
      .from(
        "payment-proofs"
      )
      .createSignedUrl(
        path,
        300
      );


    if (error) {

      console.error(error);

      alert(
        "Unable to open payment proof.\n\n"
        +
        error.message
      );

      return;

    }


    if (
      !data ||
      !data.signedUrl
    ) {

      alert(
        "Payment proof was not found."
      );

      return;

    }


    window.open(
      data.signedUrl,
      "_blank"
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "Unable to open payment proof."
    );

  }

}


/* =========================================
   UPDATE STATUS
========================================= */

async function updateStatus(
  orderId,
  status
) {

  const action =
    status === "paid"
      ? "mark this order as PAID"
      : "REJECT this order";


  const confirmed =
    confirm(
      `Are you sure you want to ${action}?`
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } = await db
    .from("orders")
    .update({
      status: status
    })
    .eq(
      "id",
      orderId
    );


  if (error) {

    console.error(error);

    alert(
      "Unable to update order.\n\n"
      +
      error.message
    );

    return;

  }


  await loadOrders();

}


/* =========================================
   EMAIL CUSTOMER
========================================= */

function emailCustomer(
  orderId
) {

  const order =
    allOrders.find(
      item =>
        String(item.id) ===
        String(orderId)
    );


  if (!order) {

    alert(
      "Order not found."
    );

    return;

  }


  const email =
    order.customer_email || "";


  if (!email) {

    alert(
      "Customer email not found."
    );

    return;

  }


  const items =
    order.items || [];


  const productText =
    items.length
      ? items
          .map(
            item =>
              `${item.product_name || item.name || "Product"} x ${Number(item.quantity || 1)}`
          )
          .join("\n")
      : "Digital product";


  const subject =
    `KINO Order ${order.order_code}`;


  const body =
`Hi ${order.customer_name || "there"},

Thank you for your purchase from KINO ♡

Order: ${order.order_code}

Products:
${productText}

Total: RM${Number(
  order.total || 0
).toFixed(2)}

Your digital product is attached to this email.

Thank you for supporting KINO ♡`;


  const mailto =
    "mailto:" +
    encodeURIComponent(email) +
    "?subject=" +
    encodeURIComponent(subject) +
    "&body=" +
    encodeURIComponent(body);


  window.location.href =
    mailto;

}


/* =========================================
   COPY ORDER INFO
========================================= */

async function copyOrderInfo(
  orderId
) {

  const order =
    allOrders.find(
      item =>
        String(item.id) ===
        String(orderId)
    );


  if (!order) {

    alert(
      "Order not found."
    );

    return;

  }


  const items =
    order.items || [];


  const productText =
    items.length
      ? items
          .map(
            item =>
              `${item.product_name || item.name || "Product"} x ${Number(item.quantity || 1)}`
          )
          .join("\n")
      : "No product information";


  const text =
`KINO ORDER

Order:
${order.order_code}

Customer:
${order.customer_name || "-"}

Email:
${order.customer_email || "-"}

Products:
${productText}

Total:
RM${Number(
  order.total || 0
).toFixed(2)}

Status:
${order.status || "-"}

Date:
${
  order.created_at
    ? new Date(
        order.created_at
      ).toLocaleString("en-MY")
    : "-"
}`;


  try {

    await navigator.clipboard.writeText(
      text
    );


    alert(
      "Order information copied ♡"
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "Unable to copy order information."
    );

  }

}

  dashboardPage.style.display =

  loginPage.style.display =
