<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <title>Cart | KINO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Baloo 2', sans-serif;
      background: #fff8fa;
      color: #5f4a50;
      line-height: 1.6;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #ffffff;
      padding: 25px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      color: #c47794;
    }

    nav a {
      text-decoration: none;
      color: #5f4a50;
      margin-left: 20px;
      font-size: 14px;
    }

    nav a:hover {
      color: #c47794;
    }

    /* =========================
       CART
    ========================= */

    .cart {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #b96f8a;
      font-size: 34px;
      margin-bottom: 30px;
    }

    /* =========================
       CART ITEM
    ========================= */

    .cart-item {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 15px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      box-shadow:
        0 5px 18px rgba(190, 130, 150, 0.10);
    }

    .item-name {
      font-size: 18px;
      font-weight: 600;
      color: #b96f8a;
    }

    .item-price {
      color: #8a747b;
      font-size: 14px;
      margin-top: 3px;
    }

    /* =========================
       QUANTITY
    ========================= */

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .quantity-controls button {
      width: 28px;
      height: 28px;

      border: none;
      border-radius: 50%;

      background: #f7dce5;
      color: #a96b82;

      font-family: 'Baloo 2', sans-serif;
      font-size: 18px;

      cursor: pointer;
    }

    .quantity-controls button:hover {
      background: #efc5d4;
    }

    .quantity-controls span {
      min-width: 20px;
      text-align: center;

      color: #8a747b;
      font-weight: 600;
    }

    /* =========================
       REMOVE
    ========================= */

    .remove-button {
      background: #f7dce5;
      color: #a96b82;

      border: none;

      padding: 8px 16px;

      border-radius: 20px;

      font-family: 'Baloo 2', sans-serif;
      font-size: 13px;

      cursor: pointer;
    }

    .remove-button:hover {
      background: #efc5d4;
    }

    /* =========================
       EMPTY CART
    ========================= */

    .empty {
      text-align: center;

      color: #8a747b;

      padding: 40px;

      background: #ffffff;

      border-radius: 20px;

      box-shadow:
        0 5px 18px rgba(190, 130, 150, 0.08);
    }

    /* =========================
       TOTAL
    ========================= */

    .total-box {
      background: #fde6ee;

      padding: 25px;

      border-radius: 20px;

      margin-top: 30px;

      text-align: center;
    }

    .total {
      font-size: 26px;
      font-weight: 700;

      color: #b96f8a;

      margin-bottom: 20px;
    }

    /* =========================
       CHECKOUT BUTTON
    ========================= */

    .checkout-button {
      display: inline-block;

      background: #d9829e;

      color: white;

      text-decoration: none;

      padding: 12px 30px;

      border-radius: 30px;

      font-size: 16px;
    }

    .checkout-button:hover {
      background: #c97491;
    }

    .checkout-button.disabled {
      background: #d9c7cd;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 70px;

      background: #fde6ee;

      padding: 25px;

      text-align: center;

      color: #8a747b;

      font-size: 14px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        flex-direction: column;
        gap: 12px;
      }

      nav {
        text-align: center;
      }

      nav a {
        margin-left: 10px;
        margin-right: 10px;
      }

      .cart {
        margin: 30px auto;
        padding: 15px;
      }

      h1 {
        font-size: 32px;
      }

      .cart-item {
        padding: 18px;
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="logo">
      KINO
    </div>

    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="stickers.html">
        Shop
      </a>

    </nav>

  </header>


  <!-- =========================
       CART
  ========================= -->

  <main class="cart">

    <h1>
      Your Cart ♡
    </h1>


    <div id="cart-items"></div>


    <!-- =========================
         TOTAL
    ========================= -->

    <div class="total-box">

      <div
        class="total"
        id="total"
      >
        Total: RM0.00
      </div>


      <a
        href="checkout.html"
        class="checkout-button"
        id="checkout-button"
      >
        CHECKOUT
      </a>

    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    Made for cozy moments ♡

  </footer>


  <!-- =========================
       SCRIPT
  ========================= -->

  <script>

    const cartItems =
      document.getElementById("cart-items");

    const totalElement =
      document.getElementById("total");

    const checkoutButton =
      document.getElementById("checkout-button");


    /* =========================
       LOAD CART
    ========================= */

    let cart =
      JSON.parse(
        localStorage.getItem("kinoCart")
      ) || [];


    /* =========================
       DISPLAY CART
    ========================= */

    function renderCart() {

      cartItems.innerHTML = "";

      let total = 0;


      /* EMPTY */

      if (
        !Array.isArray(cart) ||
        cart.length === 0
      ) {

        cartItems.innerHTML = `
          <div class="empty">
            Your cart is empty.
          </div>
        `;

        totalElement.textContent =
          "Total: RM0.00";

        checkoutButton.classList.add(
          "disabled"
        );

        return;
      }


      /* HAS ITEMS */

      checkoutButton.classList.remove(
        "disabled"
      );


      cart.forEach(
        (item, index) => {

          const quantity =
            Number(
              item.quantity || 1
            );

          const price =
            Number(
              item.price || 0
            );

          const subtotal =
            price * quantity;


          total += subtotal;


          cartItems.innerHTML += `

            <div class="cart-item">

              <div>

                <div class="item-name">
                  ${escapeHtml(item.name)}
                </div>

                <div class="item-price">
                  RM${price.toFixed(2)}
                  ×
                  ${quantity}
                </div>


                <div class="quantity-controls">

                  <button
                    onclick="decreaseQuantity(${index})"
                    aria-label="Decrease quantity"
                  >
                    −
                  </button>


                  <span>
                    ${quantity}
                  </span>


                  <button
                    onclick="increaseQuantity(${index})"
                    aria-label="Increase quantity"
                  >
                    +
                  </button>

                </div>

              </div>


              <button
                onclick="removeItem(${index})"
                class="remove-button"
              >
                REMOVE
              </button>

            </div>

          `;

        }
      );


      totalElement.textContent =
        `Total: RM${total.toFixed(2)}`;

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================
       REMOVE ITEM
    ========================= */

    function removeItem(index) {

      cart.splice(
        index,
        1
      );


      localStorage.setItem(
        "kinoCart",
        JSON.stringify(cart)
      );


      renderCart();

    }


    /* =========================
       INCREASE
    ========================= */

    function increaseQuantity(index) {

      cart[index].quantity =
        (cart[index].quantity || 1) + 1;


      localStorage.setItem(
        "kinoCart",
        JSON.stringify(cart)
      );


      renderCart();

    }


    /* =========================
       DECREASE
    ========================= */

    function decreaseQuantity(index) {

      const quantity =
        cart[index].quantity || 1;


      if (quantity > 1) {

        cart[index].quantity =
          quantity - 1;

      } else {

        cart.splice(
          index,
          1
        );

      }


      localStorage.setItem(
        "kinoCart",
        JSON.stringify(cart)
      );


      renderCart();

    }


    /* =========================
       START
    ========================= */

    renderCart();

  </script>

</body>
</html>
