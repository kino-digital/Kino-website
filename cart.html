<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <title>Cart | KINO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Baloo 2', sans-serif;
      background: #fff8fa;
      color: #5f4a50;
      line-height: 1.6;
    }

    header {
      background: #ffffff;
      padding: 25px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      color: #c47794;
    }

    nav a {
      text-decoration: none;
      color: #5f4a50;
      margin-left: 20px;
      font-size: 14px;
    }

    .cart {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #b96f8a;
      font-size: 34px;
      margin-bottom: 30px;
    }

    /* STORE STATUS */

    .store-status {
      text-align: center;
      padding: 14px 20px;
      border-radius: 18px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .store-status.open {
      background: #edf9f1;
      color: #5d8b70;
    }

    .store-status.closed {
      background: #fff0f3;
      color: #a96b82;
    }

    /* CART ITEM */

    .cart-item {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 18px rgba(190, 130, 150, 0.10);
    }

    .item-name {
      font-size: 18px;
      font-weight: 600;
      color: #b96f8a;
    }

    .item-price {
      color: #8a747b;
    }

    /* TOTAL */

    .total-box {
      background: #fde6ee;
      padding: 25px;
      border-radius: 20px;
      margin-top: 30px;
      text-align: center;
    }

    .total {
      font-size: 26px;
      font-weight: 700;
      color: #b96f8a;
      margin-bottom: 20px;
    }

    .checkout-button {
      display: inline-block;
      background: #d9829e;
      color: white;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 16px;
    }

    .checkout-button.disabled {
      background: #d8c9ce;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* QUANTITY */

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .quantity-controls button {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: #f7dce5;
      color: #a96b82;
      font-family: 'Baloo 2', sans-serif;
      font-size: 18px;
      cursor: pointer;
    }

    .quantity-controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .quantity-controls span {
      min-width: 20px;
      text-align: center;
      color: #8a747b;
      font-weight: 600;
    }

    /* REMOVE */

    .remove-button {
      background: #f7dce5;
      color: #a96b82;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: 'Baloo 2', sans-serif;
      font-size: 13px;
      cursor: pointer;
    }

    .remove-button:hover {
      background: #efc5d4;
    }

    /* EMPTY */

    .empty {
      text-align: center;
      color: #8a747b;
      padding: 40px;
      background: #ffffff;
      border-radius: 20px;
    }

    /* FOOTER */

    footer {
      margin-top: 70px;
      background: #fde6ee;
      padding: 25px;
      text-align: center;
      color: #8a747b;
      font-size: 14px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      header {
        flex-direction: column;
        gap: 12px;
      }

      nav {
        text-align: center;
      }

      nav a {
        margin-left: 10px;
        margin-right: 10px;
      }

      .cart {
        margin: 30px auto;
        padding: 15px;
      }

      h1 {
        font-size: 32px;
      }

      .cart-item {
        gap: 15px;
      }

    }

  </style>
</head>

<body>

<header>

  <div class="logo">
    KINO
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="stickers.html">Shop</a>
  </nav>

</header>


<main class="cart">

  <h1>
    Your Cart ♡
  </h1>


  <!-- STORE STATUS -->

  <div
    id="store-status"
    class="store-status open"
  >
    Checking KINO status...
  </div>


  <!-- CART ITEMS -->

  <div id="cart-items"></div>


  <!-- TOTAL -->

  <div class="total-box">

    <div
      class="total"
      id="total"
    >
      Total: RM0.00
    </div>

    <a
      href="checkout.html"
      id="checkout-button"
      class="checkout-button"
    >
      CHECKOUT
    </a>

  </div>

</main>


<footer>
  Made for cozy moments ♡
</footer>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  /* ==========================================
     SUPABASE
  ========================================== */

  const SUPABASE_URL =
    "https://vbdgzsapdbpgfcdksdoi.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  /* ==========================================
     ELEMENTS
  ========================================== */

  const cartItems =
    document.getElementById("cart-items");

  const totalElement =
    document.getElementById("total");

  const checkoutButton =
    document.getElementById("checkout-button");

  const storeStatus =
    document.getElementById("store-status");


  /* ==========================================
     CART
  ========================================== */

  let cart =
    JSON.parse(
      localStorage.getItem("kinoCart")
    ) || [];


  let total = 0;


  /* ==========================================
     STORE STATUS
     
     IMPORTANT:
     CUSTOMER ONLY GETS OPEN/CLOSED.
     NO SALES AMOUNT IS DISPLAYED.
  ========================================== */

  let storeIsOpen = true;


  async function checkStoreStatus() {

    try {

      /*
        Supabase RPC akan return:
        true  = open
        false = closed
      */

      const {
        data,
        error
      } = await db.rpc(
        "get_kino_store_status"
      );


      if (error) {

        console.error(
          "STORE STATUS ERROR:",
          error
        );

        /*
          Kalau status gagal dibaca,
          kita jangan terus tutup kedai.
        */

        storeIsOpen = true;

      } else {

        storeIsOpen = data === true;

      }


    } catch (error) {

      console.error(
        "STORE STATUS CHECK ERROR:",
        error
      );

      storeIsOpen = true;

    }


    updateStoreUI();

  }


  /* ==========================================
     STORE UI
  ========================================== */

  function updateStoreUI() {

    if (storeIsOpen) {

      storeStatus.textContent =
        "KINO is open ♡";

      storeStatus.className =
        "store-status open";


      checkoutButton.classList.remove(
        "disabled"
      );


      document
        .querySelectorAll(
          ".quantity-controls button"
        )
        .forEach(button => {

          button.disabled = false;

        });


    } else {

      storeStatus.textContent =
        "KINO is closed for today ♡";


      storeStatus.className =
        "store-status closed";


      checkoutButton.classList.add(
        "disabled"
      );


      document
        .querySelectorAll(
          ".quantity-controls button"
        )
        .forEach(button => {

          button.disabled = true;

        });

    }

  }


  /* ==========================================
     DISPLAY CART
  ========================================== */

  function loadCart() {

    cartItems.innerHTML = "";

    total = 0;


    if (
      !Array.isArray(cart) ||
      cart.length === 0
    ) {

      cartItems.innerHTML = `
        <div class="empty">
          Your cart is empty.
        </div>
      `;

      totalElement.textContent =
        "Total: RM0.00";

      checkoutButton.classList.add(
        "disabled"
      );

      return;

    }


    cart.forEach(
      (item, index) => {

        const quantity =
          item.quantity || 1;

        const price =
          Number(item.price || 0);


        total +=
          price * quantity;


        cartItems.innerHTML += `

          <div class="cart-item">

            <div>

              <div class="item-name">
                ${item.name}
              </div>

              <div class="item-price">
                RM${price.toFixed(2)}
                ×
                ${quantity}
              </div>


              <div class="quantity-controls">

                <button
                  onclick="decreaseQuantity(${index})"
                >
                  −
                </button>


                <span>
                  ${quantity}
                </span>


                <button
                  onclick="increaseQuantity(${index})"
                >
                  +
                </button>

              </div>

            </div>


            <button
              onclick="removeItem(${index})"
              class="remove-button"
            >
              REMOVE
            </button>

          </div>

        `;

      }
    );


    totalElement.textContent =
      `Total: RM${total.toFixed(2)}`;


    updateStoreUI();

  }


  /* ==========================================
     REMOVE
  ========================================== */

  function removeItem(index) {

    cart.splice(
      index,
      1
    );


    localStorage.setItem(
      "kinoCart",
      JSON.stringify(cart)
    );


    loadCart();

  }


  /* ==========================================
     INCREASE
  ========================================== */

  function increaseQuantity(index) {

    if (!storeIsOpen) {
      return;
    }


    cart[index].quantity =
      (cart[index].quantity || 1) + 1;


    localStorage.setItem(
      "kinoCart",
      JSON.stringify(cart)
    );


    loadCart();

  }


  /* ==========================================
     DECREASE
  ========================================== */

  function decreaseQuantity(index) {

    if (!storeIsOpen) {
      return;
    }


    const quantity =
      cart[index].quantity || 1;


    if (quantity > 1) {

      cart[index].quantity =
        quantity - 1;

    } else {

      cart.splice(
        index,
        1
      );

    }


    localStorage.setItem(
      "kinoCart",
      JSON.stringify(cart)
    );


    loadCart();

  }


  /* ==========================================
     CHECKOUT PROTECTION
  ========================================== */

  checkoutButton.addEventListener(
    "click",
    function(event) {

      if (!storeIsOpen) {

        event.preventDefault();

        alert(
          "KINO is closed for today ♡\n\nPlease come back tomorrow."
        );

      }

    }
  );


  /* ==========================================
     INITIAL LOAD
  ========================================== */

  loadCart();

  checkStoreStatus();

</script>

</body>
</html>
