<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<title>Sticker 02 | KINO</title>


<style>

/* =========================================
   GLOBAL
========================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Baloo 2', sans-serif;
  background: #fff8fa;
  color: #5f4a50;
  line-height: 1.6;
}


/* =========================================
   HEADER
========================================= */

header {
  background: #ffffff;
  padding: 25px 7%;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  text-decoration: none;

  font-size: 28px;
  font-weight: 700;

  color: #c77f91;

  letter-spacing: 3px;
}

nav {
  display: flex;
  align-items: center;
  gap: 25px;
}

nav a {
  text-decoration: none;
  color: #6f5b61;
  font-size: 15px;
}

nav a:hover {
  color: #c47794;
}


/* =========================================
   PRODUCT DETAIL
========================================= */

.product-detail {

  max-width: 850px;

  margin: 65px auto 80px;

  padding: 20px;

  text-align: center;
}


/* =========================================
   PRODUCT IMAGE
========================================= */

.product-image {

  width: 355px;
  height: 355px;

  max-width: 100%;

  object-fit: cover;

  border-radius: 28px;

  display: block;

  margin: 0 auto 35px;

  box-shadow:
    0 8px 25px
    rgba(190,130,145,0.08);
}


/* =========================================
   PRODUCT NAME
========================================= */

.product-name {

  color: #b96f84;

  font-size: 38px;

  font-weight: 700;

  margin-bottom: 10px;
}


/* =========================================
   SHORT DESCRIPTION
========================================= */

.product-short-description {

  color: #8a747b;

  font-size: 17px;

  margin-bottom: 22px;
}


/* =========================================
   PRICE
========================================= */

.product-price {

  color: #b96f84;

  font-size: 28px;

  font-weight: 700;

  margin-bottom: 22px;
}


/* =========================================
   BUY BUTTON
========================================= */

.buy-button {

  display: inline-block;

  background: #d9829e;

  color: white;

  text-decoration: none;

  padding: 13px 34px;

  border-radius: 30px;

  font-size: 15px;

  transition: 0.2s;

  border: none;

  cursor: pointer;

  font-family: 'Baloo 2', sans-serif;
}

.buy-button:hover {

  background: #c97491;

  transform: translateY(-1px);
}


/* =========================================
   ABOUT PRODUCT
========================================= */

.about-product {

  max-width: 800px;

  margin: 40px auto 0;

  background: #ffffff;

  padding: 28px 25px;

  border-radius: 25px;

  box-shadow:
    0 8px 25px
    rgba(190,130,145,0.08);
}

.about-product h2 {

  color: #b96f84;

  font-size: 21px;

  margin-bottom: 10px;
}

.about-product p {

  color: #806b72;

  font-size: 15px;

  line-height: 1.8;
}


/* =========================================
   LOADING
========================================= */

.loading {

  text-align: center;

  padding: 80px 20px;

  color: #9a858b;

  font-size: 17px;
}


/* =========================================
   MESSAGE
========================================= */

.message {

  text-align: center;

  padding: 80px 20px;

  color: #9a858b;

  font-size: 17px;
}


/* =========================================
   FOOTER
========================================= */

footer {

  background: #fce9ee;

  text-align: center;

  padding: 35px 20px;

  color: #8a747b;

  font-size: 14px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

  header {

    padding: 20px;

    flex-direction: column;

    gap: 12px;
  }

  nav {

    gap: 16px;

    flex-wrap: wrap;

    justify-content: center;
  }

  .product-detail {

    margin: 45px auto 60px;

    padding: 20px;
  }

  .product-image {

    width: 355px;

    height: 355px;

    max-width: 100%;

    border-radius: 28px;

    margin-bottom: 28px;
  }

  .product-name {

    font-size: 32px;
  }

  .product-short-description {

    font-size: 16px;
  }

  .product-price {

    font-size: 26px;
  }

  .about-product {

    padding: 25px 20px;

    margin-top: 35px;
  }

  .about-product h2 {

    font-size: 20px;
  }

  .about-product p {

    font-size: 14px;
  }

}


/* =========================================
   SMALL SCREEN
========================================= */

@media (max-width: 400px) {

  .product-image {

    width: 300px;

    height: 300px;
  }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

  <a
    href="index.html"
    class="logo"
  >
    KINO
  </a>


  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="shop.html">
      Shop
    </a>

    <a href="cart.html">
      Cart
    </a>

    <a href="affiliate.html">
      Affiliate
    </a>

  </nav>

</header>



<!-- =========================================
     PRODUCT DETAIL
========================================= -->

<main
  class="product-detail"
  id="product-detail"
>

  <div class="loading">

    Loading product... ♡

  </div>

</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

  Made for cozy moments ♡

</footer>



<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://vbdgzsapdbpgfcdksdoi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";


const {
  createClient
} = supabase;


const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================
   PRODUCT CONTAINER
========================================= */

const productDetail =
  document.getElementById(
    "product-detail"
  );


/* =========================================
   LOAD PRODUCT
========================================= */

async function loadProduct() {

  try {

    let data = null;


    /* =====================================
       METHOD 1
       FIND BY PRODUCT PAGE
    ===================================== */

    const result1 =
      await db

        .from("products")

        .select(
          "id, category, name, description, price, image_url, product_page, is_active"
        )

        .eq(
          "product_page",
          "sticker-02.html"
        )

        .eq(
          "is_active",
          true
        )

        .maybeSingle();


    if (
      !result1.error &&
      result1.data
    ) {

      data =
        result1.data;

    }


    /* =====================================
       METHOD 2
       FIND BY PRODUCT NAME
    ===================================== */

    if (!data) {

      const result2 =
        await db

          .from("products")

          .select(
            "id, category, name, description, price, image_url, product_page, is_active"
          )

          .eq(
            "category",
            "sticker"
          )

          .ilike(
            "name",
            "%02%"
          )

          .eq(
            "is_active",
            true
          )

          .limit(1);


      if (
        !result2.error &&
        result2.data &&
        result2.data.length > 0
      ) {

        data =
          result2.data[0];

      }

    }


    /* =====================================
       STILL NOT FOUND
    ===================================== */

    if (!data) {

      productDetail.innerHTML = `

        <div class="message">

          Product not found ♡

          <br><br>

          Please check Sticker Set 02
          in the Supabase products table.

        </div>

      `;

      return;

    }


    /* =====================================
       IMAGE
    ===================================== */

    const imageUrl =
      data.image_url
      ||
      "https://placehold.co/600x600/ffdfe8/765b63?text=Sticker+02";


    /* =====================================
       DESCRIPTION
    ===================================== */

    const description =
      data.description
      ||
      "Cute digital stickers for your cozy little moments.";


    /* =====================================
       PAGE TITLE
    ===================================== */

    document.title =
      data.name +
      " | KINO";


    /* =====================================
       DISPLAY PRODUCT
    ===================================== */

    productDetail.innerHTML = `

      <img
        src="${escapeHtml(imageUrl)}"
        alt="${escapeHtml(data.name)}"
        class="product-image"
      >


      <h1 class="product-name">

        ${escapeHtml(data.name)} ♡

      </h1>


      <p class="product-short-description">

        ${escapeHtml(description)}

      </p>


      <div class="product-price">

        RM${Number(data.price).toFixed(2)}

      </div>


      <button
        class="buy-button"
        id="buy-button"
      >

        BUY NOW

      </button>


      <div class="about-product">

        <h2>
          About this product ♡
        </h2>

        <p>
          ${escapeHtml(description)}
        </p>

      </div>

    `;


    /* =====================================
       BUY BUTTON
    ===================================== */

    const buyButton =
      document.getElementById(
        "buy-button"
      );


    buyButton.addEventListener(
      "click",
      function () {

        addToCart(data);

      }
    );

  }

  catch (error) {

    console.error(
      "PRODUCT LOAD ERROR:",
      error
    );

    productDetail.innerHTML = `

      <div class="message">

        Something went wrong while
        loading this product ♡

      </div>

    `;

  }

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(product) {

  let cart =
    JSON.parse(
      localStorage.getItem("kinoCart")
    ) || [];


  const existingIndex =
    cart.findIndex(
      item =>
        String(item.id) ===
        String(product.id)
    );


  /* =====================================
     EXISTING PRODUCT
  ===================================== */

  if (
    existingIndex !== -1
  ) {

    cart[existingIndex].quantity =
      (cart[existingIndex].quantity || 1) + 1;

  }


  /* =====================================
     NEW PRODUCT
  ===================================== */

  else {

    cart.push({

      id:
        product.id,

      name:
        product.name,

      price:
        Number(product.price),

      quantity:
        1

    });

  }


  /* =====================================
     SAVE CART
  ===================================== */

  localStorage.setItem(
    "kinoCart",
    JSON.stringify(cart)
  );


  /* =====================================
     GO TO CART
  ===================================== */

  window.location.href =
    "cart.html";

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   START
========================================= */

loadProduct();

</script>


</body>

</html>
