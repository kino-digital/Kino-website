<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<title>Sticker 01 | KINO</title>


<style>

/* =========================================
   GLOBAL
========================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  font-family: 'Baloo 2', sans-serif;

  background: #fff8fa;

  color: #5f4a50;

  line-height: 1.6;

}


/* =========================================
   HEADER
========================================= */

header {

  background: #ffffff;

  padding: 25px 7%;

  display: flex;

  justify-content: space-between;

  align-items: center;

}

.logo {

  text-decoration: none;

  font-size: 28px;

  font-weight: 700;

  color: #c77f91;

  letter-spacing: 3px;

}

nav {

  display: flex;

  align-items: center;

  gap: 25px;

}

nav a {

  text-decoration: none;

  color: #6f5b61;

  font-size: 15px;

}

nav a:hover {

  color: #c47794;

}


/* =========================================
   PRODUCT DETAIL
========================================= */

.product-detail {

  max-width: 900px;

  margin: 60px auto 80px;

  padding: 30px 20px;

  text-align: center;

}


/* =========================================
   PRODUCT IMAGE
========================================= */

.product-image {

  width: 360px;

  height: 360px;

  max-width: 100%;

  object-fit: cover;

  display: block;

  margin: 0 auto 32px;

  border-radius: 30px;

  box-shadow:
    0 10px 30px
    rgba(190,130,145,0.10);

}


/* =========================================
   PRODUCT NAME
========================================= */

.product-name {

  color: #b96f84;

  font-size: 38px;

  font-weight: 700;

  margin-bottom: 8px;

}


/* =========================================
   SHORT DESCRIPTION
========================================= */

.product-short-description {

  color: #8a747b;

  font-size: 17px;

  margin-bottom: 18px;

}


/* =========================================
   PRICE
========================================= */

.product-price {

  color: #b96f84;

  font-size: 27px;

  font-weight: 700;

  margin-bottom: 20px;

}


/* =========================================
   BUY BUTTON
========================================= */

.buy-button {

  display: inline-block;

  background: #d9829e;

  color: #ffffff;

  border: none;

  text-decoration: none;

  padding: 13px 36px;

  border-radius: 30px;

  font-family: 'Baloo 2', sans-serif;

  font-size: 15px;

  cursor: pointer;

  transition: 0.2s;

}

.buy-button:hover {

  background: #c97491;

  transform: translateY(-2px);

}


/* =========================================
   DESCRIPTION BOX
========================================= */

.product-description-box {

  max-width: 700px;

  margin: 38px auto 0;

  padding: 25px 25px;

  background: #ffffff;

  border-radius: 25px;

  box-shadow:
    0 8px 25px
    rgba(190,130,145,0.07);

}


/* =========================================
   DESCRIPTION TITLE
========================================= */

.product-description-title {

  color: #b96f84;

  font-size: 20px;

  font-weight: 700;

  margin-bottom: 10px;

}


/* =========================================
   LONG DESCRIPTION
========================================= */

.product-description {

  color: #806b72;

  font-size: 15px;

  line-height: 1.8;

}


/* =========================================
   LOADING
========================================= */

.loading {

  text-align: center;

  padding: 100px 20px;

  color: #9a858b;

  font-size: 17px;

}


/* =========================================
   MESSAGE
========================================= */

.message {

  text-align: center;

  padding: 100px 20px;

  color: #9a858b;

  font-size: 17px;

}


/* =========================================
   FOOTER
========================================= */

footer {

  background: #fce9ee;

  text-align: center;

  padding: 35px 20px;

  color: #8a747b;

  font-size: 14px;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

  header {

    padding: 20px;

    flex-direction: column;

    gap: 12px;

  }

  nav {

    gap: 16px;

    flex-wrap: wrap;

    justify-content: center;

  }

  .product-detail {

    margin: 40px auto 60px;

    padding: 20px;

  }

  .product-image {

    width: 300px;

    height: 300px;

    border-radius: 27px;

    margin-bottom: 28px;

  }

  .product-name {

    font-size: 32px;

  }

  .product-short-description {

    font-size: 16px;

  }

  .product-price {

    font-size: 26px;

  }

  .product-description-box {

    margin-top: 32px;

    padding: 22px 18px;

  }

}


/* =========================================
   VERY SMALL SCREEN
========================================= */

@media (max-width: 400px) {

  .product-image {

    width: 270px;

    height: 270px;

  }

  .product-name {

    font-size: 29px;

  }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

  <a
    href="index.html"
    class="logo"
  >
    KINO
  </a>


  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="shop.html">
      Shop
    </a>

    <a href="cart.html">
      Cart
    </a>

    <a href="affiliate.html">
      Affiliate
    </a>

  </nav>

</header>



<!-- =========================================
     PRODUCT
========================================= -->

<main
  class="product-detail"
  id="product-detail"
>

  <div class="loading">

    Loading product... ♡

  </div>

</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

  Made for cozy moments ♡

</footer>



<!-- =========================================
     SUPABASE
========================================= -->

<script>

const SUPABASE_URL =
  "https://vbdgzsapdbpgfcdksdoi.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";


const {
  createClient
} = supabase;


const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



/* =========================================
   PRODUCT CONTAINER
========================================= */

const productDetail =
  document.getElementById(
    "product-detail"
  );



/* =========================================
   LOAD PRODUCT
========================================= */

async function loadProduct() {

  try {

    /*
      We allow BOTH:

      sticker01.html

      AND

      sticker-01.html

      This prevents the page from
      breaking if the database uses
      either filename.
    */

    const {
      data,
      error
    } = await db

      .from("products")

      .select(
        "id, category, name, description, price, image_url, product_page"
      )

      .in(
        "product_page",
        [
          "sticker01.html",
          "sticker-01.html"
        ]
      )

      .eq(
        "category",
        "sticker"
      )

      .eq(
        "is_active",
        true
      )

      .order(
        "id",
        {
          ascending: true
        }
      )

      .limit(1);


    /* =====================================
       DATABASE ERROR
    ===================================== */

    if (error) {

      console.error(
        "PRODUCT ERROR:",
        error
      );

      productDetail.innerHTML = `

        <div class="message">

          Unable to load this product right now ♡

        </div>

      `;

      return;

    }


    /* =====================================
       PRODUCT NOT FOUND
    ===================================== */

    if (
      !data ||
      data.length === 0
    ) {

      productDetail.innerHTML = `

        <div class="message">

          Product not found ♡

          <br><br>

          Please check the product page
          in Supabase.

        </div>

      `;

      return;

    }


    /* =====================================
       PRODUCT DATA
    ===================================== */

    const product =
      data[0];


    /* =====================================
       IMAGE
    ===================================== */

    const imageUrl =
      product.image_url
      ||
      "https://placehold.co/600x600/ffdfe8/765b63?text=KINO";


    /* =====================================
       DESCRIPTION
    ===================================== */

    const shortDescription =
      product.description
      ||
      "Cute digital stickers for your cozy little moments.";


    /* =====================================
       PAGE TITLE
    ===================================== */

    document.title =
      product.name +
      " | KINO";


    /* =====================================
       DISPLAY PRODUCT
    ===================================== */

    productDetail.innerHTML = `

      <img
        src="${escapeHtml(imageUrl)}"
        alt="${escapeHtml(product.name)}"
        class="product-image"
      >


      <h1 class="product-name">

        ${escapeHtml(product.name)} ♡

      </h1>


      <p class="product-short-description">

        ${escapeHtml(shortDescription)}

      </p>


      <div class="product-price">

        RM${Number(product.price).toFixed(2)}

      </div>


      <button
        type="button"
        class="buy-button"
        id="buy-button"
      >

        BUY NOW

      </button>


      <div class="product-description-box">

        <div class="product-description-title">

          About this product ♡

        </div>


        <p class="product-description">

          ${escapeHtml(shortDescription)}

        </p>

      </div>

    `;


    /* =====================================
       BUY BUTTON
    ===================================== */

    const buyButton =
      document.getElementById(
        "buy-button"
      );


    buyButton.addEventListener(
      "click",
      function () {

        addToCart(product);

      }
    );

  }

  catch (error) {

    console.error(
      "PRODUCT LOAD ERROR:",
      error
    );

    productDetail.innerHTML = `

      <div class="message">

        Something went wrong while
        loading this product ♡

      </div>

    `;

  }

}



/* =========================================
   ADD TO CART
========================================= */

function addToCart(product) {

  let cart =
    JSON.parse(
      localStorage.getItem("kinoCart")
    ) || [];


  /* =====================================
     CHECK EXISTING PRODUCT
  ===================================== */

  const existingIndex =
    cart.findIndex(
      item =>
        String(item.id) ===
        String(product.id)
    );


  /* =====================================
     PRODUCT ALREADY EXISTS
  ===================================== */

  if (
    existingIndex !== -1
  ) {

    cart[existingIndex].quantity =
      Number(
        cart[existingIndex].quantity || 1
      ) + 1;

  }


  /* =====================================
     NEW PRODUCT
  ===================================== */

  else {

    cart.push({

      id:
        product.id,

      name:
        product.name,

      price:
        Number(product.price),

      quantity:
        1

    });

  }


  /* =====================================
     SAVE CART
  ===================================== */

  localStorage.setItem(
    "kinoCart",
    JSON.stringify(cart)
  );


  /* =====================================
     GO TO CART
  ===================================== */

  window.location.href =
    "cart.html";

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================================
   START
========================================= */

loadProduct();

</script>


</body>

</html>
