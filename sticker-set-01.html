<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<title>Sticker 01 | KINO</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  font-family: 'Baloo 2', sans-serif;

  background: #fff8fa;

  color: #5f4a50;

  line-height: 1.6;

}


/* =========================================
   HEADER
========================================= */

header {

  background: #ffffff;

  padding: 25px 7%;

  display: flex;

  justify-content: space-between;

  align-items: center;

}

.logo {

  text-decoration: none;

  font-size: 28px;

  font-weight: 700;

  color: #c77f91;

  letter-spacing: 3px;

}

nav {

  display: flex;

  align-items: center;

  gap: 25px;

}

nav a {

  text-decoration: none;

  color: #6f5b61;

  font-size: 15px;

}

nav a:hover {

  color: #c47794;

}


/* =========================================
   PRODUCT DETAIL
========================================= */

.product-detail {

  max-width: 900px;

  margin: 60px auto 80px;

  padding: 30px 20px;

  text-align: center;

}


/* =========================================
   IMAGE
========================================= */

.product-image {

  width: 360px;

  height: 360px;

  max-width: 100%;

  object-fit: cover;

  display: block;

  margin: 0 auto 32px;

  border-radius: 30px;

  box-shadow:
    0 10px 30px
    rgba(190,130,145,0.10);

}


/* =========================================
   NAME
========================================= */

.product-name {

  color: #b96f84;

  font-size: 38px;

  font-weight: 700;

  margin-bottom: 8px;

}


/* =========================================
   SHORT DESCRIPTION
========================================= */

.product-short-description {

  color: #8a747b;

  font-size: 17px;

  margin-bottom: 18px;

}


/* =========================================
   PRICE
========================================= */

.product-price {

  color: #b96f84;

  font-size: 28px;

  font-weight: 700;

  margin-bottom: 20px;

}


/* =========================================
   BUY BUTTON
========================================= */

.buy-button {

  display: inline-block;

  background: #d9829e;

  color: #ffffff;

  border: none;

  text-decoration: none;

  padding: 13px 36px;

  border-radius: 30px;

  font-family: 'Baloo 2', sans-serif;

  font-size: 15px;

  cursor: pointer;

  transition: 0.2s;

}

.buy-button:hover {

  background: #c97491;

  transform: translateY(-2px);

}


/* =========================================
   DESCRIPTION BOX
========================================= */

.product-description-box {

  max-width: 700px;

  margin: 40px auto 0;

  padding: 25px;

  background: #ffffff;

  border-radius: 25px;

  box-shadow:
    0 8px 25px
    rgba(190,130,145,0.07);

}

.product-description-title {

  color: #b96f84;

  font-size: 20px;

  font-weight: 700;

  margin-bottom: 10px;

}

.product-description {

  color: #806b72;

  font-size: 15px;

  line-height: 1.8;

}


/* =========================================
   LOADING / MESSAGE
========================================= */

.loading,
.message {

  text-align: center;

  padding: 100px 20px;

  color: #9a858b;

  font-size: 17px;

}


/* =========================================
   FOOTER
========================================= */

footer {

  background: #fce9ee;

  text-align: center;

  padding: 35px 20px;

  color: #8a747b;

  font-size: 14px;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

  header {

    padding: 20px;

    flex-direction: column;

    gap: 12px;

  }

  nav {

    gap: 16px;

    flex-wrap: wrap;

    justify-content: center;

  }

  .product-detail {

    margin: 40px auto 60px;

    padding: 20px;

  }

  .product-image {

    width: 300px;

    height: 300px;

    border-radius: 27px;

  }

  .product-name {

    font-size: 32px;

  }

  .product-short-description {

    font-size: 16px;

  }

  .product-price {

    font-size: 26px;

  }

  .product-description-box {

    margin-top: 32px;

    padding: 22px 18px;

  }

}

</style>

</head>


<body>


<header>

  <a
    href="index.html"
    class="logo"
  >
    KINO
  </a>


  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="shop.html">
      Shop
    </a>

    <a href="cart.html">
      Cart
    </a>

    <a href="affiliate.html">
      Affiliate
    </a>

  </nav>

</header>



<main
  class="product-detail"
  id="product-detail"
>

  <div class="loading">

    Loading product... ♡

  </div>

</main>



<footer>

  Made for cozy moments ♡

</footer>



<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://vbdgzsapdbpgfcdksdoi.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";


const {
  createClient
} = supabase;


const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const productDetail =
  document.getElementById(
    "product-detail"
  );


/* =========================================
   NORMALIZE TEXT
========================================= */

function normalize(value) {

  return String(value || "")
    .toLowerCase()
    .replace(
      /[^a-z0-9]/g,
      ""
    );

}


/* =========================================
   LOAD STICKER 01
========================================= */

async function loadProduct() {

  try {

    /*
      IMPORTANT:

      We no longer search for:

      product_page = sticker01.html

      Instead, we load all active stickers
      and find Sticker 01 ourselves.
    */

    const {
      data,
      error
    } = await db

      .from("products")

      .select(
        "id, category, name, description, price, image_url, product_page"
      )

      .eq(
        "category",
        "sticker"
      )

      .eq(
        "is_active",
        true
      )

      .order(
        "id",
        {
          ascending: true
        }
      );


    /* =====================================
       DATABASE ERROR
    ===================================== */

    if (error) {

      console.error(
        "SUPABASE ERROR:",
        error
      );

      productDetail.innerHTML = `

        <div class="message">

          Unable to connect to products ♡

          <br><br>

          ${escapeHtml(error.message)}

        </div>

      `;

      return;

    }


    /* =====================================
       NO STICKERS
    ===================================== */

    if (
      !data ||
      data.length === 0
    ) {

      productDetail.innerHTML = `

        <div class="message">

          No active sticker products found ♡

        </div>

      `;

      return;

    }


    /* =====================================
       FIND STICKER 01
    ===================================== */

    let product = null;


    /*
      METHOD 1
      Look at product_page
    */

    product =
      data.find(
        item => {

          const page =
            normalize(
              item.product_page
            );

          return (
            page === "sticker01html" ||
            page === "sticker01"
          );

        }
      );


    /*
      METHOD 2
      Look at product name
    */

    if (!product) {

      product =
        data.find(
          item => {

            const name =
              normalize(
                item.name
              );

            return (
              name === "sticker01" ||
              name === "sticker1"
            );

          }
        );

    }


    /*
      METHOD 3
      If this is the first sticker
      in your database, use first item.
    */

    if (!product) {

      product =
        data[0];

    }


    /* =====================================
       IMAGE
    ===================================== */

    const imageUrl =
      product.image_url
      ||
      "https://placehold.co/600x600/ffdfe8/765b63?text=KINO";


    /* =====================================
       DESCRIPTION
    ===================================== */

    const description =
      product.description
      ||
      "Cute digital stickers for your cozy little moments.";


    /* =====================================
       PAGE TITLE
    ===================================== */

    document.title =
      product.name +
      " | KINO";


    /* =====================================
       DISPLAY
    ===================================== */

    productDetail.innerHTML = `

      <img

        src="${escapeHtml(imageUrl)}"

        alt="${escapeHtml(product.name)}"

        class="product-image"

      >


      <h1 class="product-name">

        ${escapeHtml(product.name)} ♡

      </h1>


      <p class="product-short-description">

        ${escapeHtml(description)}

      </p>


      <div class="product-price">

        RM${Number(product.price).toFixed(2)}

      </div>


      <button
        type="button"
        class="buy-button"
        id="buy-button"
      >

        BUY NOW

      </button>


      <div class="product-description-box">

        <div class="product-description-title">

          About this product ♡

        </div>


        <p class="product-description">

          ${escapeHtml(description)}

        </p>

      </div>

    `;


    /* =====================================
       BUY BUTTON
    ===================================== */

    document
      .getElementById("buy-button")
      .addEventListener(
        "click",
        function () {

          addToCart(product);

        }
      );


  }

  catch (error) {

    console.error(
      "LOAD ERROR:",
      error
    );

    productDetail.innerHTML = `

      <div class="message">

        Something went wrong ♡

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

  }

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(product) {

  let cart =
    JSON.parse(
      localStorage.getItem("kinoCart")
    ) || [];


  const existingIndex =
    cart.findIndex(
      item =>
        String(item.id) ===
        String(product.id)
    );


  if (
    existingIndex !== -1
  ) {

    cart[existingIndex].quantity =
      Number(
        cart[existingIndex].quantity || 1
      ) + 1;

  }

  else {

    cart.push({

      id:
        product.id,

      name:
        product.name,

      price:
        Number(product.price),

      quantity:
        1

    });

  }


  localStorage.setItem(
    "kinoCart",
    JSON.stringify(cart)
  );


  window.location.href =
    "cart.html";

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   START
========================================= */

loadProduct();

</script>

</body>

</html>
