<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<title>EduKids 01 | KINO</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Baloo 2', sans-serif;
  background: #fff8fa;
  color: #5f4a50;
  line-height: 1.6;
}

header {
  background: #ffffff;
  padding: 25px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  text-decoration: none;
  font-size: 28px;
  font-weight: 700;
  color: #c77f91;
  letter-spacing: 3px;
}

nav {
  display: flex;
  align-items: center;
  gap: 25px;
}

nav a {
  text-decoration: none;
  color: #6f5b61;
  font-size: 15px;
}

nav a:hover {
  color: #c47794;
}

.product-detail {
  max-width: 850px;
  margin: 65px auto 80px;
  padding: 20px;
  text-align: center;
}

.product-image {
  width: 360px;
  height: 360px;
  max-width: 100%;
  object-fit: cover;
  border-radius: 28px;
  display: block;
  margin: 0 auto 35px;
  box-shadow: 0 8px 25px rgba(190,130,145,0.08);
}

.product-name {
  color: #b96f84;
  font-size: 38px;
  font-weight: 700;
  margin-bottom: 10px;
}

.product-short-description {
  color: #8a747b;
  font-size: 17px;
  margin-bottom: 22px;
}

.product-price {
  color: #b96f84;
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 22px;
}

.buy-button {
  display: inline-block;
  background: #d9829e;
  color: white;
  text-decoration: none;
  padding: 13px 34px;
  border-radius: 30px;
  font-size: 15px;
  transition: 0.2s;
  border: none;
  cursor: pointer;
  font-family: 'Baloo 2', sans-serif;
}

.buy-button:hover {
  background: #c97491;
  transform: translateY(-1px);
}

.about-box {
  max-width: 680px;
  margin: 35px auto 0;
  background: #ffffff;
  padding: 28px 25px;
  border-radius: 22px;
  box-shadow: 0 8px 25px rgba(190,130,145,0.08);
}

.about-title {
  color: #b96f84;
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 12px;
}

.product-description {
  color: #806b72;
  font-size: 15px;
  line-height: 1.8;
}

.loading,
.message {
  text-align: center;
  padding: 80px 20px;
  color: #9a858b;
  font-size: 17px;
}

footer {
  background: #fce9ee;
  text-align: center;
  padding: 35px 20px;
  color: #8a747b;
  font-size: 14px;
}

@media (max-width: 700px) {

  header {
    padding: 20px;
    flex-direction: column;
    gap: 12px;
  }

  nav {
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .product-detail {
    margin: 45px auto 60px;
    padding: 20px;
  }

  .product-image {
    width: 355px;
    height: 355px;
    max-width: 100%;
  }

  .product-name {
    font-size: 32px;
  }

  .product-short-description {
    font-size: 16px;
  }

  .product-price {
    font-size: 26px;
  }

  .about-box {
    padding: 25px 20px;
  }

}

</style>

</head>

<body>

<header>

  <a href="index.html" class="logo">
    KINO
  </a>

  <nav>

    <a href="index.html">Home</a>

    <a href="shop.html">Shop</a>

    <a href="cart.html">Cart</a>

    <a href="affiliate.html">Affiliate</a>

  </nav>

</header>


<main
  class="product-detail"
  id="product-detail"
>

  <div class="loading">
    Loading product... ♡
  </div>

</main>


<footer>
  Made for cozy moments ♡
</footer>


<script>

const SUPABASE_URL =
  "https://vbdgzsapdbpgfcdksdoi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";

const {
  createClient
} = supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

const productDetail =
  document.getElementById(
    "product-detail"
  );


async function loadProduct() {

  try {

    const {
      data,
      error
    } = await db

      .from("products")

      .select(
        "id, category, name, description, price, image_url, product_page"
      )

      .eq(
        "id",
        "edukids-01"
      )

      .eq(
        "is_active",
        true
      )

      .maybeSingle();


    if (error) {

      console.error(
        "EDUKIDS 01 ERROR:",
        error
      );

      productDetail.innerHTML = `
        <div class="message">
          Unable to load this product right now ♡
        </div>
      `;

      return;
    }


    if (!data) {

      productDetail.innerHTML = `
        <div class="message">
          EduKids 01 not found ♡
        </div>
      `;

      return;
    }


    const imageUrl =
      data.image_url ||
      "https://placehold.co/600x600/ffdfe8/765b63?text=KINO";


    const shortDescription =
      data.description ||
      "20 pages · Fun learning activities";


    document.title =
      data.name + " | KINO";


    productDetail.innerHTML = `

      <img
        src="${escapeHtml(imageUrl)}"
        alt="${escapeHtml(data.name)}"
        class="product-image"
      >

      <h1 class="product-name">
        ${escapeHtml(data.name)} ♡
      </h1>

      <p class="product-short-description">
        ${escapeHtml(shortDescription)}
      </p>

      <div class="product-price">
        RM${Number(data.price).toFixed(2)}
      </div>

      <button
        class="buy-button"
        id="buy-button"
      >
        BUY NOW
      </button>

      <div class="about-box">

        <div class="about-title">
          About this product ♡
        </div>

        <p class="product-description">
          ${escapeHtml(shortDescription)}
        </p>

      </div>

    `;


    document
      .getElementById("buy-button")
      .addEventListener(
        "click",
        function () {
          addToCart(data);
        }
      );

  }

  catch (error) {

    console.error(
      "PRODUCT LOAD ERROR:",
      error
    );

    productDetail.innerHTML = `
      <div class="message">
        Something went wrong while loading this product ♡
      </div>
    `;

  }

}


function addToCart(product) {

  let cart =
    JSON.parse(
      localStorage.getItem("kinoCart")
    ) || [];


  const existingIndex =
    cart.findIndex(
      item =>
        String(item.id) ===
        String(product.id)
    );


  if (existingIndex !== -1) {

    cart[existingIndex].quantity =
      (cart[existingIndex].quantity || 1) + 1;

  }

  else {

    cart.push({

      id: product.id,

      name: product.name,

      price: Number(product.price),

      quantity: 1

    });

  }


  localStorage.setItem(
    "kinoCart",
    JSON.stringify(cart)
  );


  window.location.href =
    "cart.html";

}


function escapeHtml(value) {

  return String(value ?? "")

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


loadProduct();

</script>

</body>

</html>
