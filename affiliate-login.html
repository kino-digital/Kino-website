<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KINO Affiliate Login</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <style>

    /* =========================================
       GLOBAL
    ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      font-family:
        "Baloo 2",
        sans-serif;

      background: #fff8fa;

      color: #5f4a50;

      line-height: 1.6;

      min-height: 100vh;

      display: flex;

      flex-direction: column;

    }


    a {

      text-decoration: none;

      color: inherit;

    }


    /* =========================================
       HEADER
    ========================================= */

    header {

      background: #ffffff;

      padding: 22px 7%;

      display: flex;

      justify-content: space-between;

      align-items: center;

      box-shadow:
        0 2px 10px
        rgba(190,130,150,.05);

    }


    .logo {

      font-size: 27px;

      font-weight: 700;

      color: #c47794;

      letter-spacing: 2px;

    }


    nav {

      display: flex;

      align-items: center;

      gap: 20px;

    }


    nav a {

      color: #5f4a50;

      font-size: 14px;

    }


    nav a:hover {

      color: #c47794;

    }


    .back-link {

      padding:
        8px 18px;

      border-radius: 20px;

      background: #fde6ee;

      color: #b96f8a !important;

      font-weight: 600;

    }


    /* =========================================
       MAIN
    ========================================= */

    main {

      flex: 1;

      display: flex;

      justify-content: center;

      align-items: center;

      padding:
        60px 20px;

    }


    /* =========================================
       LOGIN BOX
    ========================================= */

    .login-box {

      width: 100%;

      max-width: 450px;

      background: #ffffff;

      border-radius: 28px;

      padding: 40px 35px;

      box-shadow:
        0 8px 30px
        rgba(190,130,150,.10);

    }


    /* =========================================
       TITLE
    ========================================= */

    .login-header {

      text-align: center;

      margin-bottom: 30px;

    }


    .login-header h1 {

      color: #b96f8a;

      font-size: 32px;

      margin-bottom: 6px;

    }


    .login-header p {

      color: #8a747b;

      font-size: 14px;

    }


    /* =========================================
       FORM
    ========================================= */

    .form-group {

      margin-bottom: 20px;

    }


    label {

      display: block;

      color: #8a747b;

      font-size: 14px;

      margin-bottom: 7px;

    }


    input {

      width: 100%;

      padding:
        13px 15px;

      border:
        1px solid #f0d5df;

      border-radius: 15px;

      background: #fff8fa;

      font-family:
        "Baloo 2",
        sans-serif;

      font-size: 14px;

      color: #5f4a50;

    }


    input:focus {

      outline: none;

      border-color: #d9829e;

      background: #ffffff;

    }


    input::placeholder {

      color: #b9a6ac;

    }


    /* =========================================
       PASSWORD ROW
    ========================================= */

    .password-row {

      position: relative;

    }


    .password-row input {

      padding-right: 65px;

    }


    .toggle-password {

      position: absolute;

      right: 12px;

      top: 50%;

      transform:
        translateY(-50%);

      border: none;

      background: transparent;

      color: #b96f8a;

      font-family:
        "Baloo 2",
        sans-serif;

      font-size: 12px;

      cursor: pointer;

    }


    /* =========================================
       MESSAGE
    ========================================= */

    .message {

      display: none;

      padding:
        13px 16px;

      border-radius: 15px;

      margin-bottom: 20px;

      font-size: 14px;

      line-height: 1.5;

    }


    .message.error {

      background: #fff0f3;

      color: #a96b82;

    }


    .message.success {

      background: #edf9f1;

      color: #4e8a66;

    }


    .message.info {

      background: #fff8fa;

      color: #8a747b;

    }


    /* =========================================
       LOGIN BUTTON
    ========================================= */

    .login-button {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 30px;

      background: #d9829e;

      color: #ffffff;

      font-family:
        "Baloo 2",
        sans-serif;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      transition: .2s;

    }


    .login-button:hover {

      background: #c97491;

    }


    .login-button:disabled {

      opacity: .55;

      cursor: not-allowed;

    }


    /* =========================================
       EXTRA LINKS
    ========================================= */

    .extra-links {

      text-align: center;

      margin-top: 22px;

      font-size: 14px;

    }


    .extra-links a {

      color: #b96f8a;

      font-weight: 600;

    }


    .extra-links a:hover {

      color: #c47794;

    }


    .divider {

      height: 1px;

      background: #f2e1e6;

      margin:
        25px 0;

    }


    .register-text {

      text-align: center;

      color: #8a747b;

      font-size: 14px;

    }


    .register-link {

      display: inline-block;

      margin-top: 6px;

      color: #b96f8a;

      font-weight: 600;

    }


    /* =========================================
       FOOTER
    ========================================= */

    footer {

      background: #fde6ee;

      padding: 25px;

      text-align: center;

      color: #8a747b;

      font-size: 14px;

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 500px) {

      header {

        padding:
          18px 6%;

      }


      .logo {

        font-size: 24px;

      }


      nav {

        gap: 10px;

      }


      .back-link {

        padding:
          7px 14px;

      }


      main {

        padding:
          40px 16px;

      }


      .login-box {

        padding:
          30px 22px;

        border-radius: 23px;

      }


      .login-header h1 {

        font-size: 29px;

      }

    }

  </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

  <a
    href="index.html"
    class="logo"
  >
    KINO
  </a>


  <nav>

    <a
      href="affiliate.html"
      class="back-link"
    >
      Affiliate
    </a>

  </nav>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main>

  <div class="login-box">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="login-header">

      <h1>
        Welcome Back ♡
      </h1>

      <p>
        Login to your KINO Affiliate account.
      </p>

    </div>



    <!-- =====================================
         MESSAGE
    ====================================== -->

    <div
      id="message"
      class="message"
    ></div>



    <!-- =====================================
         LOGIN FORM
    ====================================== -->

    <form
      id="login-form"
    >


      <!-- EMAIL -->

      <div class="form-group">

        <label
          for="email"
        >
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Your email"
          autocomplete="email"
          required
        >

      </div>



      <!-- PASSWORD -->

      <div class="form-group">

        <label
          for="password"
        >
          Password
        </label>


        <div class="password-row">

          <input
            type="password"
            id="password"
            placeholder="Your password"
            autocomplete="current-password"
            required
          >


          <button
            type="button"
            class="toggle-password"
            id="toggle-password"
          >
            SHOW
          </button>

        </div>

      </div>



      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        class="login-button"
        id="login-button"
      >
        LOGIN
      </button>


    </form>



    <!-- =====================================
         FORGOT PASSWORD
    ====================================== -->

    <div class="extra-links">

      <a
        href="#"
        id="forgot-password"
      >
        Forgot password?
      </a>

    </div>



    <!-- =====================================
         DIVIDER
    ====================================== -->

    <div class="divider"></div>



    <!-- =====================================
         REGISTER
    ====================================== -->

    <div class="register-text">

      Don't have a KINO Affiliate account?

      <br>

      <a
        href="affiliate.html"
        class="register-link"
      >
        Become a KINO Affiliate ♡
      </a>

    </div>


  </div>

</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

  Made for cozy moments ♡

</footer>



<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://vbdgzsapdbpgfcdksdoi.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";


const {
  createClient
} = supabase;


const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



/* =========================================
   ELEMENTS
========================================= */

const loginForm =
  document.getElementById(
    "login-form"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const loginButton =
  document.getElementById(
    "login-button"
  );


const togglePassword =
  document.getElementById(
    "toggle-password"
  );


const forgotPassword =
  document.getElementById(
    "forgot-password"
  );


const message =
  document.getElementById(
    "message"
  );



/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type = "error"
) {

  message.textContent =
    text;

  message.className =
    `message ${type}`;

  message.style.display =
    "block";

}


function hideMessage() {

  message.textContent =
    "";

  message.className =
    "message";

  message.style.display =
    "none";

}



/* =========================================
   TOGGLE PASSWORD
========================================= */

togglePassword.addEventListener(
  "click",
  function () {

    if (
      passwordInput.type ===
      "password"
    ) {

      passwordInput.type =
        "text";

      togglePassword.textContent =
        "HIDE";

    }

    else {

      passwordInput.type =
        "password";

      togglePassword.textContent =
        "SHOW";

    }

  }
);



/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();

    hideMessage();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    const password =
      passwordInput.value;


    if (!email) {

      showMessage(
        "Please enter your email."
      );

      return;

    }


    if (!password) {

      showMessage(
        "Please enter your password."
      );

      return;

    }


    /* =====================================
       BUTTON
    ====================================== */

    loginButton.disabled =
      true;

    loginButton.textContent =
      "LOGGING IN...";


    try {


      /* ===================================
         SUPABASE LOGIN
      =================================== */

      const {
        data,
        error
      } =
        await db.auth.signInWithPassword({

          email:
            email,

          password:
            password

        });


      if (error) {

        throw error;

      }


      if (
        !data ||
        !data.user
      ) {

        throw new Error(
          "Unable to login."
        );

      }


      const userId =
        data.user.id;



      /* ===================================
         GET AFFILIATE
      =================================== */

      const {
        data: affiliate,
        error: affiliateError
      } =
        await db

          .from("affiliates")

          .select(
            "id, display_name, email, affiliate_code, tier, status"
          )

          .eq(
            "id",
            userId
          )

          .maybeSingle();


      if (affiliateError) {

        console.error(
          "AFFILIATE LOOKUP ERROR:",
          affiliateError
        );

        throw new Error(
          "Unable to check your affiliate account."
        );

      }


      /* ===================================
         NO AFFILIATE RECORD
      =================================== */

      if (!affiliate) {

        await db.auth.signOut();

        throw new Error(
          "Your account is not registered as a KINO Affiliate."
        );

      }



      /* ===================================
         PENDING
      =================================== */

      if (
        affiliate.status ===
        "pending"
      ) {

        showMessage(

          "Your affiliate registration is still pending approval by KINO. ♡",

          "info"

        );


        loginButton.disabled =
          false;

        loginButton.textContent =
          "LOGIN";


        return;

      }



      /* ===================================
         SUSPENDED
      =================================== */

      if (
        affiliate.status ===
        "suspended"
      ) {

        await db.auth.signOut();


        throw new Error(

          "Your KINO Affiliate account is currently suspended. Please contact KINO Admin."

        );

      }



      /* ===================================
         ACTIVE
      =================================== */

      if (
        affiliate.status ===
        "active"
      ) {

        showMessage(

          "Login successful ♡",

          "success"

        );


        loginButton.textContent =
          "WELCOME ♡";


        /*
          Give Supabase a moment
          to save the session before
          changing page.
        */

        setTimeout(
          function () {

            window.location.href =
              "affiliate-dashboard.html";

          },
          500
        );


        return;

      }



      /* ===================================
         UNKNOWN STATUS
      =================================== */

      await db.auth.signOut();


      throw new Error(

        "Your affiliate account has an invalid status. Please contact KINO Admin."

      );


    }

    catch (error) {

      console.error(
        "AFFILIATE LOGIN ERROR:",
        error
      );


      showMessage(

        error.message
        ||
        "Login failed. Please check your email and password."

      );


      loginButton.disabled =
        false;

      loginButton.textContent =
        "LOGIN";

    }

  }
);



/* =========================================
   FORGOT PASSWORD
========================================= */

forgotPassword.addEventListener(
  "click",
  async function (event) {

    event.preventDefault();

    hideMessage();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    if (!email) {

      showMessage(

        "Please enter your email first, then tap Forgot password."

      );

      emailInput.focus();

      return;

    }


    try {

      forgotPassword.textContent =
        "Sending...";


      const {
        error
      } =
        await db.auth.resetPasswordForEmail(
          email,
          {

            redirectTo:
              window.location.origin +
              "/reset-password.html"

          }
        );


      if (error) {

        throw error;

      }


      showMessage(

        "Password reset instructions have been sent to your email. ♡",

        "success"

      );


    }

    catch (error) {

      console.error(
        "PASSWORD RESET ERROR:",
        error
      );


      showMessage(

        error.message
        ||
        "Unable to send password reset email."

      );

    }


    finally {

      forgotPassword.textContent =
        "Forgot password?";

    }

  }
);

</script>


</body>

</html>
