<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <title>EduKids | KINO</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: 'Baloo 2', sans-serif;
      background: #fff8fa;
      color: #5f4a50;
      line-height: 1.6;
    }


    /* =========================================
       HEADER
    ========================================= */

    header {
      background: #ffffff;
      padding: 25px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .logo {
      font-size: 26px;
      font-weight: 700;
      color: #c47794;
    }


    nav a {
      text-decoration: none;
      color: #5f4a50;

      margin-left: 20px;

      font-size: 14px;
    }


    /* =========================================
       PRODUCTS
    ========================================= */

    .products {
      max-width: 1100px;

      margin: 50px auto;

      padding: 20px;

      text-align: center;
    }


    h1 {
      color: #b96f8a;

      font-size: 34px;

      margin-bottom: 10px;
    }


    .intro {
      color: #8a747b;

      margin-bottom: 35px;

      font-size: 16px;
    }


    /* =========================================
       PRODUCT GRID
    ========================================= */

    .product-grid {

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 25px;
    }


    /* =========================================
       PRODUCT CARD
    ========================================= */

    .product-card {

      background: #ffffff;

      padding: 25px;

      border-radius: 25px;

      box-shadow:
        0 5px 18px
        rgba(190, 130, 150, 0.12);
    }


    .product-card img {

      width: 100%;

      height: 180px;

      object-fit: cover;

      border-radius: 18px;

      margin-bottom: 18px;
    }


    .product-card h2 {

      color: #b96f8a;

      font-size: 22px;

      margin-bottom: 5px;
    }


    .product-card p {

      color: #8a747b;

      margin-bottom: 15px;
    }


    .price {

      color: #b96f8a;

      font-size: 22px;

      font-weight: 700;

      margin-bottom: 15px;
    }


    .buy-button {

      display: inline-block;

      background: #d9829e;

      color: white;

      text-decoration: none;

      padding: 10px 25px;

      border-radius: 30px;

      font-size: 15px;
    }


    /* =========================================
       LOADING
    ========================================= */

    .loading {

      color: #8a747b;

      font-size: 16px;

      padding: 40px 0;
    }


    /* =========================================
       ERROR
    ========================================= */

    .error {

      color: #a96b82;

      background: #fff0f3;

      padding: 20px;

      border-radius: 18px;

      margin-top: 20px;
    }


    /* =========================================
       FOOTER
    ========================================= */

    footer {

      margin-top: 70px;

      background: #fde6ee;

      padding: 25px;

      text-align: center;

      color: #8a747b;

      font-size: 14px;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 700px) {

      header {
        padding: 20px;
      }

      nav a {
        margin-left: 12px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       HEADER
  ========================================= -->

  <header>

    <div class="logo">
      KINO
    </div>


    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="shop.html">
        Shop
      </a>

      <a href="#">
        About
      </a>

    </nav>

  </header>



  <!-- =========================================
       PRODUCTS
  ========================================= -->

  <main class="products">


    <h1>
      EduKids ♡
    </h1>


    <p class="intro">
      Fun and simple learning activities for little learners.
    </p>


    <div
      id="product-grid"
      class="product-grid"
    >

      <div class="loading">
        Loading KINO products ♡
      </div>

    </div>


  </main>



  <!-- =========================================
       FOOTER
  ========================================= -->

  <footer>

    Made for cozy moments ♡

  </footer>



  <!-- =========================================
       SUPABASE
  ========================================= -->

  <script>

    const SUPABASE_URL =
      "https://vbdgzsapdbpgfcdksdoi.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";


    const {
      createClient
    } = supabase;


    const db =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================================
       LOAD EDUKIDS PRODUCTS
    ========================================= */

    async function loadEduKidsProducts() {

      const grid =
        document.getElementById(
          "product-grid"
        );


      try {

        const {
          data,
          error
        } = await db

          .from("products")

          .select(`
            id,
            category,
            name,
            description,
            price,
            image_url,
            product_page
          `)

          .eq(
            "category",
            "edukids"
          )

          .eq(
            "is_active",
            true
          )

          .order(
            "id"
          );


        if (error) {

          console.error(
            "EDUKIDS ERROR:",
            error
          );


          grid.innerHTML = `
            <div class="error">
              Unable to load products.
              Please try again later ♡
            </div>
          `;

          return;
        }


        if (
          !data ||
          data.length === 0
        ) {

          grid.innerHTML = `
            <div class="error">
              No EduKids products available ♡
            </div>
          `;

          return;
        }


        /* =====================================
           CREATE PRODUCT CARDS
        ===================================== */

        grid.innerHTML =
          data.map(product => `

            <div class="product-card">

              <img
                src="${product.image_url || ''}"
                alt="${product.name}"
              >

              <h2>
                ${product.name}
              </h2>

              <p>
                ${product.description || ''}
              </p>

              <div class="price">
                RM${Number(product.price).toFixed(2)}
              </div>

              <a
                href="${product.product_page}"
                class="buy-button"
              >
                BUY NOW
              </a>

            </div>

          `).join("");


      }

      catch (error) {

        console.error(
          "EDUKIDS ERROR:",
          error
        );


        grid.innerHTML = `
          <div class="error">
            Something went wrong.
            Please try again later ♡
          </div>
        `;

      }

    }


    /* =========================================
       START
    ========================================= */

    loadEduKidsProducts();

  </script>


</body>

</html>
