<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <title>Digital Journal | KINO</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Baloo 2', sans-serif;
      background: #fff8fa;
      color: #5f4a50;
      line-height: 1.6;
    }

    header {
      background: #ffffff;
      padding: 25px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      color: #c47794;
    }

    nav a {
      text-decoration: none;
      color: #5f4a50;
      margin-left: 20px;
      font-size: 14px;
    }

    .products {
      max-width: 1100px;
      margin: 50px auto;
      padding: 20px;

      text-align: center;
    }

    h1 {
      color: #b96f8a;
      font-size: 34px;
      margin-bottom: 10px;
    }

    .intro {
      color: #8a747b;
      margin-bottom: 35px;
      font-size: 16px;
    }

    .product-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 25px;
    }

    .product-card {
      background: #ffffff;

      padding: 25px;

      border-radius: 25px;

      box-shadow:
        0 5px 18px
        rgba(190, 130, 150, 0.12);
    }

    .product-card img {
      width: 100%;
      height: 180px;

      object-fit: cover;

      border-radius: 18px;

      margin-bottom: 18px;
    }

    .product-card h2 {
      color: #b96f8a;

      font-size: 22px;

      margin-bottom: 5px;
    }

    .product-card p {
      color: #8a747b;

      margin-bottom: 15px;
    }

    .price {
      color: #b96f8a;

      font-size: 22px;

      font-weight: 700;

      margin-bottom: 15px;
    }

    .buy-button {
      display: inline-block;

      background: #d9829e;

      color: white;

      text-decoration: none;

      padding: 10px 25px;

      border-radius: 30px;

      font-size: 15px;
    }

    .loading {
      color: #8a747b;

      font-size: 16px;

      padding: 30px;
    }

    .empty {
      color: #8a747b;

      padding: 30px;

      font-size: 16px;
    }

    footer {
      margin-top: 70px;

      background: #fde6ee;

      padding: 25px;

      text-align: center;

      color: #8a747b;

      font-size: 14px;
    }

    @media (max-width: 600px) {

      header {
        padding: 20px;
      }

      nav a {
        margin-left: 12px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       HEADER
  ========================================= -->

  <header>

    <div class="logo">
      KINO
    </div>


    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="shop.html">
        Shop
      </a>

      <a href="#">
        About
      </a>

    </nav>

  </header>



  <!-- =========================================
       PRODUCTS
  ========================================= -->

  <main class="products">

    <h1>
      Digital Journal ♡
    </h1>


    <p class="intro">
      Cozy digital journals for thoughts,
      memories and little everyday moments.
    </p>


    <div
      id="product-grid"
      class="product-grid"
    >

      <div class="loading">
        Loading KINO journals ♡
      </div>

    </div>

  </main>



  <!-- =========================================
       FOOTER
  ========================================= -->

  <footer>

    Made for cozy moments ♡

  </footer>



  <!-- =========================================
       SUPABASE
  ========================================= -->

  <script>

    const SUPABASE_URL =
      "https://vbdgzsapdbpgfcdksdoi.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";


    const {
      createClient
    } = supabase;


    const db =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );



    /* =========================================
       PRODUCT GRID
    ========================================= */

    const productGrid =
      document.getElementById(
        "product-grid"
      );



    /* =========================================
       LOAD JOURNAL PRODUCTS
    ========================================= */

    async function loadProducts() {

      try {

        const {
          data,
          error
        } = await db

          .from("products")

          .select(
            "id, category, name, description, price, image_url, product_page"
          )

          .eq(
            "category",
            "journal"
          )

          .eq(
            "is_active",
            true
          )

          .order(
            "id",
            {
              ascending: true
            }
          );


        if (error) {

          console.error(
            "PRODUCT LOAD ERROR:",
            error
          );

          productGrid.innerHTML = `

            <div class="empty">

              Unable to load products right now ♡

            </div>

          `;

          return;

        }


        if (
          !data ||
          data.length === 0
        ) {

          productGrid.innerHTML = `

            <div class="empty">

              No journal products available yet ♡

            </div>

          `;

          return;

        }


        renderProducts(data);

      }

      catch (error) {

        console.error(
          "PRODUCT ERROR:",
          error
        );

        productGrid.innerHTML = `

          <div class="empty">

            Something went wrong ♡

          </div>

        `;

      }

    }



    /* =========================================
       RENDER PRODUCTS
    ========================================= */

    function renderProducts(products) {

      productGrid.innerHTML = "";


      products.forEach(product => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "product-card";


        card.innerHTML = `

          <img
            src="${escapeHTML(product.image_url || '')}"
            alt="${escapeHTML(product.name)}"
          >


          <h2>
            ${escapeHTML(product.name)}
          </h2>


          <p>
            ${escapeHTML(product.description || '')}
          </p>


          <div class="price">
            RM${Number(product.price).toFixed(2).replace('.00', '')}
          </div>


          <a
            href="${escapeHTML(product.product_page || '#')}"
            class="buy-button"
          >
            BUY NOW
          </a>

        `;


        productGrid.appendChild(
          card
        );

      });

    }



    /* =========================================
       BASIC HTML ESCAPE
    ========================================= */

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    /* =========================================
       START
    ========================================= */

    loadProducts();

  </script>


</body>

</html>
