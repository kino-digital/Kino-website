<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <title>Coloring Pages | KINO</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: 'Baloo 2', sans-serif;
      background: #fff8fa;
      color: #5f4a50;
      line-height: 1.6;
    }


    header {
      background: #ffffff;
      padding: 25px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      box-shadow:
        0 2px 12px rgba(190,130,150,0.06);
    }


    .logo {
      font-size: 26px;
      font-weight: 700;
      color: #c47794;
      letter-spacing: 2px;
    }


    nav a {
      text-decoration: none;
      color: #5f4a50;
      margin-left: 20px;
      font-size: 14px;
    }


    nav a:hover {
      color: #c47794;
    }


    .products {
      max-width: 1100px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }


    h1 {
      color: #b96f8a;
      font-size: 34px;
      margin-bottom: 10px;
    }


    .intro {
      color: #8a747b;
      margin-bottom: 35px;
      font-size: 16px;
    }


    .product-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 25px;
    }


    .product-card {
      background: #ffffff;

      padding: 25px;

      border-radius: 25px;

      box-shadow:
        0 5px 18px
        rgba(190,130,150,0.12);

      transition: 0.2s;
    }


    .product-card:hover {
      transform: translateY(-3px);

      box-shadow:
        0 8px 22px
        rgba(190,130,150,0.16);
    }


    .product-card img {
      width: 100%;
      height: 180px;

      object-fit: cover;

      border-radius: 18px;

      margin-bottom: 18px;
    }


    .product-card h2 {
      color: #b96f8a;

      font-size: 22px;

      margin-bottom: 5px;
    }


    .product-card p {
      color: #8a747b;

      margin-bottom: 15px;
    }


    .price {
      color: #b96f8a;

      font-size: 22px;

      font-weight: 700;

      margin-bottom: 15px;
    }


    .buy-button {
      display: inline-block;

      background: #d9829e;

      color: white;

      text-decoration: none;

      padding: 10px 25px;

      border-radius: 30px;

      font-size: 15px;

      transition: 0.2s;
    }


    .buy-button:hover {
      background: #c97491;

      transform: translateY(-1px);
    }


    .loading,
    .empty {
      color: #9a858b;

      font-size: 16px;

      padding: 40px;
    }


    footer {
      margin-top: 70px;

      background: #fde6ee;

      padding: 25px;

      text-align: center;

      color: #8a747b;

      font-size: 14px;
    }


    @media (max-width: 700px) {

      header {
        padding: 20px;

        flex-direction: column;

        gap: 10px;
      }


      nav a {
        margin-left: 12px;
      }


      h1 {
        font-size: 32px;
      }


      .products {
        margin-top: 35px;
      }

    }

  </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

  <a
    href="index.html"
    class="logo"
  >
    KINO
  </a>


  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="shop.html">
      Shop
    </a>

    <a href="index.html#about">
      About
    </a>

  </nav>

</header>



<!-- =========================================
     PRODUCTS
========================================= -->

<main class="products">

  <h1>
    Coloring Pages ♡
  </h1>


  <p class="intro">
    Simple and cozy coloring pages for relaxing little moments.
  </p>


  <div
    id="product-grid"
    class="product-grid"
  >

    <div class="loading">
      Loading KINO coloring books ♡
    </div>

  </div>

</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

  Made for cozy moments ♡

</footer>



<!-- =========================================
     SUPABASE
========================================= -->

<script>

const SUPABASE_URL =
  "https://vbdgzsapdbpgfcdksdoi.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";


const {
  createClient
} = supabase;


const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



/* =========================================
   ELEMENT
========================================= */

const productGrid =
  document.getElementById(
    "product-grid"
  );



/* =========================================
   LOAD COLORING PRODUCTS
========================================= */

async function loadColoringProducts() {

  try {

    const {
      data,
      error
    } = await db
      .from("products")
      .select(`
        id,
        category,
        name,
        description,
        price,
        image_url,
        product_page
      `)
      .eq(
        "category",
        "coloring"
      )
      .eq(
        "is_active",
        true
      )
      .order(
        "id",
        {
          ascending: true
        }
      );


    if (error) {

      console.error(
        "COLORING PRODUCTS ERROR:",
        error
      );

      productGrid.innerHTML = `
        <div class="empty">
          Unable to load products right now ♡
        </div>
      `;

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      productGrid.innerHTML = `
        <div class="empty">
          No coloring products available right now ♡
        </div>
      `;

      return;

    }


    productGrid.innerHTML =
      data
        .map(product => {

          const price =
            Number(product.price)
              .toFixed(2)
              .replace(
                ".00",
                ""
              );


          return `

            <div class="product-card">

              <img
                src="${product.image_url || 'https://placehold.co/600x600/f7e3ed/765b63?text=KINO+Coloring'}"
                alt="${escapeHtml(product.name)}"
              >

              <h2>
                ${escapeHtml(product.name)}
              </h2>

              <p>
                ${escapeHtml(product.description || '')}
              </p>

              <div class="price">
                RM${price}
              </div>

              <a
                href="${product.product_page}"
                class="buy-button"
              >
                BUY NOW
              </a>

            </div>

          `;

        })
        .join("");

  }

  catch (error) {

    console.error(
      "COLORING ERROR:",
      error
    );

    productGrid.innerHTML = `
      <div class="empty">
        Unable to load products right now ♡
      </div>
    `;

  }

}



/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================================
   START
========================================= */

loadColoringProducts();

</script>


</body>

</html>
