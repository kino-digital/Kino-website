<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Shop All | KINO</title>

<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================================
   GLOBAL
========================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Baloo 2", sans-serif;
  background: #fff8fa;
  color: #5f4a50;
  line-height: 1.6;
}

a {
  text-decoration: none;
  color: inherit;
}


/* =========================================
   HEADER
========================================= */

header {
  background: #ffffff;

  padding: 25px 7%;

  display: flex;
  justify-content: space-between;
  align-items: center;

  box-shadow:
    0 2px 12px rgba(190,130,150,0.06);
}

.logo {
  font-size: 28px;
  font-weight: 700;

  color: #c77f91;

  letter-spacing: 3px;
}

nav {
  display: flex;
  align-items: center;
  gap: 25px;
}

nav a {
  color: #6f5b61;
  font-size: 15px;

  transition: 0.2s;
}

nav a:hover {
  color: #c47794;
}


/* =========================================
   HERO
========================================= */

.hero {
  background: #fce9ee;

  text-align: center;

  padding: 70px 20px;

  border-radius:
    0 0 45px 45px;
}

.hero h1 {
  color: #b96f84;

  font-size: 42px;

  margin-bottom: 12px;
}

.hero p {
  font-size: 17px;

  color: #806b72;
}


/* =========================================
   PRODUCTS
========================================= */

.products {
  padding: 65px 7%;

  max-width: 1200px;

  margin: auto;
}

.products-title {
  text-align: center;

  margin-bottom: 40px;
}

.products-title h2 {
  color: #b96f84;

  font-size: 30px;

  margin-bottom: 8px;
}

.products-title p {
  color: #8a747b;
}


/* =========================================
   PRODUCT GRID
========================================= */

.product-grid {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 25px;
}


/* =========================================
   PRODUCT CARD
========================================= */

.product-card {
  background: #ffffff;

  padding: 30px;

  border-radius: 25px;

  text-align: center;

  box-shadow:
    0 8px 25px
    rgba(190,130,145,0.08);

  transition: 0.2s;
}

.product-card:hover {
  transform: translateY(-3px);

  box-shadow:
    0 10px 30px
    rgba(190,130,145,0.12);
}


/* =========================================
   PRODUCT IMAGE
========================================= */

.product-card img {

  width: 100%;

  max-width: 180px;

  height: 180px;

  object-fit: cover;

  border-radius: 18px;

  margin-bottom: 18px;
}


/* =========================================
   PRODUCT NAME
========================================= */

.product-card h3 {

  color: #674f57;

  font-size: 21px;

  margin-bottom: 10px;
}


/* =========================================
   DESCRIPTION
========================================= */

.product-card p {

  color: #8a747b;

  margin-bottom: 18px;

  min-height: 28px;
}


/* =========================================
   PRICE
========================================= */

.price {

  font-size: 22px;

  font-weight: 700;

  color: #b96f84;

  margin-bottom: 18px;
}


/* =========================================
   BUY BUTTON
========================================= */

.buy-button {

  display: inline-block;

  background: #cf8799;

  color: white;

  padding: 11px 28px;

  border-radius: 30px;

  font-size: 14px;

  transition: 0.2s;
}

.buy-button:hover {

  background: #bd7188;

  transform: translateY(-1px);
}


/* =========================================
   CATEGORY LABEL
========================================= */

.category-label {

  display: inline-block;

  background: #fde6ee;

  color: #b96f84;

  padding: 4px 12px;

  border-radius: 20px;

  font-size: 12px;

  margin-bottom: 12px;

  text-transform: capitalize;
}


/* =========================================
   LOADING
========================================= */

.loading {

  text-align: center;

  padding: 50px 20px;

  color: #9a858b;

  font-size: 16px;
}


/* =========================================
   EMPTY
========================================= */

.empty {

  text-align: center;

  padding: 50px 20px;

  color: #9a858b;

  font-size: 16px;
}


/* =========================================
   ERROR
========================================= */

.error-message {

  text-align: center;

  padding: 50px 20px;

  color: #a96b82;

  font-size: 16px;
}


/* =========================================
   FOOTER
========================================= */

footer {

  background: #fce9ee;

  text-align: center;

  padding: 35px 20px;

  color: #8a747b;

  font-size: 14px;

  margin-top: 40px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

  header {

    padding: 20px;

    flex-direction: column;

    gap: 10px;
  }

  nav {

    gap: 16px;

    flex-wrap: wrap;

    justify-content: center;
  }

  .hero {

    padding: 55px 20px;
  }

  .hero h1 {

    font-size: 32px;
  }

  .product-grid {

    grid-template-columns: 1fr;
  }

  .products {

    padding:
      50px 20px;
  }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

  <a
    href="index.html"
    class="logo"
  >
    KINO
  </a>


  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="shop.html">
      Shop
    </a>

    <a href="cart.html">
      Cart
    </a>

    <a href="affiliate.html">
      Affiliate
    </a>

  </nav>

</header>



<!-- =========================================
     HERO
========================================= -->

<section class="hero">

  <h1>
    KINO Shop ♡
  </h1>

  <p>
    Explore all of our cozy digital products.
  </p>

</section>



<!-- =========================================
     PRODUCTS
========================================= -->

<section class="products">

  <div class="products-title">

    <h2>
      All KINO Products
    </h2>

    <p>
      Find something cozy for you ♡
    </p>

  </div>


  <!-- PRODUCTS WILL LOAD HERE -->

  <div
    id="product-grid"
    class="product-grid"
  >

    <div class="loading">
      Loading KINO products... ♡
    </div>

  </div>

</section>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

  Made for cozy moments ♡

</footer>



<!-- =========================================
     SUPABASE
========================================= -->

<script>

const SUPABASE_URL =
  "https://vbdgzsapdbpgfcdksdoi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_bBCTwB_oXL5QS0WLE_ydFw_wRyrRhYh";


const {
  createClient
} = supabase;


const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================
   ELEMENT
========================================= */

const productGrid =
  document.getElementById(
    "product-grid"
  );


/* =========================================
   CATEGORY NAME
========================================= */

function formatCategory(category) {

  const names = {

    sticker: "Stickers",

    planner: "Planner",

    coloring: "Coloring",

    edukids: "EduKids",

    journal: "Journal"

  };


  return (
    names[category]
    ||
    category
  );

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts() {

  try {

    const {
      data,
      error
    } = await db
      .from("products")
      .select(
        "id, category, name, description, price, image_url, product_page"
      )
      .eq(
        "is_active",
        true
      )
      .order(
        "category",
        {
          ascending: true
        }
      )
      .order(
        "id",
        {
          ascending: true
        }
      );


    if (error) {

      console.error(
        "PRODUCT ERROR:",
        error
      );

      productGrid.innerHTML = `
        <div class="error-message">
          Unable to load KINO products right now ♡
        </div>
      `;

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      productGrid.innerHTML = `
        <div class="empty">
          No products available right now ♡
        </div>
      `;

      return;

    }


    /*
      Clear loading message
    */

    productGrid.innerHTML = "";


    /*
      Create product cards
    */

    data.forEach(product => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "product-card";


      /*
        Product image
      */

      const image =
        document.createElement(
          "img"
        );

      image.src =
        product.image_url
        ||
        "https://placehold.co/600x600/ffdfe8/765b63?text=KINO";

      image.alt =
        product.name;


      /*
        Category
      */

      const category =
        document.createElement(
          "div"
        );

      category.className =
        "category-label";

      category.textContent =
        formatCategory(
          product.category
        );


      /*
        Product name
      */

      const name =
        document.createElement(
          "h3"
        );

      name.textContent =
        product.name;


      /*
        Description
      */

      const description =
        document.createElement(
          "p"
        );

      description.textContent =
        product.description
        ||
        "";


      /*
        Price
      */

      const price =
        document.createElement(
          "div"
        );

      price.className =
        "price";

      price.textContent =
        "RM" +
        Number(
          product.price
        ).toFixed(2);


      /*
        Buy button
      */

      const button =
        document.createElement(
          "a"
        );

      button.className =
        "buy-button";

      button.textContent =
        "BUY NOW";


      /*
        Use the SAME product page
        stored in database.
      */

      button.href =
        product.product_page
        ||
        "#";


      /*
        Add everything
      */

      card.appendChild(
        image
      );

      card.appendChild(
        category
      );

      card.appendChild(
        name
      );

      card.appendChild(
        description
      );

      card.appendChild(
        price
      );

      card.appendChild(
        button
      );


      productGrid.appendChild(
        card
      );

    });

  }

  catch (error) {

    console.error(
      "PRODUCT LOAD ERROR:",
      error
    );

    productGrid.innerHTML = `
      <div class="error-message">
        Something went wrong while loading products ♡
      </div>
    `;

  }

}


/* =========================================
   START
========================================= */

loadProducts();

</script>


</body>

</html>
